  // Los servidores de la jerarquía DNS atienden en el 53.
  [JERARQUIA.raiz].concat(
    Object.keys(JERARQUIA.tld).map(function (k) { return JERARQUIA.tld[k]; }),
    Object.keys(JERARQUIA.zonas).map(function (k) { return JERARQUIA.zonas[k]; })
  ).forEach(function (s) { SERVICIOS_INTERNET[s.ip] = SERVICIOS_INTERNET[s.ip] || [["udp", 53], ["tcp", 53]]; });

  function servicioConocido(protocolo, puerto) {
    return SERVICIOS_CONOCIDOS.filter(function (x) { return x.protocolo === protocolo && x.puerto === puerto; })[0] || null;
  }

  // El equipo que atiende en ip es el que respondió el ping. Si el ping
  // terminó en una nube que no tiene esa IP, atiende internet (null).
  function atiendeEn(estado, red, ip) {
    var dev = buscarDispositivo(estado, red && red.respondio);
    if (!dev) { return null; }
    var propia = (dev.interfaces || []).some(function (f) { return f.ip === ip && f.habilitada; });
    return esInternet(dev) && !propia ? null : dev;
  }

  // ¿Quién atiende protocolo/puerto en esa IP? dev es el equipo al que
  // llegó el paquete (null: internet). Devuelve el nombre del servicio o
  // null si el puerto está cerrado.
  function quienEscucha(dev, ip, protocolo, puerto) {
    if (!dev) {
      var publicos = SERVICIOS_INTERNET[ip] || [];
      return publicos.some(function (p) { return p[0] === protocolo && p[1] === puerto; })
        ? (servicioConocido(protocolo, puerto) || { nombre: protocolo.toUpperCase() + " " + puerto }).nombre : null;
    }
    if (dev.tipo !== "servidor" || !dev.servicios) { return null; }
    if (dev.servicios.dns && protocolo === "udp" && puerto === 53) { return "DNS"; }
    var propio = (dev.servicios.escuchando || []).filter(function (x) { return x.protocolo === protocolo && Number(x.puerto) === puerto; })[0];
    if (!propio) { return null; }
    return propio.nombre || (servicioConocido(protocolo, puerto) || { nombre: protocolo.toUpperCase() + " " + puerto }).nombre;

  function puertoEfimero(ip, puerto) {
    var suma = String(ip).split(".").reduce(function (a, b) { return a + Number(b); }, 0);
    return 49152 + ((suma + puerto) % 16000);
  }

  function conectar(estado, idCliente, destino, protocolo, puerto, opciones) {
    opciones = opciones || {};
    estado.ahora = opciones.ahora || Date.now();
    protocolo = protocolo === "udp" ? "udp" : "tcp";
    puerto = Number(puerto);
    var pasos = [];
    var segmentos = [];
    function agregar(titulo, detalle, ok, capa) { pasos.push({ n: pasos.length + 1, titulo: titulo, detalle: detalle, ok: !!ok, capa: capa }); }
    function fallo(diag) { return { exito: false, pasos: pasos, segmentos: segmentos, socket: null, diagnostico: diag, tramas: tramasDeSegmentos() }; }
    var red = null;
    // Cada segmento viaja por el camino de la red: los del cliente por la
    // ida, los del servidor por la vuelta.
    // Con una redirección, del router hacia adentro el puerto del servidor
    // es el interno.
    function tramasDeSegmentos() {
      var lista = tramasConexion.slice();
      var ri = red && red.redireccion;
      segmentos.forEach(function (x) {
        var base = x.de === "cliente" ? idaDe(red) : vueltaDe(red);
        base.forEach(function (t) {
          var po = x.puertoOrigen, pd = x.puertoDestino;
          if (ri && x.de === "cliente" && t.ipDestino === ri.ipInterna) { pd = ri.puertoInterno; }
          if (ri && x.de === "servidor" && t.ipOrigen === ri.ipInterna) { po = ri.puertoInterno; }
          // El nombre del protocolo sale del puerto del servidor en ese tramo.
          var puertoSrv = x.de === "cliente" ? pd : po;
          var nombreProt = x.datos && protocolo === "tcp" ? ((servicioConocido("tcp", puertoSrv) || {}).nombre || "TCP") : protocolo.toUpperCase();
          var info = po + " → " + pd + (x.flags ? " [" + x.flags.replace("-", ", ") + "]" : "") +
            (protocolo === "tcp" ? " Seq=" + x.seq + (x.ack ? " Ack=" + x.ack : "") : "") + (x.datos ? " «" + x.datos + "»" : "");
          Array.prototype.push.apply(lista, tramasCon([t], {
            protocolo: nombreProt, puertoOrigen: po, puertoDestino: pd,
            flags: x.flags || null, seq: x.seq, ack: x.ack, datos: x.datos, info: info, mensaje: protocolo.toUpperCase() + " " + info

        });
      });
      return lista;
    }
    var cliente = buscarDispositivo(estado, idCliente);
    var nombreCliente = cliente ? (cliente.nombre || cliente.id) : idCliente;
    if (!(puerto >= 1 && puerto <= 65535)) {
      return fallo({ codigo: "ENTRADA", titulo: "El puerto no es válido", explicacion: "Un puerto va de 1 a 65535.", sugerencia: "Revisá el número de puerto." });
    }
    var texto = String(destino === undefined || destino === null ? "" : destino).trim().toLowerCase();
    var ip = texto;
    var tramasConexion = [];
    if (!Red.esIpValida(texto)) {
      if (!pareceNombre(texto)) {
        return fallo({ codigo: "ENTRADA", titulo: "El destino no es válido", explicacion: "\"" + texto + "\" no es una IP ni un nombre.", sugerencia: "Escribí una IP o un nombre como www.google.com." });
      }
      var resuelto = resolverNombre(estado, idCliente, texto, "A");
      Array.prototype.push.apply(pasos, resuelto.pasos);
      Array.prototype.push.apply(tramasConexion, resuelto.tramas || []);
      if (!resuelto.exito) { return fallo(resuelto.diagnostico); }
      var as = resuelto.respuesta.registros.filter(function (x) { return x.tipo === "A"; });
      ip = as[as.length - 1].valor;
    }
    // La red tiene que llegar, de ida y de vuelta: lo dice el ping.
    var salida = cliente ? elegirInterfazOrigen(estado, cliente, ip) : null;
    var efimero = puertoEfimero((salida && salida.ip) || "0.0.0.0", puerto);
    red = ejecutarPing(estado, idCliente, ip, { registrar: false, profundidad: 0,
      paquete: { protocolo: protocolo, puertoOrigen: efimero, puertoDestino: puerto } });
    // Atiende el equipo al que llegó el paquete, no cualquiera con esa IP.
    var atiende = red.exito ? atiendeEn(estado, red, ip) : null;
    var nombreDestino = atiende ? (atiende.nombre || atiende.id) : ip;
    // Con una redirección, el servicio se busca en el puerto interno.
    var redir = red.exito ? red.redireccion : null;
    var puertoServicio = redir ? redir.puertoInterno : puerto;
    if (!red.exito) {
      agregar("Comprobar que la red llega a " + ip, "Antes de conectarse, el paquete tiene que poder ir y volver; " +
        (red.diagnostico ? red.diagnostico.titulo.charAt(0).toLowerCase() + red.diagnostico.titulo.slice(1) + "." : "no llega."), false, 3);
      return fallo(red.diagnostico);
    }
    var ida = (red.tramas || []).filter(function (t) { return t.sentido === "ida"; });
    var ipCliente = ida.length ? ida[0].ipOrigen : null;
    var ipVista = ida.length ? ida[ida.length - 1].ipOrigen : ipCliente;
    agregar("Comprobar que la red llega a " + ip, (redir
      ? "La red llega a " + ip + ", y " + nombreDe(estado, redir.router) + " redirige el puerto " + puerto + " a " + nombreDestino +
        " (" + redir.ipInterna + ":" + redir.puertoInterno + "). La respuesta vuelve: el resto es de las capas de arriba."
      : "La red llega a " + nombreDestino + " (" + ip + ") y vuelve: el resto es de las capas de arriba.") +
      (ipVista && ipVista !== ipCliente ? " Por el NAT, el servidor va a ver la conexión desde " + ipVista + "." : ""), true, 3);
    var socket = { cliente: ipCliente + ":" + efimero, servidor: ip + ":" + puerto, vistoPorServidor: (ipVista || ipCliente) + ":" + efimero, protocolo: protocolo };
    if (redir) { socket.redirigidoA = redir.ipInterna + ":" + redir.puertoInterno; }
    function seg(deCliente, flags, seq, ack, datos) {
      segmentos.push({
        n: segmentos.length + 1, de: deCliente ? "cliente" : "servidor", protocolo: protocolo,
        puertoOrigen: deCliente ? efimero : puerto, puertoDestino: deCliente ? puerto : efimero,
        flags: flags, seq: seq, ack: ack, datos: datos || null
      });
    }
    var servicio = quienEscucha(atiende, ip, protocolo, puertoServicio);
    var info = servicioConocido(protocolo, puertoServicio);
    var etiqueta = protocolo.toUpperCase() + " " + puertoServicio;
    // El ping lo contestó la nube, pero en esa IP no hay nadie (D33): ni
    // un RST ni un ICMP, el pedido se pierde.
    var nadie = !atiende && !SERVICIOS_INTERNET[ip];
    function sinRespuesta() {
      var nube = buscarDispositivo(estado, red.respondio);
      return fallo(diagnosticoDe("D33", { ip: ip, puerto: puerto, protocolo: protocolo, nube: nube ? (nube.nombre || nube.id) : null }));
    }
    if (protocolo === "tcp") {
      seg(true, "SYN", 1000, 0);
      agregar("Abrir la conexión (SYN)", nombreCliente + " elige el puerto efímero " + efimero + " y manda un SYN a " + ip + ":" + puerto +
        " (seq=1000): «quiero conectarme».", true, 4);
      if (nadie) {
        seg(true, "SYN", 1000, 0);
        seg(true, "SYN", 1000, 0);
        agregar("Esperar la respuesta al SYN", "Nadie responde: en " + ip + " no hay ningún equipo que atienda. " + nombreCliente +
          " reenvía el SYN dos veces más, esperando cada vez el doble, y abandona: la conexión no se abre por tiempo agotado.", false, 4);
        return sinRespuesta();
      }
      if (!servicio) {
        seg(false, "RST-ACK", 0, 1001);
        agregar("Recibir la respuesta al SYN", nombreDestino + " no tiene ningún programa escuchando en " + etiqueta + ": responde RST («acá no hay nadie») y la conexión no se abre.", false, 4);
        return fallo(diagnosticoDe("D31", { equipo: nombreDestino, puerto: puertoServicio, protocolo: protocolo }));
      }
      seg(false, "SYN-ACK", 5000, 1001);
      agregar("Aceptar la conexión (SYN-ACK)", servicio + " escucha en " + etiqueta + " de " + nombreDestino + ": responde SYN-ACK (seq=5000, ack=1001): «acepto, y espero tu byte 1001».", true, 4);
      seg(true, "ACK", 1001, 5001);
      agregar("Confirmar (ACK)", nombreCliente + " confirma con un ACK (ack=5001). Handshake de tres pasos completo: la conexión está establecida. " +
        "Socket: " + socket.cliente + " ↔ " + socket.servidor + ".", true, 4);
      var pedido = info ? info.pedido : "datos";
      var respuesta = info ? info.respuesta : "respuesta del servicio";
      seg(true, "PSH-ACK", 1001, 5001, pedido);
      agregar("Enviar el pedido (" + servicio + ")", nombreCliente + " manda «" + pedido + "» (" + pedido.length + " bytes, seq=1001).", true, 7);
      seg(false, "PSH-ACK", 5001, 1001 + pedido.length, respuesta);
      agregar("Recibir la respuesta", servicio + " responde «" + respuesta + "», y con ack=" + (1001 + pedido.length) + " confirma que recibió todo el pedido.", true, 7);
      var seqC = 1001 + pedido.length, seqS = 5001 + respuesta.length;
      seg(true, "FIN-ACK", seqC, seqS);
      seg(false, "FIN-ACK", seqS, seqC + 1);
      seg(true, "ACK", seqC + 1, seqS + 1);
      agregar("Cerrar la conexión (FIN)", "Los dos lados se mandan FIN y lo confirman: la conexión se cierra y el puerto " + efimero + " queda libre.", true, 4);
    } else {
      var datos = info ? info.pedido : "datos";
      seg(true, "", null, null, datos);
      agregar("Enviar el datagrama (UDP)", nombreCliente + " manda un datagrama a " + ip + ":" + puerto + " desde el puerto " + efimero +
        ". UDP no establece conexión ni confirma la entrega: si se pierde, la aplicación tiene que darse cuenta.", true, 4);
      if (nadie) {
        agregar("Recibir la respuesta", "Nadie responde: en " + ip + " no hay ningún equipo, así que tampoco llega un ICMP de «puerto inalcanzable». El datagrama se pierde en silencio.", false, 4);
        return sinRespuesta();
      }
      if (!servicio) {
        agregar("Recibir la respuesta", nombreDestino + " no tiene ningún programa escuchando en " + etiqueta + ": responde con un ICMP de «puerto inalcanzable».", false, 4);
        return fallo(diagnosticoDe("D31", { equipo: nombreDestino, puerto: puertoServicio, protocolo: protocolo }));
      }
      var resp = info ? info.respuesta : "respuesta";
      seg(false, "", null, null, resp);
      agregar("Recibir la respuesta", servicio + " responde con otro datagrama («" + resp + "»).", true, 7);
    }
    return { exito: true, pasos: pasos, segmentos: segmentos, socket: socket, diagnostico: null, servicio: servicio, tramas: tramasDeSegmentos() };
  }

  // Herramienta tipo nslookup.
  function consultarDns(estado, idCliente, nombre, tipo, opciones) {
    opciones = opciones || {};
    estado.ahora = opciones.ahora || Date.now();
    var texto = String(nombre === undefined || nombre === null ? "" : nombre).trim().toLowerCase().replace(/\.$/, "");
    var t = TIPOS_REGISTRO.indexOf(tipo) >= 0 ? tipo : "A";
    if (!pareceNombre(texto)) {
      return {
        exito: false, pasos: [], respuesta: null, saltos: [],
        diagnostico: {
          codigo: "ENTRADA", titulo: "El nombre no es válido",
          explicacion: "\"" + texto + "\" no es un nombre de dominio: tiene que tener partes separadas por puntos, como www.google.com.",
          sugerencia: "Revisá lo que escribiste."
        }
      };
    }
    return resolverNombre(estado, idCliente, texto, t);
  }

  function pareceNombre(texto) {
    return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/.test(texto) && /[a-z]/.test(texto);
  }

  function pingConNombre(estado, idOrigen, destino, opciones) {
    var texto = String(destino === undefined || destino === null ? "" : destino).trim().toLowerCase();
    if (Red.esIpValida(texto) || !pareceNombre(texto)) {
      return ejecutarPing(estado, idOrigen, Red.esIpValida(texto) ? texto : destino, opciones);
    }
    var origen = buscarDispositivo(estado, idOrigen);
    if (!origen) { return ejecutarPing(estado, idOrigen, texto, opciones); }
    var resuelto = resolverNombre(estado, idOrigen, texto, "A");
    if (!resuelto.exito) {
      return {
        exito: false, pasos: resuelto.pasos, saltos: resuelto.saltos && resuelto.saltos.length ? resuelto.saltos : [{ dispositivo: origen.id, interfaz: "" }],
        diagnostico: resuelto.diagnostico, respuestas: [], tramas: [], tramasPrevias: resuelto.tramas || []
      };
    }
    var as = resuelto.respuesta.registros.filter(function (x) { return x.tipo === "A"; });
    var ip = as.length ? as[as.length - 1].valor : null;
    var res = ejecutarPing(estado, idOrigen, ip, opciones);
    var previos = resuelto.pasos.length;
    res.pasos = resuelto.pasos.concat(res.pasos.map(function (pn) {
      return { n: pn.n + previos, titulo: pn.titulo, detalle: pn.detalle, ok: pn.ok, capa: pn.capa };
    }));
    res.nombre = texto;
    res.ipResuelta = ip;
    res.tramasPrevias = resuelto.tramas || [];
    return res;
  }

  /* ---------------- Calidad de servicio: ping de varios paquetes ----------------
   * Cada cable tiene latencia (retardoMs), jitter (jitterMs) y pérdida
   * (perdidaPct). Un ping de N paquetes recorre el mismo camino N veces:
   * cada vez suma la latencia de cada cable, más o menos su jitter, y en
   * cada cable puede perderse. Un generador con semilla hace que el mismo
   * ejercicio dé siempre lo mismo. */
  function generador(semilla) {
    var a = (semilla >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pingRepetido(estado, idOrigen, destino, opciones) {
    opciones = opciones || {};
    var cantidad = Math.max(1, Math.min(100, Number(opciones.cantidad) || 4));
    var azar = generador(opciones.semilla || 1);
    var res = ping(estado, idOrigen, destino);
    var resultado = { res: res, cantidad: cantidad, respuestas: [], estadisticas: null };
    if (!res.exito) { return resultado; }
    // Los cables del camino, de ida y de vuelta, en orden.
    var tramos = (res.tramas || []).map(function (t) {
      return (t.enlaces || []).map(function (id) {
        for (var i = 0; i < (estado.topologia.enlaces || []).length; i++) {
          if (estado.topologia.enlaces[i].id === id) { return estado.topologia.enlaces[i]; }
        }
        return null;
      }).filter(Boolean);
    });
    var cables = [].concat.apply([], tramos);
    var internet = (res.tramas || []).some(function (t) { return esInternet(buscarDispositivo(estado, t.a.dispositivo)); });
    var ttl = res.respuestas[0] ? res.respuestas[0].ttl : 64;
    for (var n = 1; n <= cantidad; n++) {
      var ms = internet ? 20 : 0;
      var perdidoEn = null;
      for (var k = 0; k < cables.length; k++) {
        var e = cables[k];
        var jit = Number(e.jitterMs) || 0;
        ms += (Number(e.retardoMs) || 0) + jit * (2 * azar() - 1);
        if ((Number(e.perdidaPct) || 0) > 0 && azar() * 100 < Number(e.perdidaPct)) { perdidoEn = e; break; }
      }
      if (perdidoEn) {
        resultado.respuestas.push({ n: n, perdido: true, enlace: perdidoEn.id });
      } else {
        resultado.respuestas.push({ n: n, ms: Math.max(1, Math.round(ms)), ttl: ttl });
      }
    }
    var recibidos = resultado.respuestas.filter(function (x) { return !x.perdido; });
    var tiempos = recibidos.map(function (x) { return x.ms; });
    resultado.estadisticas = {
      enviados: cantidad, recibidos: recibidos.length, perdidos: cantidad - recibidos.length,
      porcentajePerdida: Math.round((cantidad - recibidos.length) * 100 / cantidad),
      minimo: tiempos.length ? Math.min.apply(null, tiempos) : null,
      maximo: tiempos.length ? Math.max.apply(null, tiempos) : null,
      promedio: tiempos.length ? Math.round(tiempos.reduce(function (a, b) { return a + b; }, 0) / tiempos.length) : null
    };
    if (!recibidos.length) {
      var conPerdida = cables.filter(function (e) { return (Number(e.perdidaPct) || 0) > 0; });
      var unicos = [];
      conPerdida.forEach(function (e) { if (unicos.indexOf(e) < 0) { unicos.push(e); } });
      resultado.diagnostico = diagnosticoDe("D32", {
        enviados: cantidad,
        enlaces: unicos.map(function (e) { return "el cable " + nombreDe(estado, e.a.dispositivo) + " — " + nombreDe(estado, e.b.dispositivo); }).join(" y "),
        perdida: unicos.length ? Math.max.apply(null, unicos.map(function (e) { return Number(e.perdidaPct); })) : "?"
      });
    }
    return resultado;
  }

  function ping(estado, idOrigen, destinoIp) {
    estado.ahora = Date.now();
    return pingConNombre(estado, idOrigen, destinoIp, { registrar: true, profundidad: 0 });
  }

  function diagnosticar(estado, idOrigen, destinoIp) {
    var resultado = pingConNombre(estado, idOrigen, destinoIp, { registrar: false, profundidad: 0 });
    return resultado.diagnostico;
  }

  /* ---------------- Advertencias al configurar ---------------- */

  function advertenciasDe(estado, idDispositivo, opciones) {
    if (opciones === true || (opciones && opciones.modoDocente)) {
      return [];
    }
    var dev = buscarDispositivo(estado, idDispositivo);
    if (!dev) {
      return [];
    }
    var avisos = [];
    var vistos = {};
    function agregar(codigo, ctx) {
      if (vistos[codigo]) {
        return;
      }
      vistos[codigo] = true;
      var d = diagnosticoDe(codigo, ctx);
      avisos.push({
        codigo: d.codigo,
        titulo: d.titulo,
        explicacion: d.explicacion,
        sugerencia: d.sugerencia
      });
    }
    var i, j;
    for (i = 0; i < dev.interfaces.length; i++) {
      var iface = dev.interfaces[i];
      if (!iface.habilitada || !iface.ip || !Red.esIpValida(iface.ip)) {
        continue;
      }
      if (!prefijoValido(iface.prefijo)) {
        continue;
      }
      var red = Red.direccionDeRed(iface.ip, iface.prefijo);
      // D06: red o broadcast.
      if (Red.esDireccionDeRed(iface.ip, iface.prefijo) || Red.esBroadcast(iface.ip, iface.prefijo)) {
        agregar("D06", {
          ip: iface.ip,
          red: red,
          prefijo: iface.prefijo,
          rol: Red.esDireccionDeRed(iface.ip, iface.prefijo) ? "dirección de red" : "dirección de broadcast"
        });
      }
      // D07: duplicada en el mismo segmento.
      var pares = paresEnSegmento(estado, dev.id, iface.id);
      for (j = 0; j < pares.length; j++) {
        if (pares[j].interfaz.ip === iface.ip) {
          agregar("D07", { ip: iface.ip, origen: dev.nombre || dev.id, otro: nombreDe(estado, pares[j].dispositivo.id) });
          break;
        }
      }
      // D09: gateway fuera de la subred de todas las interfaces.
      if (dev.gateway && Red.esIpValida(dev.gateway)) {
        var gwEnAlguna = false;
        for (var k = 0; k < dev.interfaces.length; k++) {
          var otra = dev.interfaces[k];
          if (!otra.habilitada || !otra.ip || !prefijoValido(otra.prefijo)) {
            continue;
          }
          if (Red.mismaRed(otra.ip, dev.gateway, otra.prefijo)) {
            gwEnAlguna = true;
            break;
          }
        }
        if (!gwEnAlguna) {
          agregar("D09", { gateway: dev.gateway, red: red, prefijo: iface.prefijo, equipo: dev.nombre || dev.id });
        }
      }
      // D14 y D15 contra los pares del segmento.
      for (j = 0; j < pares.length; j++) {
        var par = pares[j];
        if (!prefijoValido(par.interfaz.prefijo) || !Red.esIpValida(par.interfaz.ip)) {
          continue;
        }
        var mismaMia = Red.mismaRed(iface.ip, par.interfaz.ip, iface.prefijo);
        var mismaSuya = Red.mismaRed(iface.ip, par.interfaz.ip, par.interfaz.prefijo);
        if (!mismaMia && !mismaSuya) {
          var redPar = Red.direccionDeRed(par.interfaz.ip, par.interfaz.prefijo);
          agregar("D15", {
            origen: dev.nombre || dev.id,
            destinoNombre: nombreDe(estado, par.dispositivo.id),
            redA: red + "/" + iface.prefijo,
            redB: redPar + "/" + par.interfaz.prefijo,
            aire: iface.medio === "wireless" || par.interfaz.medio === "wireless"
          });
        } else if (iface.prefijo !== par.interfaz.prefijo || mismaMia !== mismaSuya) {
          agregar("D14", {
            ipA: iface.ip, prefijoA: iface.prefijo, nombreA: dev.nombre || dev.id,
            ipB: par.interfaz.ip, prefijoB: par.interfaz.prefijo, nombreB: nombreDe(estado, par.dispositivo.id)
          });
        }
      }
    }
    // Router de borde: un puerto hacia la nube sin NAT, con redes privadas
    // detrás, deja sin respuesta todo lo que salga a internet (D28).
    if (esRouter(dev)) {
      var privada = null;
      dev.interfaces.forEach(function (f) {
        if (!privada && f.habilitada && f.ip && Red.esIpValida(f.ip) && Red.clasificar(f.ip) === "privada") { privada = f.ip; }
      });
      dev.interfaces.forEach(function (f) {
        if (!privada || f.nat || !f.habilitada) { return; }
        var haciaNube = enlacesDe(estado, dev.id, f.id).some(function (e) {
          var otro = e.a.dispositivo === dev.id && e.a.interfaz === f.id ? e.b : e.a;
          return esInternet(buscarDispositivo(estado, otro.dispositivo));
        });
        if (haciaNube) {
          agregar("D28", { ip: privada, destino: "internet", router: dev.nombre || dev.id, puerto: f.id, aviso: true });
        }
      });
    }
    return avisos;
  }

  /* ---------------- DHCP ---------------- */

  function ipANumeroSeguro(ip) {
    return Red.aNumero(ip);
  }

  function numeroAIpSeguro(n) {
    return Red.aTexto(n >>> 0);
  }

  function apipaPara(idDispositivo, idInterfaz) {
    var base = 0;
    var texto = String(idDispositivo) + ":" + String(idInterfaz);
    for (var i = 0; i < texto.length; i++) {
      base = (base * 33 + texto.charCodeAt(i)) >>> 0;
    }
    var x = 1 + (base % 200);
    var y = 1 + ((base >>> 8) % 250);
    return "169.254." + x + "." + y;
  }

  function dhcpSolicitar(estado, idDispositivo, idInterfaz) {
    var cliente = buscarDispositivo(estado, idDispositivo);
    if (!cliente) {
      return {
        exito: false,
        mensajes: [],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D01", { origen: nombreDe(estado, idDispositivo), interfaz: idInterfaz })
      };
    }
    var iface = buscarInterfaz(cliente, idInterfaz);
    if (!iface) {
      return {
        exito: false,
        mensajes: [],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D01", { origen: nombreDe(estado, idDispositivo), interfaz: idInterfaz })
      };
    }
    if (!cliente.encendido || !iface.habilitada) {
      return {
        exito: false,
        mensajes: [],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D01", { origen: nombreDe(estado, idDispositivo), interfaz: idInterfaz })
      };
    }
    var enlacesCliente = enlacesDe(estado, idDispositivo, idInterfaz);
    var enlaceCliente = null;
    for (var lic = 0; lic < enlacesCliente.length; lic++) {
      if (enlacesCliente[lic] && enlacesCliente[lic].estado === "up") {
        enlaceCliente = enlacesCliente[lic];
        break;
      }
    }
    if (!enlaceCliente) {
      return {
        exito: false,
        mensajes: [{ tipo: "discover", origen: idDispositivo, destino: "broadcast" }],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D02", { origen: nombreDe(estado, idDispositivo), interfaz: idInterfaz })
      };
    }

    // DISCOVER: difusión por todo el segmento del cliente. Cada router con
    // DHCP habilitado que la recibe responde sólo si su rango pertenece a la
    // red de la interfaz por la que le llegó.
    var inundadosCliente = enlacesDelSegmento(estado, idDispositivo, idInterfaz);
    var mensajes = [{
      tipo: "discover", origen: idDispositivo, destino: "broadcast",
      difusion: true, enlaces: [], inundados: inundadosCliente
    }];
    var servidores = [];
    var vistos = [];
    var motivos = [];
    var llenos = [];
    var claves = segmentoL2(estado, idDispositivo, idInterfaz);
    for (var i = 0; i < claves.length; i++) {
      var partes = claves[i].split(":");
      var dev = buscarDispositivo(estado, partes[0]);
      if (!esRouter(dev) || !dev.encendido || !dev.dhcp || !dev.dhcp.habilitado) {
        continue;
      }
      if (vistos.indexOf(dev.id) >= 0) {
        continue;
      }
      var ifServidor = buscarInterfaz(dev, partes.slice(1).join(":"));
      if (!ifServidor || !ifServidor.habilitada) {
        continue;
      }
      vistos.push(dev.id);
      var chequeo = poolAtiende(estado, dev, ifServidor);
      if (!chequeo.ok) {
        motivos.push(chequeo.motivo);
        continue;
      }
      var ipOfrecida = ipLibreEnPool(estado, dev, chequeo.rango, idDispositivo, idInterfaz, iface.ip);
      if (!ipOfrecida) {
        llenos.push(nombreDe(estado, dev.id));
        continue;
      }
      servidores.push({ dispositivo: dev, interfaz: ifServidor, ip: ipOfrecida });
    }

    if (servidores.length === 0) {
      var apipa = apipaPara(idDispositivo, idInterfaz);
      liberarConcesiones(estado, idDispositivo, idInterfaz);
      iface.ip = apipa;
      iface.prefijo = 16;
      iface.modo = "dhcp";
      cliente.gateway = null;
      var ctx = llenos.length ? { servidor: llenos[0] } : (motivos.length ? { motivo: motivos.join(" ") } : {});
      return {
        exito: false,
        mensajes: mensajes,
        ip: apipa,
        prefijo: 16,
        gateway: null,
        servidor: null,
        avisos: [],
        diagnostico: diagnosticoDe("D16", ctx)
      };
    }

    // OFFER: cada servidor que puede ofrece una dirección. El cliente pidió
    // las respuestas en difusión (todavía no tiene IP), así que también
    // inundan el segmento; el camino marcado es el que llega al cliente.
    for (var s = 0; s < servidores.length; s++) {
      var srv = servidores[s];
      mensajes.push({
        tipo: "offer", origen: srv.dispositivo.id, destino: idDispositivo,
        difusion: true, ip: srv.ip,
        enlaces: caminoL2(estado, srv.dispositivo.id, srv.interfaz.id, idDispositivo, idInterfaz),
        inundados: enlacesDelSegmento(estado, srv.dispositivo.id, srv.interfaz.id)
      });
    }

    // REQUEST: el cliente acepta la primera oferta y lo anuncia en difusión,
    // nombrando al servidor elegido para que los demás retiren la suya.
    var elegido = servidores[0];
    var cfg = elegido.dispositivo.dhcp;
    mensajes.push({
      tipo: "request", origen: idDispositivo, destino: "broadcast",
      difusion: true, ip: elegido.ip, servidor: elegido.dispositivo.id,
      enlaces: caminoL2(estado, idDispositivo, idInterfaz, elegido.dispositivo.id, elegido.interfaz.id),
      inundados: inundadosCliente
    });
    // ACK: el servidor elegido confirma la concesión.
    mensajes.push({
      tipo: "ack", origen: elegido.dispositivo.id, destino: idDispositivo,
      difusion: true, ip: elegido.ip,
      enlaces: caminoL2(estado, elegido.dispositivo.id, elegido.interfaz.id, idDispositivo, idInterfaz),
      inundados: enlacesDelSegmento(estado, elegido.dispositivo.id, elegido.interfaz.id)
    });

    liberarConcesiones(estado, idDispositivo, idInterfaz);
    if (!estado.concesiones[elegido.dispositivo.id]) {
      estado.concesiones[elegido.dispositivo.id] = {};
    }
    estado.concesiones[elegido.dispositivo.id][elegido.ip] = { cliente: idDispositivo, interfaz: idInterfaz, mac: iface.mac };
    iface.ip = elegido.ip;
    iface.prefijo = cfg.prefijo;
    iface.modo = "dhcp";
    cliente.gateway = cfg.gateway || null;
    return {
      exito: true,
      mensajes: mensajes,
      ip: elegido.ip,
      prefijo: cfg.prefijo,
      gateway: cfg.gateway || null,
      servidor: elegido.dispositivo.id,
      avisos: avisosPool(estado, elegido.dispositivo, elegido.interfaz),
      diagnostico: null
    };
  }

  // Rango de un servidor en números, o null si está mal cargado.
  function rangoDhcp(cfg) {
    var desde = ipANumeroSeguro(cfg.desde);
    var hasta = ipANumeroSeguro(cfg.hasta);
    if (desde === null || hasta === null || desde > hasta || !prefijoValido(cfg.prefijo)) {
      return null;
    }
    return { desde: desde, hasta: hasta };
  }

  // Un router atiende DHCP por una interfaz sólo si su rango está bien
  // cargado y pertenece a la red de esa interfaz.
  function poolAtiende(estado, router, iface) {
    var cfg = router.dhcp;
    var nombre = nombreDe(estado, router.id);
    var rango = rangoDhcp(cfg);
    if (!rango) {
      return {
        ok: false,
        motivo: nombre + " tiene el servidor DHCP habilitado, pero su rango (" + valor(cfg.desde, "?") + " – " +
          valor(cfg.hasta, "?") + " /" + valor(cfg.prefijo, "?") + ") está mal cargado."
      };
    }
    if (!iface.ip || !prefijoValido(iface.prefijo)) {
      return {
        ok: false,
        motivo: nombre + " tiene el servidor DHCP habilitado, pero su interfaz " + iface.id +
          " no tiene dirección IP: no sabe qué red atiende por ahí."
      };
    }
    if (!Red.mismaRed(cfg.desde, iface.ip, iface.prefijo) || !Red.mismaRed(cfg.hasta, iface.ip, iface.prefijo)) {
      return {
        ok: false,
        motivo: nombre + " tiene el servidor DHCP habilitado, pero su rango (" + cfg.desde + " – " + cfg.hasta +
          ") no pertenece a la red de su interfaz " + iface.id + " (" + Red.direccionDeRed(iface.ip, iface.prefijo) +
          "/" + iface.prefijo + "), así que no responde en esta red."
      };
    }
    return { ok: true, rango: rango };
  }

  // Primera dirección libre del rango. Si el cliente ya tiene una del rango
  // que nadie más usa (una renovación), se le ofrece la misma.
  function ipLibreEnPool(estado, router, rango, idCliente, idIfCliente, ipActual) {
    var concesiones = estado.concesiones[router.id] || {};
    function ocupada(ipTexto) {
      var c = concesiones[ipTexto];
      if (c && !(c.cliente === idCliente && c.interfaz === idIfCliente)) {
        return true;
      }
      var duenos = configuradosConIp(estado, ipTexto);
      for (var d = 0; d < duenos.length; d++) {
        if (duenos[d].dispositivo.id === idCliente && duenos[d].interfaz.id === idIfCliente) {
          continue;
        }
        return true;
      }
      return false;
    }
    var actual = ipActual ? ipANumeroSeguro(ipActual) : null;
    if (actual !== null && actual >= rango.desde && actual <= rango.hasta && !ocupada(ipActual)) {
      return ipActual;
    }
    for (var n = rango.desde; n <= rango.hasta; n++) {
      var textoIp = numeroAIpSeguro(n);
      if (!ocupada(textoIp)) {
        return textoIp;
      }
    }
    return null;
  }

  // Un cliente tiene a lo sumo una concesión por interfaz: al pedir de nuevo
  // se suelta la anterior, sea del servidor que sea.
  function liberarConcesiones(estado, idCliente, idIfCliente) {
    var routers = Object.keys(estado.concesiones);
    for (var r = 0; r < routers.length; r++) {
      var tabla = estado.concesiones[routers[r]];
      var ips = Object.keys(tabla);
      for (var k = 0; k < ips.length; k++) {
        if (tabla[ips[k]].cliente === idCliente && tabla[ips[k]].interfaz === idIfCliente) {
          delete tabla[ips[k]];
        }
      }
    }
  }

  // Lo que un servidor real entregaría igual, pero deja al cliente mal
  // configurado: se avisa sin cortar el DORA.
  function avisosPool(estado, router, iface) {
    var cfg = router.dhcp;
    var nombre = nombreDe(estado, router.id);
    var avisos = [];
    var red = Red.direccionDeRed(cfg.desde, cfg.prefijo) + "/" + cfg.prefijo;
    if (!cfg.gateway) {
      avisos.push(nombre + " no entrega puerta de enlace: el equipo sólo podrá hablar dentro de su red.");
    } else if (!Red.mismaRed(cfg.gateway, cfg.desde, cfg.prefijo)) {
      avisos.push("La puerta de enlace " + cfg.gateway + " que entrega " + nombre + " no está en la red " + red +
        ": el equipo no podrá salir de su red.");
    }
    if (iface && prefijoValido(iface.prefijo) && iface.prefijo !== cfg.prefijo) {
      avisos.push(nombre + " entrega el prefijo /" + cfg.prefijo + ", pero la red de su interfaz " + iface.id +
        " es /" + iface.prefijo + ".");
    }
    return avisos;
  }

  // Las concesiones se deducen de la topología: cada interfaz en modo DHCP
  // con una dirección que un servidor de su segmento atiende tiene concesión
  // de ese servidor. Así sobreviven a reconstruir el estado y a exportar.
  function reconstruirConcesiones(estado) {
    var ids = Object.keys(estado.porDispositivo);
    for (var i = 0; i < ids.length; i++) {
      var dev = estado.porDispositivo[ids[i]];
      if (esRouter(dev) || esConmutador(dev)) {
        continue;
      }
      for (var j = 0; j < dev.interfaces.length; j++) {
        var iface = dev.interfaces[j];
        if (iface.modo !== "dhcp" || !iface.ip || Red.clasificar(iface.ip) === "apipa") {
          continue;
        }
        var n = ipANumeroSeguro(iface.ip);
        var claves = segmentoL2(estado, dev.id, iface.id);
        for (var k = 0; k < claves.length; k++) {
          var partes = claves[k].split(":");
          var router = buscarDispositivo(estado, partes[0]);
          if (!esRouter(router) || !router.dhcp || !router.dhcp.habilitado) {
            continue;
          }
          var chequeo = poolAtiende(estado, router, buscarInterfaz(router, partes.slice(1).join(":")) || {});
          if (!chequeo.ok || n === null || n < chequeo.rango.desde || n > chequeo.rango.hasta) {
            continue;
          }
          if (!estado.concesiones[router.id]) {
            estado.concesiones[router.id] = {};
          }
          if (!estado.concesiones[router.id][iface.ip]) {
            estado.concesiones[router.id][iface.ip] = { cliente: dev.id, interfaz: iface.id, mac: iface.mac };
          }
          break;
        }
      }
    }
  }

  // Avisos de configuración de un servidor DHCP, para mostrarlos en su panel
  // antes de que algún cliente pida: el rango tiene que caer en la red de
  // alguna de sus interfaces, y lo que entrega tiene que tener sentido.
  function avisosServidorDhcp(estado, idRouter) {
    var router = buscarDispositivo(estado, idRouter);
    if (!router || !router.dhcp || !router.dhcp.habilitado) {
      return [];
    }
    for (var i = 0; i < router.interfaces.length; i++) {
      var chequeo = poolAtiende(estado, router, router.interfaces[i]);
      if (chequeo.ok) {
        return avisosPool(estado, router, router.interfaces[i]);
      }
      if (!rangoDhcp(router.dhcp)) {
        return [chequeo.motivo];
      }
    }
    return [nombreDe(estado, idRouter) + " tiene el servidor DHCP habilitado, pero su rango (" + router.dhcp.desde +
      " – " + router.dhcp.hasta + ") no pertenece a la red de ninguna de sus interfaces: no va a responder a nadie."];
  }

  /* ---------------- Tablas ---------------- */

  function tablaArp(estado, idDispositivo) {
    var tabla = estado.arp[idDispositivo] || [];
    var copia = [];
    for (var i = 0; i < tabla.length; i++) {
      if (tabla[i].vence >= estado.ahora) {
        copia.push({ ip: tabla[i].ip, mac: tabla[i].mac, vence: tabla[i].vence });
      }
    }
    return copia;
  }

  function tablaMac(estado, idSwitch) {
    var tabla = estado.mac[idSwitch] || [];
    var copia = [];
    for (var i = 0; i < tabla.length; i++) {
      if (tabla[i].vence >= estado.ahora) {
        copia.push({ mac: tabla[i].mac, puerto: tabla[i].puerto, vence: tabla[i].vence });
      }
    }
    return copia;
  }

  /* ---------------- Autopruebas ----------------
   * Topologías mínimas en memoria. Cada una arma lo justo para aislar un
   * diagnóstico, sin depender de los ejemplos de la capa 3. */

  function fabPc(id, ip, prefijo, gateway, extra) {
    extra = extra || {};
    return {
      id: id,
      tipo: "pc",
      nombre: id,
      x: extra.x !== undefined ? extra.x : 100,
      y: extra.y !== undefined ? extra.y : 100,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: [
        {
          id: "eth0",
          nombre: "eth0",
          medio: "ethernet",
          habilitada: extra.habilitada !== undefined ? extra.habilitada : true,
          modo: extra.modo || "estatico",
          ip: ip !== undefined ? ip : null,
          prefijo: prefijo !== undefined ? prefijo : 24,
          mac: "02:00:00:00:01:" + id.slice(-2).padStart(2, "0")
        },
        {
          id: "wlan0",
          nombre: "wlan0",
          medio: "wireless",
          habilitada: false,
          modo: "estatico",
          ip: null,
          prefijo: 24,
          mac: "02:00:00:00:02:" + id.slice(-2).padStart(2, "0")
        }
      ],
      gateway: gateway !== undefined ? gateway : null,
      dns: "8.8.8.8",
      rutas: [],
      dhcp: null
    };
  }

  function fabSwitch(id, extra) {
    extra = extra || {};
    var interfaces = [];
    for (var i = 1; i <= 8; i++) {
      interfaces.push({
        id: "fa0/" + i,
        nombre: "fa0/" + i,
        medio: "ethernet",
        habilitada: true,
        modo: "estatico",
        ip: null,
        prefijo: 24,
        mac: "02:00:00:00:03:0" + i
      });
    }
    interfaces.push({
      id: "fib0", nombre: "fib0", medio: "fibra", habilitada: true,
      modo: "estatico", ip: null, prefijo: 24, mac: "02:00:00:00:03:09"
    });
    return {
      id: id, tipo: "switch-l2", nombre: id,
      x: extra.x !== undefined ? extra.x : 200,
      y: extra.y !== undefined ? extra.y : 200,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: interfaces,
      gateway: null, dns: null, rutas: [], dhcp: null
    };
  }

  // Punto de acceso: bridge de capa 2 entre el aire (wlan0, modo ap) y el
  // cable (eth0). No enruta; la IP es sólo de gestión y puede ser nula.
  function fabAp(id, ipGestion, extra) {
    extra = extra || {};
    return {
      id: id, tipo: "ap", nombre: id,
      x: extra.x !== undefined ? extra.x : 200,
      y: extra.y !== undefined ? extra.y : 200,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: [
        {
          id: "wlan0", nombre: "wlan0", medio: "wireless", modoRadio: "ap",
          habilitada: true, modo: "estatico",
          ip: ipGestion || null, prefijo: 24,
          mac: "02:00:00:00:05:01"
        },
        {
          id: "eth0", nombre: "eth0", medio: "ethernet", modoRadio: null,
          habilitada: true, modo: "estatico",
          ip: null, prefijo: 24,
          mac: "02:00:00:00:05:02"
        }
      ],
      gateway: null, dns: null, rutas: [], dhcp: null
    };
  }

  function fabRouter(id, bocas, rutas, extra) {
    extra = extra || {};
    // bocas: [{id, ip, prefijo, medio, modoRadio, habilitada}]
    var interfaces = [];
    for (var i = 0; i < bocas.length; i++) {
      interfaces.push({
        id: bocas[i].id,
        nombre: bocas[i].id,
        medio: bocas[i].medio || "ethernet",
        modoRadio: bocas[i].modoRadio || null,
        habilitada: bocas[i].habilitada !== undefined ? bocas[i].habilitada : true,
        modo: "estatico",
        ip: bocas[i].ip || null,
        prefijo: bocas[i].prefijo !== undefined ? bocas[i].prefijo : 24,
        mac: "02:00:00:00:04:0" + (i + 1)
      });
    }
    return {
      id: id, tipo: "router", nombre: id,
      x: extra.x !== undefined ? extra.x : 300,
      y: extra.y !== undefined ? extra.y : 200,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: interfaces,
      gateway: null, dns: null,
      rutas: rutas || [],
      dhcp: extra.dhcp || null
    };
  }

  function fabEnlace(id, aDev, aIf, bDev, bIf, extra) {
    extra = extra || {};
    return {
      id: id,
      a: { dispositivo: aDev, interfaz: aIf },
      b: { dispositivo: bDev, interfaz: bIf },
      tipo: extra.tipo || "ethernet",
      estado: extra.estado || "up",
      velocidadMbps: 100,
      retardoMs: 1
    };
  }

  function fabTopo(dispositivos, enlaces) {
    return {
      version: 1,
      nombre: "prueba",
      dispositivos: dispositivos,
      enlaces: enlaces,
      escenario: null
    };
  }

  function autopruebas() {
    var total = 0;
    var pasadas = 0;
    var fallos = [];

    function comparar(nombre, obtenido, esperado) {
      total += 1;
      var a = JSON.stringify(obtenido);
      var b = JSON.stringify(esperado);
      if (a === b) {
        pasadas += 1;
      } else {
        fallos.push({ nombre: nombre, esperado: esperado, obtenido: obtenido });
      }
    }

    // 1. D01: interfaz deshabilitada.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.1", { habilitada: false }),
         fabPc("pc2", "192.168.1.20", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D01 interfaz deshabilitada", ping(est, "pc1", "192.168.1.1").diagnostico.codigo, "D01");
    })();

    // 2. D02: enlace en down.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.1"),
         fabRouter("r1", [{ id: "g0/0", ip: "192.168.1.1", prefijo: 24 }], []),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1", { estado: "down" }),
         fabEnlace("l2", "r1", "g0/0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D02 enlace caido", ping(est, "pc1", "192.168.1.1").diagnostico.codigo, "D02");
    })();

    // 3. D03: medios incompatibles (fibra contra ethernet).
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1", { tipo: "fibra" })]);
      var est = crearEstado(topo);
      comparar("D03 medios incompatibles", ping(est, "pc1", "192.168.1.20").diagnostico.codigo, "D03");
    })();

    // 4. D04: sin IP.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", null, 24, null),
         fabPc("pc2", "192.168.1.20", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D04 sin IP", ping(est, "pc1", "192.168.1.20").diagnostico.codigo, "D04");
    })();

    // 5. D05: prefijo inválido.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 33, null),
         fabPc("pc2", "192.168.1.20", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D05 mascara invalida", ping(est, "pc1", "192.168.1.20").diagnostico.codigo, "D05");
    })();

    // 6. D06: broadcast .95/27.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "10.45.7.95", 27, "10.45.7.65"),
         fabPc("pc2", "10.45.7.66", 27, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D06 broadcast", ping(est, "pc1", "10.45.7.66").diagnostico.codigo, "D06");
    })();

    // 7. D07: misma IP en el mismo segmento.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, null),
         fabPc("pc2", "192.168.1.10", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D07 duplicada", ping(est, "pc1", "192.168.1.10").diagnostico.codigo, "D07");
    })();

    // 8. D08: sin gateway a otra subred.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1")]);
      var est = crearEstado(topo);
      comparar("D08 sin gateway", ping(est, "pc1", "192.168.2.10").diagnostico.codigo, "D08");
    })();

    // 9. D09: gateway fuera de la subred. La tabla pedía 10.45.7.66/28 con
    // gateway 10.45.7.65, pero con aritmética correcta ambos caen en
    // 10.45.7.64/28 y no hay D09 (ver nota al final). Se prueba la intención
    // didáctica con una IP que sí queda fuera: 10.45.7.98/28 vs 10.45.7.65.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "10.45.7.98", 28, "10.45.7.65"),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1")]);
      var est = crearEstado(topo);
      comparar("D09 gateway fuera de subred", ping(est, "pc1", "8.8.8.8").diagnostico.codigo, "D09");
    })();

    // 10. D10: gateway sin ARP.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.99"),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1")]);
      var est = crearEstado(topo);
      comparar("D10 gateway sin ARP", ping(est, "pc1", "8.8.8.8").diagnostico.codigo, "D10");
    })();

    // 11. D11: router de ida sin ruta.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.1"),
         fabRouter("r1", [{ id: "g0/0", ip: "192.168.1.1", prefijo: 24 }], []),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "r1", "g0/0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      var res = ping(est, "pc1", "10.99.99.1");
      comparar("D11 sin ruta", res.diagnostico.codigo, "D11");
    })();

    // 12. D12: ida completa, falta la vuelta (pc2 sin gateway).
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.1"),
         fabRouter("r1", [
           { id: "g0/0", ip: "192.168.1.1", prefijo: 24 },

    "8-puertos": [
      { id: "ether1", medio: "ethernet" },
      { id: "ether2", medio: "ethernet" },
      { id: "ether3", medio: "ethernet" },
      { id: "ether4", medio: "ethernet" },
      { id: "ether5", medio: "ethernet" },
      { id: "ether6", medio: "ethernet" },
      { id: "ether7", medio: "ethernet" },
      { id: "ether8", medio: "ethernet" },
      { id: "sfp1", medio: "fibra" },
      { id: "wlan1", medio: "wireless" }
    ],
    // Firewall: un router con estado (deja volver las respuestas de lo que
    // permitió) y puertos con nombre de rol.
    firewall: [
      { id: "wan", medio: "ethernet" },
      { id: "lan1", medio: "ethernet" },
      { id: "lan2", medio: "ethernet" },
      { id: "lan3", medio: "ethernet" },
      { id: "dmz", medio: "ethernet" }
    ]
  };

  // Los routers y firewalls admiten cualquier juego de puertos, dentro de
  // este rango; el modelo sólo da el juego inicial y el estilo de nombres.
  var PUERTOS_ROUTER_MIN = 1;
  var PUERTOS_ROUTER_MAX = 16;

  // Switches de 24 y 48 puertos, además del estándar de 8.
  function puertosSwitch(n) {
    var lista = [];
    for (var i = 1; i <= n; i++) { lista.push({ id: "fa0/" + i, medio: "ethernet" }); }
    lista.push({ id: "fib0", medio: "fibra" });
    return lista;
  }
  // El hub repite todo por todos sus puertos: 8 de cobre, sin fibra.
  function puertosHub() {
    var lista = [];
    for (var i = 1; i <= 8; i++) { lista.push({ id: "fa0/" + i, medio: "ethernet" }); }
    return lista;
  }
  var MODELOS_SWITCH = { "24-puertos": puertosSwitch(24), "48-puertos": puertosSwitch(48), hub: puertosHub() };

  /* ---------------- Servidor DNS ----------------
   * servicios.dns = { zona, recursivo, registros: [{ nombre, tipo, valor,
   * prioridad?, ttl? }] }. El servidor es autoritativo de su zona: los
   * registros tienen que ser de esa zona. */
  var TIPOS_REGISTRO = ["A", "CNAME", "MX", "NS"];

  function esNombreDominio(texto) {
    return typeof texto === "string" &&
      /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/.test(texto);
  }

  function dentroDeZona(nombre, zona) {
    return nombre === zona || nombre.slice(-(zona.length + 1)) === "." + zona;
  }

  // Puertos en escucha de un servidor: { protocolo, puerto, nombre }.
  function validarEscuchando(d, etiqueta, anotar) {
    var lista = d.servicios && d.servicios.escuchando;
    if (lista === undefined || lista === null) { return; }
    var campo = etiqueta + ".servicios.escuchando";
    if (d.tipo !== "servidor") {
      anotar(campo, "Sólo un servidor atiende servicios en puertos, y \"" + d.id + "\" es " + d.tipo + ".");
      return;
    }
    if (!Array.isArray(lista)) {
      anotar(campo, "Los servicios del servidor \"" + d.id + "\" tienen que ser una lista.");
      return;
    }
    var vistos = {};
    lista.forEach(function (x, i) {
      var c = campo + "[" + i + "]";
      var quien = "El servicio " + (i + 1) + " del servidor \"" + d.id + "\"";
      if (!x || (x.protocolo !== "tcp" && x.protocolo !== "udp")) {
        anotar(c + ".protocolo", quien + " tiene que ser tcp o udp.");
        return;
      }
      var n = Number(x.puerto);
      if (!(n >= 1 && n <= 65535) || Math.floor(n) !== n) {
        anotar(c + ".puerto", quien + " tiene el puerto " + JSON.stringify(x.puerto) + ": va de 1 a 65535.");
        return;
      }
      var clave = x.protocolo + n;
      if (vistos[clave]) {
        anotar(c + ".puerto", quien + " repite " + x.protocolo.toUpperCase() + " " + n + ": un puerto lo atiende un solo servicio.");
      }
      vistos[clave] = true;
    });
  }

  // Calidad del enlace: latencia, jitter y pérdida.
  function validarCalidad(e, anotar) {
    var campo = "enlaces." + e.id;
    if (e.retardoMs !== undefined && e.retardoMs !== null && !(Number(e.retardoMs) >= 0)) {
      anotar(campo + ".retardoMs", "La latencia del cable \"" + e.id + "\" tiene que ser un número de milisegundos (0 o más).");
    }
    if (e.jitterMs !== undefined && e.jitterMs !== null && !(Number(e.jitterMs) >= 0)) {
      anotar(campo + ".jitterMs", "El jitter del cable \"" + e.id + "\" tiene que ser un número de milisegundos (0 o más).");
    }
    if (e.perdidaPct !== undefined && e.perdidaPct !== null && !(Number(e.perdidaPct) >= 0 && Number(e.perdidaPct) <= 100)) {
      anotar(campo + ".perdidaPct", "La pérdida del cable \"" + e.id + "\" es un porcentaje: va de 0 a 100.");
    }
  }

  function validarServiciosDns(d, etiqueta, anotar) {
    validarEscuchando(d, etiqueta, anotar);
    var dns = d.servicios && d.servicios.dns;
    if (d.servicios === undefined || d.servicios === null || dns === undefined || dns === null) {
      return;
    }
    var campo = etiqueta + ".servicios.dns";
    if (d.tipo !== "servidor") {
      anotar(campo, "Sólo un servidor da el servicio de DNS, y \"" + d.id + "\" es " + d.tipo + ".");
      return;
    }
    if (!esNombreDominio(dns.zona)) {
      anotar(campo + ".zona", "La zona DNS del servidor \"" + d.id + "\" tiene que ser un nombre de dominio, por ejemplo oficina.local.");
    }
    if (dns.recursivo !== undefined && typeof dns.recursivo !== "boolean") {
      anotar(campo + ".recursivo", "El servidor \"" + d.id + "\" no indica bien si resuelve nombres de afuera (va true o false).");
    }
    if (!Array.isArray(dns.registros)) {
      anotar(campo + ".registros", "Los registros DNS del servidor \"" + d.id + "\" tienen que ser una lista.");
      return;
    }
    dns.registros.forEach(function (reg, i) {
      var c = campo + ".registros[" + i + "]";
      var quien = "El registro " + (i + 1) + " del servidor \"" + d.id + "\"";
      if (!reg || !esNombreDominio(reg.nombre)) {
        anotar(c + ".nombre", quien + " no tiene un nombre válido (por ejemplo www.oficina.local).");
        return;
      }
      if (esNombreDominio(dns.zona) && !dentroDeZona(reg.nombre, dns.zona)) {
        anotar(c + ".nombre", quien + " (" + reg.nombre + ") no pertenece a la zona " + dns.zona + ".");
      }
      if (TIPOS_REGISTRO.indexOf(reg.tipo) < 0) {
        anotar(c + ".tipo", quien + " tiene un tipo que no existe: puede ser " + TIPOS_REGISTRO.join(", ") + ".");
        return;
      }
      if (reg.tipo === "A" && !Red.esIpValida(String(reg.valor || ""))) {
        anotar(c + ".valor", quien + " es de tipo A: su valor tiene que ser una IP.");
      } else if (reg.tipo !== "A" && !esNombreDominio(reg.valor)) {
        anotar(c + ".valor", quien + " es de tipo " + reg.tipo + ": su valor tiene que ser un nombre, no una IP.");
      }
      if (reg.prioridad !== undefined && reg.prioridad !== null && (reg.tipo !== "MX" || !(Number(reg.prioridad) >= 0))) {
        anotar(c + ".prioridad", quien + ": la prioridad sólo va en un MX y es un número.");
      }
      if (reg.ttl !== undefined && reg.ttl !== null && !(Number(reg.ttl) > 0)) {
        anotar(c + ".ttl", quien + ": el TTL tiene que ser una cantidad de segundos mayor que cero.");
      }
    });
  }

  function interfacesEsperadas(dispositivo) {
    if (dispositivo.tipo === "router" && dispositivo.modelo && MODELOS_ROUTER[dispositivo.modelo]) {
      return MODELOS_ROUTER[dispositivo.modelo];
    }
    if (dispositivo.tipo === "switch-l2" && dispositivo.modelo && MODELOS_SWITCH[dispositivo.modelo]) {
      return MODELOS_SWITCH[dispositivo.modelo];
    }
    return INTERFACES_ESPERADAS[dispositivo.tipo] || [];
  }

  /* Estilo de nombres de los puertos de un router, según su modelo:
   * estándar g0/0, fib0, wlan0; tipo MikroTik ether1, sfp1, wlan1;
   * firewall wan, lan1, dmz…, sfp1, wlan1. */
  var ESTILOS_PUERTOS = {
    estandar: { ethernet: ["g0/", 0], fibra: ["fib", 0], wireless: ["wlan", 0] },
    "8-puertos": { ethernet: ["ether", 1], fibra: ["sfp", 1], wireless: ["wlan", 1] },
    firewall: { ethernet: ["lan", 1], fibra: ["sfp", 1], wireless: ["wlan", 1] }
  };

  function estiloDe(dispositivo) {
    return ESTILOS_PUERTOS[(dispositivo && dispositivo.modelo) || "estandar"] || ESTILOS_PUERTOS.estandar;
  }

  // Primer nombre libre para un puerto nuevo de ese medio.
  function nombrePuertoLibre(dispositivo, medio, ocupados) {
    var regla = estiloDe(dispositivo)[medio] || ["p", 1];
    var usados = {};
    (dispositivo.interfaces || []).forEach(function (f) { usados[f.id] = true; });
    (ocupados || []).forEach(function (id) { usados[id] = true; });
    for (var n = regla[1]; n < regla[1] + 100; n++) {
      if (!usados[regla[0] + n]) { return regla[0] + n; }
    }
    return null;
  }

  /* Cambia el modelo de un router (o de un switch) sobre la topología dada.
   * En un router, los puertos se renombran al estilo nuevo en el mismo
   * orden, conservando medio, IP y cables; también se actualizan las
   * referencias "equipo:puerto" del escenario. En un switch, el juego de
   * puertos pasa a ser el del modelo, y no se puede quitar uno con cable.
   * Devuelve { ok, error }. */
  function cambiarModelo(topologia, idDispositivo, modeloNuevo) {
    var d = buscarDispositivo(topologia, idDispositivo);
    if (!d) { return { ok: false, error: "No existe el equipo." }; }
    modeloNuevo = modeloNuevo || null;
    var conCable = function (idIf) {
      return (topologia.enlaces || []).some(function (e) {
        return (e.a.dispositivo === d.id && e.a.interfaz === idIf) || (e.b.dispositivo === d.id && e.b.interfaz === idIf);
      });
    };
    if (d.tipo === "switch-l2") {
      if (modeloNuevo && !MODELOS_SWITCH[modeloNuevo]) { return { ok: false, error: "Ese modelo de switch no existe." }; }
      var juego = modeloNuevo ? MODELOS_SWITCH[modeloNuevo] : INTERFACES_ESPERADAS["switch-l2"];
      var quedan = {};
      juego.forEach(function (p) { quedan[p.id] = true; });
      var conflicto = d.interfaces.filter(function (f) { return !quedan[f.id] && conCable(f.id); });
      if (conflicto.length) {
        return { ok: false, error: "Desconectá primero los cables de " + conflicto.map(function (f) { return f.id; }).join(", ") +
          ": esos puertos no existen en el modelo nuevo." };
      }
      var actuales = {};
      d.interfaces.forEach(function (f) { actuales[f.id] = f; });
      d.interfaces = juego.map(function (p) {
        return actuales[p.id] || { id: p.id, nombre: p.id, medio: p.medio, habilitada: true, modo: "estatico", ip: null, prefijo: 24, mac: null };
      });
      if (modeloNuevo) { d.modelo = modeloNuevo; } else { delete d.modelo; }
      return { ok: true };
    }
    if (d.tipo !== "router") { return { ok: false, error: "Sólo los routers y los switches tienen modelo." }; }
    if (modeloNuevo && !MODELOS_ROUTER[modeloNuevo]) { return { ok: false, error: "Ese modelo de router no existe." }; }
    if (modeloNuevo) { d.modelo = modeloNuevo; } else { delete d.modelo; }
    // Nombres nuevos, en orden y por medio. El firewall llama "wan" a su
    // primer puerto de cobre.
    var asignados = [];
    var cambios = {};
    var primerCobre = true;
    d.interfaces.forEach(function (f) {
      var nuevo;
      if (modeloNuevo === "firewall" && f.medio === "ethernet" && primerCobre) {
        nuevo = "wan";
      } else {
        nuevo = nombrePuertoLibre({ modelo: d.modelo, interfaces: [] }, f.medio, asignados.concat(["wan"]));
      }
      if (f.medio === "ethernet") { primerCobre = false; }
      asignados.push(nuevo);
      cambios[f.id] = nuevo;
    });
    d.interfaces.forEach(function (f) { f.id = cambios[f.id]; f.nombre = f.id; });
    (topologia.enlaces || []).forEach(function (e) {
      ["a", "b"].forEach(function (lado) {
        if (e[lado].dispositivo === d.id && cambios[e[lado].interfaz]) { e[lado].interfaz = cambios[e[lado].interfaz]; }
      });
    });
    renombrarEnEscenario(topologia.escenario, d.id, cambios);
    return { ok: true, cambios: cambios };
  }

  // Las referencias "equipo:puerto" del escenario siguen al puerto renombrado.
  function renombrarEnEscenario(escenario, idDispositivo, cambios) {
    if (!escenario || typeof escenario !== "object") { return; }
    function nueva(ref) {
      var texto = String(ref);
      var corte = texto.indexOf(":");
      if (corte < 0 || texto.slice(0, corte) !== idDispositivo) { return ref; }
      var puerto = texto.slice(corte + 1);
      return cambios[puerto] ? idDispositivo + ":" + cambios[puerto] : ref;
    }
    normalizarSectores(escenario).forEach(function (sec) {
      ["dispositivos", "equipos", "ids", "equiposIds", "hostsLista"].forEach(function (campo) {
        if (Array.isArray(sec[campo])) { sec[campo] = sec[campo].map(nueva); }
      });
    });
    if (escenario.diseno && escenario.diseno.hosts) {
      var hosts = {};
      Object.keys(escenario.diseno.hosts).forEach(function (clave) {
        hosts[clave.split("+").map(nueva).sort().join("+")] = escenario.diseno.hosts[clave];
      });
      escenario.diseno.hosts = hosts;
    }
  }

  // Modo de radio efectivo de una interfaz wireless. Si no está declarado se
  // usa el valor inicial por tipo (ap en puntos de acceso y routers, cliente
  // en el resto), igual que hace el Motor.
  function modoEfectivo(topologia, idDispositivo, idInterfaz) {
    var dev = buscarDispositivo(topologia, idDispositivo);
    var iface = buscarInterfaz(dev, idInterfaz);
    if (!iface || iface.medio !== "wireless") {
      return null;
    }
    if (iface.modoRadio === "ap" || iface.modoRadio === "cliente" || iface.modoRadio === "bridge") {
      return iface.modoRadio;
    }
    if (dev && (dev.tipo === "ap" || dev.tipo === "router")) {
      return "ap";
    }
    return "cliente";
  }

  /* ---------------- Utilidades internas ---------------- */

  // Copia profunda por JSON: las topologías son sólo datos, sin funciones.
  function clonar(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  var PALABRA_MEDIO = { ethernet: "de cobre", fibra: "de fibra", wireless: "inalámbrico" };

  function palabraMedio(medio) {
    return PALABRA_MEDIO[medio] || String(medio);
  }

  function esEnteroPrefijo(valor) {
    return typeof valor === "number" && Number.isInteger(valor) && valor >= 0 && valor <= 32;
  }

  function textoNoVacio(valor) {
    return typeof valor === "string" && valor.trim() !== "";
  }

  function buscarDispositivo(topologia, idDispositivo) {
    if (!topologia || !topologia.dispositivos) {
      return null;
    }
    for (var i = 0; i < topologia.dispositivos.length; i++) {
      if (topologia.dispositivos[i].id === idDispositivo) {
        return topologia.dispositivos[i];
      }
    }
    return null;
  }

  function buscarInterfaz(dispositivo, idInterfaz) {
    if (!dispositivo || !dispositivo.interfaces) {
      return null;
    }
    for (var i = 0; i < dispositivo.interfaces.length; i++) {
      if (dispositivo.interfaces[i].id === idInterfaz) {
        return dispositivo.interfaces[i];
      }
    }
    return null;
  }

  function buscarEnlace(topologia, idEnlace) {
    if (!topologia || !topologia.enlaces) {
      return null;
    }
    for (var i = 0; i < topologia.enlaces.length; i++) {
      if (topologia.enlaces[i].id === idEnlace) {
        return topologia.enlaces[i];
      }
    }
    return null;
  }

  // Primera interfaz con IP válida: primero entre las habilitadas, si no
  // entre todas. Sirve para saber con qué dirección se presenta un equipo.
  function primeraIpDe(dispositivo) {
    if (!dispositivo || !dispositivo.interfaces) {
      return null;
    }
    var i;
    for (i = 0; i < dispositivo.interfaces.length; i++) {
      var a = dispositivo.interfaces[i];
      if (a.habilitada && textoNoVacio(a.ip) && Red.esIpValida(a.ip)) {
        return { interfaz: a, ip: a.ip.trim(), prefijo: a.prefijo };
      }
    }
    for (i = 0; i < dispositivo.interfaces.length; i++) {
      var b = dispositivo.interfaces[i];
      if (textoNoVacio(b.ip) && Red.esIpValida(b.ip)) {
        return { interfaz: b, ip: b.ip.trim(), prefijo: b.prefijo };
      }
    }
    return null;
  }

  /* ---------------- Validación e importación ---------------- */

  function validarTopologia(obj) {
    var errores = [];

    function anotar(campo, mensaje) {
      errores.push({ campo: campo, mensaje: mensaje });
    }

    if (!obj || typeof obj !== "object" || Array.isArray(obj)) {
      anotar("topologia", "El archivo no tiene el formato de una red del simulador.");
      return { ok: false, errores: errores };
    }

    // Versión presente y soportada.
    if (obj.version === undefined || obj.version === null) {
      anotar("version", "El archivo no indica su versión: puede no ser un archivo del simulador.");
    } else if (obj.version !== VERSION_FORMATO) {
      anotar("version", "El archivo es de una versión del simulador que esta no reconoce (versión " + JSON.stringify(obj.version) + ").");
    }

    // Sin mutar el objeto recibido: se trabaja sobre listas locales.
    var listaDispositivos = Array.isArray(obj.dispositivos) ? obj.dispositivos : null;
    var listaEnlaces = Array.isArray(obj.enlaces) ? obj.enlaces : null;
    if (!listaDispositivos) {
      anotar("dispositivos", "El archivo no trae la lista de equipos.");
      listaDispositivos = [];
    }
    if (!listaEnlaces) {
      anotar("enlaces", "El archivo no trae la lista de cables.");
      listaEnlaces = [];
    }

    // Ids de dispositivo únicos en toda la topología.
    var vistosDisp = {};
    var i;
    for (i = 0; i < listaDispositivos.length; i++) {
      var dev = listaDispositivos[i];
      var idDev = dev && dev.id;
      if (!textoNoVacio(idDev)) {
        anotar("dispositivos[" + i + "].id", "Hay un equipo sin identificador.");
        continue;
      }
      if (vistosDisp[idDev]) {
        anotar("dispositivos", "Hay dos equipos con el mismo identificador (\"" + idDev + "\").");
      } else {
        vistosDisp[idDev] = true;
      }
    }

    // Por dispositivo: tipo, interfaces, IPs y prefijos.
    for (i = 0; i < listaDispositivos.length; i++) {
      var d = listaDispositivos[i];
      if (!d || !textoNoVacio(d.id)) {
        continue;
      }
      var etiqueta = "dispositivos." + d.id;

      if (TIPOS_VALIDOS.indexOf(d.tipo) < 0) {
        anotar(etiqueta + ".tipo", "El equipo \"" + d.id + "\" es de un tipo que el simulador no conoce (" + JSON.stringify(d.tipo) + "). " +
          "Los tipos válidos son PC, router, switch, cámara, IoT, punto de acceso e internet.");
        continue;
      }
      if (typeof d.encendido !== "boolean") {
        anotar(etiqueta + ".encendido", "El equipo \"" + d.id + "\" no indica bien si está encendido (va true o false).");
      }
      if (typeof d.x !== "number" || !isFinite(d.x) || typeof d.y !== "number" || !isFinite(d.y)) {
        anotar(etiqueta, "El equipo \"" + d.id + "\" no tiene una posición válida en el lienzo (x e y tienen que ser números).");
      }

      if (!Array.isArray(d.interfaces)) {
        anotar(etiqueta + ".interfaces", "El equipo \"" + d.id + "\" no trae sus puertos.");
        continue;
      }

      // Ids de interfaz únicos dentro del dispositivo.
      var vistasIf = {};
      var j;
      for (j = 0; j < d.interfaces.length; j++) {
        var iface = d.interfaces[j];
        var idIf = iface && iface.id;
        if (!textoNoVacio(idIf)) {
          anotar(etiqueta + ".interfaces[" + j + "].id", "Un puerto del equipo \"" + d.id + "\" no tiene nombre.");
          continue;
        }
        if (vistasIf[idIf]) {
          anotar(etiqueta + ".interfaces", "El equipo \"" + d.id + "\" tiene dos puertos llamados \"" + idIf + "\".");
        } else {
          vistasIf[idIf] = true;
        }
      }

      // Juego de interfaces coherente con la tabla del §4 del BASE.
      if (d.modelo !== undefined && d.modelo !== null) {
        if (d.tipo !== "router" && d.tipo !== "switch-l2") {
          anotar(etiqueta + ".modelo", "Solo los routers y los switches tienen modelo, y \"" + d.id + "\" es " + d.tipo + ".");
        } else if (d.tipo === "router" && !MODELOS_ROUTER[d.modelo]) {
          anotar(etiqueta + ".modelo", "El router \"" + d.id + "\" tiene un modelo que no existe: puede ser el estándar (sin modelo), \"8-puertos\" o \"firewall\".");
        } else if (d.tipo === "switch-l2" && !MODELOS_SWITCH[d.modelo]) {
          anotar(etiqueta + ".modelo", "El switch \"" + d.id + "\" tiene un modelo que no existe: puede ser el estándar (sin modelo), \"24-puertos\", \"48-puertos\" o \"hub\".");
        }
      }
      var esperadas = interfacesEsperadas(d);
      var nombresEsperados = esperadas.map(function (e) { return e.id; }).join(", ");
      if (d.tipo === "router") {
        // Los routers y firewalls tienen puertos libres: sólo se controla la
        // cantidad (los nombres únicos y los medios se revisan aparte).
        if (d.interfaces.length < PUERTOS_ROUTER_MIN || d.interfaces.length > PUERTOS_ROUTER_MAX) {
          anotar(etiqueta + ".interfaces", "El router \"" + d.id + "\" tiene " + d.interfaces.length + " puertos: puede tener entre " +
            PUERTOS_ROUTER_MIN + " y " + PUERTOS_ROUTER_MAX + ".");
        }
      } else if (d.interfaces.length !== esperadas.length) {
        anotar(etiqueta + ".interfaces", "El equipo \"" + d.id + "\" (" + d.tipo + ") no tiene los puertos esperados: " + nombresEsperados + ".");
      } else {
        for (j = 0; j < esperadas.length; j++) {
          var esp = esperadas[j];
          var real = buscarInterfaz(d, esp.id);
          if (!real) {
            anotar(etiqueta + ".interfaces", "Al equipo \"" + d.id + "\" le falta el puerto " + esp.id + " (tendría que tener " + nombresEsperados + ").");
          } else if (real.medio !== esp.medio) {
            anotar(etiqueta + ".interfaces." + esp.id, "El puerto " + esp.id + " del equipo \"" + d.id + "\" tendría que ser " + palabraMedio(esp.medio) + ".");
          }
        }
      }

      // IPs, prefijos y máscaras de cada interfaz.
      for (j = 0; j < d.interfaces.length; j++) {
        var f = d.interfaces[j];
        if (!f || !textoNoVacio(f.id)) {
          continue;
        }
        var campoBase = etiqueta + ".interfaces." + f.id;
        if (typeof f.habilitada !== "boolean") {
          anotar(campoBase + ".habilitada", "El puerto " + f.id + " del equipo \"" + d.id + "\" no indica bien si está habilitado (va true o false).");
        }
        if (f.ip !== undefined && f.ip !== null && String(f.ip).trim() !== "") {
          if (!Red.esIpValida(String(f.ip))) {
            anotar(campoBase + ".ip", "El puerto " + f.id + " del equipo \"" + d.id + "\" tiene una IP que no es válida (" + JSON.stringify(f.ip) + ").");
          }
        }
        if (!esEnteroPrefijo(f.prefijo)) {
          anotar(campoBase + ".prefijo", "El puerto " + f.id + " del equipo \"" + d.id + "\" tiene un prefijo inválido: tiene que ser un número entre 0 y 32.");
        } else {
          var mascaraDerivada = Red.prefijoAMascara(f.prefijo);
          if (mascaraDerivada === null || !Red.esMascaraValida(mascaraDerivada)) {
            anotar(campoBase + ".prefijo", "El puerto " + f.id + " del equipo \"" + d.id + "\" tiene una máscara inválida (prefijo " + f.prefijo + ").");
          }
        }
        if (f.mascara !== undefined && f.mascara !== null && String(f.mascara).trim() !== "") {
          if (!Red.esMascaraValida(String(f.mascara))) {
            anotar(campoBase + ".mascara", "El puerto " + f.id + " del equipo \"" + d.id + "\" tiene una máscara inválida: los unos no son contiguos.");
          }
        }
        if (f.medio !== undefined && MEDIOS_VALIDOS.indexOf(f.medio) < 0) {
          anotar(campoBase + ".medio", "El puerto " + f.id + " del equipo \"" + d.id + "\" es de un medio que no existe (" + JSON.stringify(f.medio) + "): puede ser ethernet, fibra o wireless.");
        }
        // El modo de radio sólo existe en interfaces wireless.
        if (f.modoRadio !== undefined && f.modoRadio !== null && String(f.modoRadio).trim() !== "") {
          if (f.medio !== "wireless") {
            anotar(campoBase + ".modoRadio", "El modo de radio solo se usa en puertos inalámbricos, y " + f.id + " del equipo \"" + d.id + "\" es " + palabraMedio(f.medio) + ".");
          } else if (["ap", "cliente", "bridge"].indexOf(f.modoRadio) < 0) {
            anotar(campoBase + ".modoRadio", "El puerto " + f.id + " del equipo \"" + d.id + "\" tiene un modo de radio que no existe: puede ser ap, cliente o bridge.");
          }
        }
        // NAT de salida: sólo en puertos de router o firewall.
        if (f.nat !== undefined && f.nat !== null) {
          if (typeof f.nat !== "boolean") {
            anotar(campoBase + ".nat", "El puerto " + f.id + " del equipo \"" + d.id + "\" no indica bien si hace NAT (va true o false).");
          } else if (f.nat && d.tipo !== "router") {
            anotar(campoBase + ".nat", "Sólo los routers y los firewalls hacen NAT, y \"" + d.id + "\" es " + d.tipo + ".");
          }
        }
      }

      // Puerta de enlace y DNS, cuando están presentes.
      if (d.gateway !== undefined && d.gateway !== null && String(d.gateway).trim() !== "") {
        if (!Red.esIpValida(String(d.gateway))) {
          anotar(etiqueta + ".gateway", "La puerta de enlace del equipo \"" + d.id + "\" no es una IP válida (" + JSON.stringify(d.gateway) + ").");
        }
      }
      if (d.dns !== undefined && d.dns !== null && String(d.dns).trim() !== "") {
        if (!Red.esIpValida(String(d.dns))) {
          anotar(etiqueta + ".dns", "El servidor DNS del equipo \"" + d.id + "\" no es una IP válida (" + JSON.stringify(d.dns) + ").");
        }
      }
      validarServiciosDns(d, etiqueta, anotar);

      // Rutas de los routers.
      if (d.rutas !== undefined && d.rutas !== null) {
        if (!Array.isArray(d.rutas)) {
          anotar(etiqueta + ".rutas", "La tabla de rutas del router \"" + d.id + "\" no tiene el formato correcto (tiene que ser una lista).");
        } else {
          for (var r = 0; r < d.rutas.length; r++) {
            var ruta = d.rutas[r];
            var campoRuta = etiqueta + ".rutas[" + r + "]";
            if (!ruta || !Red.esIpValida(String(ruta.destino || ""))) {
              anotar(campoRuta, "Una ruta del router \"" + d.id + "\" tiene un destino que no es una IP válida.");
            }
            if (!ruta || !esEnteroPrefijo(ruta.prefijo)) {
              anotar(campoRuta, "Una ruta del router \"" + d.id + "\" tiene un prefijo inválido: tiene que ser un número entre 0 y 32.");
            }
            if (ruta && ruta.siguienteSalto !== undefined && ruta.siguienteSalto !== null && String(ruta.siguienteSalto).trim() !== "") {
              if (!Red.esIpValida(String(ruta.siguienteSalto))) {
                anotar(campoRuta, "Una ruta del router \"" + d.id + "\" tiene un siguiente salto que no es una IP válida (" + JSON.stringify(ruta.siguienteSalto) + ").");
              }
            }
          }
        }
      }

      // Reglas de filtrado de los routers: acción y dos redes en formato CIDR.
      if (d.reglas !== undefined && d.reglas !== null) {
        if (!Array.isArray(d.reglas)) {
          anotar(etiqueta + ".reglas", "Las reglas de filtrado del router \"" + d.id + "\" no tienen el formato correcto (tiene que ser una lista).");
        } else {
          if (d.reglas.length > 0 && d.tipo !== "router") {
            anotar(etiqueta + ".reglas", "Solo los routers tienen reglas de filtrado, y \"" + d.id + "\" es " + d.tipo + ".");
          }
          for (var g = 0; g < d.reglas.length; g++) {
            var regla = d.reglas[g];
            var campoRegla = etiqueta + ".reglas[" + g + "]";
            if (!regla || (regla.accion !== "bloquear" && regla.accion !== "permitir")) {
              anotar(campoRegla, "La regla " + (g + 1) + " de \"" + d.id + "\" tiene que decir si bloquea o permite.");
            }
            if (!regla || typeof regla.origen !== "string" || !parsearBloque(regla.origen)) {
              anotar(campoRegla, "La regla " + (g + 1) + " de \"" + d.id + "\" tiene un origen inválido: va una red como 10.45.7.0/26 (0.0.0.0/0 es cualquiera).");
            }
            if (!regla || typeof regla.destino !== "string" || !parsearBloque(regla.destino)) {
              anotar(campoRegla, "La regla " + (g + 1) + " de \"" + d.id + "\" tiene un destino inválido: va una red como 10.45.7.0/24 (0.0.0.0/0 es cualquiera).");
            }
            if (regla && regla.protocolo && ["icmp", "tcp", "udp"].indexOf(regla.protocolo) < 0) {
              anotar(campoRegla + ".protocolo", "La regla " + (g + 1) + " de \"" + d.id + "\" tiene un protocolo que no existe: puede ser icmp, tcp o udp (o ninguno, para cualquiera).");
            }
            if (regla && regla.puerto !== undefined && regla.puerto !== null && regla.puerto !== "") {
              var np = Number(regla.puerto);
              if (regla.protocolo !== "tcp" && regla.protocolo !== "udp") {
                anotar(campoRegla + ".puerto", "La regla " + (g + 1) + " de \"" + d.id + "\" tiene un puerto, pero los puertos son de TCP o UDP: elegí uno de esos protocolos.");
              } else if (!(np >= 1 && np <= 65535) || Math.floor(np) !== np) {
                anotar(campoRegla + ".puerto", "La regla " + (g + 1) + " de \"" + d.id + "\" tiene un puerto inválido: va de 1 a 65535.");
              }
            }
            if (regla && regla.entrada && !buscarInterfaz(d, regla.entrada)) {
              anotar(campoRegla + ".entrada", "La regla " + (g + 1) + " de \"" + d.id + "\" dice que el paquete entra por " + regla.entrada + ", pero ese puerto no existe.");
            }
          }
        }
      }

      // Redirecciones de puertos (NAT de destino) de los routers.
      if (d.redirecciones !== undefined && d.redirecciones !== null) {
        if (!Array.isArray(d.redirecciones)) {
          anotar(etiqueta + ".redirecciones", "Las redirecciones de puertos de \"" + d.id + "\" no tienen el formato correcto (tiene que ser una lista).");
        } else {
          if (d.redirecciones.length > 0 && d.tipo !== "router") {
            anotar(etiqueta + ".redirecciones", "Sólo los routers y los firewalls redirigen puertos, y \"" + d.id + "\" es " + d.tipo + ".");
          }
          d.redirecciones.forEach(function (r, k) {
            var campoR = etiqueta + ".redirecciones[" + k + "]";
            var nro = "La redirección " + (k + 1) + " de \"" + d.id + "\"";
            function puertoOk(x) { var n = Number(x); return n >= 1 && n <= 65535 && Math.floor(n) === n; }
            if (!r || (r.protocolo !== "tcp" && r.protocolo !== "udp")) { anotar(campoR + ".protocolo", nro + " tiene que ser de TCP o de UDP."); }
            if (!r || !puertoOk(r.puerto)) { anotar(campoR + ".puerto", nro + " tiene un puerto público inválido: va de 1 a 65535."); }
            if (!r || typeof r.ipInterna !== "string" || !Red.esIpValida(r.ipInterna)) { anotar(campoR + ".ipInterna", nro + " no tiene una IP interna válida."); }
            if (!r || !puertoOk(r.puertoInterno)) { anotar(campoR + ".puertoInterno", nro + " tiene un puerto interno inválido: va de 1 a 65535."); }
          });
        }
      }

      if (d.politica !== undefined && d.politica !== null && d.politica !== "permitir" && d.politica !== "bloquear") {
        anotar(etiqueta + ".politica", "La política por defecto de \"" + d.id + "\" tiene que ser permitir o bloquear.");
      }

      // Servidor DHCP, cuando está configurado.
      if (d.dhcp !== undefined && d.dhcp !== null) {
        var cfg = d.dhcp;
        if (cfg.habilitado) {
          if (!Red.esIpValida(String(cfg.desde || "")) || !Red.esIpValida(String(cfg.hasta || ""))) {
            anotar(etiqueta + ".dhcp", "El rango del servidor DHCP de \"" + d.id + "\" no es válido: revisá las direcciones desde y hasta.");
          }
          if (!esEnteroPrefijo(cfg.prefijo)) {
            anotar(etiqueta + ".dhcp", "La máscara del servidor DHCP de \"" + d.id + "\" no es válida.");
          }
        }
      }
    }

    // Enlaces: extremos existentes, modos de radio compatibles, medios
