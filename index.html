<script>
/* capa1-red.js — Capa 1: aritmética de direccionamiento IPv4.
 *
 * Objeto global `Red` con las funciones del contrato (§5 del BASE).
 * JavaScript vanilla, sin DOM, sin dependencias.
 *
 * Convenciones:
 * - Se trabaja con enteros de 32 bits sin signo. Los operadores bit a bit
 *   de JavaScript devuelven enteros con signo, así que todo resultado se
 *   normaliza con `>>> 0`.
 * - Ninguna función lanza excepciones por entrada inválida: las que devuelven
 *   texto, número u objeto devuelven `null`; las que devuelven boolean
 *   devuelven `false`; `clasificar` devuelve "invalida".
 * - El prefijo CIDR es la fuente de verdad: la máscara decimal se deriva de él.
 * - El separador del rango es " – " (raya corta con espacios).
 */

var Red = (function () {
  "use strict";

  // Indica si el prefijo es un entero entre 0 y 32.
  function esPrefijoValido(prefijo) {
    return typeof prefijo === "number" && Number.isInteger(prefijo) && prefijo >= 0 && prefijo <= 32;
  }

  // Convierte un prefijo en su máscara como entero sin signo.
  function prefijoANumero(prefijo) {
    if (!esPrefijoValido(prefijo)) {
      return null;
    }
    if (prefijo === 0) {
      return 0;
    }
    // El desplazamiento deja signo, por eso se normaliza con >>> 0.
    return (0xffffffff << (32 - prefijo)) >>> 0;
  }

  // Parte un texto en sus cuatro octetos numéricos, o null si no es IPv4 válida.
  function octetosDe(texto) {
    if (typeof texto !== "string") {
      return null;
    }
    var recortado = texto.trim();
    var partes = recortado.split(".");
    if (partes.length !== 4) {
      return null;
    }
    var octetos = [];
    for (var i = 0; i < 4; i++) {
      var parte = partes[i];
      if (!/^\d{1,3}$/.test(parte)) {
        return null;
      }
      var valor = parseInt(parte, 10);
      if (valor < 0 || valor > 255) {
        return null;
      }
      octetos.push(valor);
    }
    return octetos;
  }

  function esIpValida(texto) {
    return octetosDe(texto) !== null;
  }

  function aNumero(ip) {
    var octetos = octetosDe(ip);
    if (octetos === null) {
      return null;
    }
    // Multiplicación en lugar de desplazamientos para no tocar el signo.
    return ((((octetos[0] * 256 + octetos[1]) * 256 + octetos[2]) * 256 + octetos[3]) >>> 0);
  }

  function aTexto(numero) {
    if (typeof numero !== "number" || !Number.isInteger(numero) || numero < 0 || numero > 4294967295) {
      return null;
    }
    var n = numero >>> 0;
    var o1 = (n >>> 24) & 255;
    var o2 = (n >>> 16) & 255;
    var o3 = (n >>> 8) & 255;
    var o4 = n & 255;
    return o1 + "." + o2 + "." + o3 + "." + o4;
  }

  // Pasa un octeto (0-255) a 8 caracteres binarios con ceros a la izquierda.
  function octetoABinario(valor) {
    var binario = valor.toString(2);
    while (binario.length < 8) {
      binario = "0" + binario;
    }
    return binario;
  }

  function aBinario(ip) {
    var octetos = octetosDe(ip);
    if (octetos === null) {
      return null;
    }
    return octetoABinario(octetos[0]) + "." + octetoABinario(octetos[1]) + "." + octetoABinario(octetos[2]) + "." + octetoABinario(octetos[3]);
  }

  function prefijoAMascara(prefijo) {
    var mascaraNum = prefijoANumero(prefijo);
    if (mascaraNum === null) {
      return null;
    }
    return aTexto(mascaraNum);
  }

  function esMascaraValida(mascara) {
    var octetos = octetosDe(mascara);
    if (octetos === null) {
      return false;
    }
    var n = aNumero(mascara) >>> 0;
    // Una máscara válida son unos contiguos seguidos de ceros. El complemento
    // (la parte de host) tiene que ser de la forma 2^k - 1 (todo unos abajo).
    var parteHost = (~n) >>> 0;
    return (parteHost & (parteHost + 1)) === 0;
  }

  function mascaraAPrefijo(mascara) {
    if (!esMascaraValida(mascara)) {
      return null;
    }
    var n = aNumero(mascara) >>> 0;
    // Cuenta los unos. Como la máscara ya se validó, alcanza con contar.
    var unos = 0;
    var resto = n;
    while (resto !== 0) {
      unos += resto & 1;
      resto = resto >>> 1;
    }
    return unos;
  }

  function tamanoBloque(prefijo) {
    if (!esPrefijoValido(prefijo)) {
      return null;
    }
    return Math.pow(2, 32 - prefijo);
  }

  function direccionDeRed(ip, prefijo) {
    var ipNum = aNumero(ip);
    var mascaraNum = prefijoANumero(prefijo);
    if (ipNum === null || mascaraNum === null) {
      return null;
    }
    var redNum = (ipNum & mascaraNum) >>> 0;
    return aTexto(redNum);
  }

  function broadcast(ip, prefijo) {
    var ipNum = aNumero(ip);
    var mascaraNum = prefijoANumero(prefijo);
    if (ipNum === null || mascaraNum === null) {
      return null;
    }
    var redNum = (ipNum & mascaraNum) >>> 0;
    var broadcastNum = (redNum | ((~mascaraNum) >>> 0)) >>> 0;
    return aTexto(broadcastNum);
  }

  function primerHost(ip, prefijo) {
    // En /31 y /32 no hay direcciones de host utilizables.
    if (!esPrefijoValido(prefijo) || prefijo >= 31) {
      return null;
    }
    var redTexto = direccionDeRed(ip, prefijo);
    if (redTexto === null) {
      return null;
    }
    return aTexto(aNumero(redTexto) + 1);
  }

  function ultimoHost(ip, prefijo) {
    if (!esPrefijoValido(prefijo) || prefijo >= 31) {
      return null;
    }
    var broadcastTexto = broadcast(ip, prefijo);
    if (broadcastTexto === null) {
      return null;
    }
    return aTexto(aNumero(broadcastTexto) - 1);
  }

  function cantidadHosts(prefijo) {
    if (!esPrefijoValido(prefijo)) {
      return null;
    }
    if (prefijo >= 31) {
      return 0;
    }
    return Math.pow(2, 32 - prefijo) - 2;
  }

  function rangoTexto(ip, prefijo) {
    var primero = primerHost(ip, prefijo);
    var ultimo = ultimoHost(ip, prefijo);
    if (primero === null || ultimo === null) {
      return null;
    }
    return primero + " – " + ultimo;
  }

  function mismaRed(ipA, ipB, prefijo) {
    var redA = direccionDeRed(ipA, prefijo);
    var redB = direccionDeRed(ipB, prefijo);
    if (redA === null || redB === null) {
      return false;
    }
    return redA === redB;
  }

  function esDireccionDeRed(ip, prefijo) {
    var redTexto = direccionDeRed(ip, prefijo);
    if (redTexto === null || aNumero(ip) === null) {
      return false;
    }
    return aNumero(ip) === aNumero(redTexto);
  }

  function esBroadcast(ip, prefijo) {
    var broadcastTexto = broadcast(ip, prefijo);
    if (broadcastTexto === null || aNumero(ip) === null) {
      return false;
    }
    return aNumero(ip) === aNumero(broadcastTexto);
  }

  function esAsignable(ip, prefijo) {
    if (aNumero(ip) === null || !esPrefijoValido(prefijo)) {
      return false;
    }
    if (prefijo >= 31) {
      return false;
    }
    return !esDireccionDeRed(ip, prefijo) && !esBroadcast(ip, prefijo);
  }

  function estaAlineada(red, prefijo) {
    var redNum = aNumero(red);
    var bloque = tamanoBloque(prefijo);
    if (redNum === null || bloque === null) {
      return false;
    }
    return redNum % bloque === 0;
  }

  function solapan(redA, prefA, redB, prefB) {
    var redATexto = direccionDeRed(redA, prefA);
    var bcastATexto = broadcast(redA, prefA);
    var redBTexto = direccionDeRed(redB, prefB);
    var bcastBTexto = broadcast(redB, prefB);
    if (redATexto === null || bcastATexto === null || redBTexto === null || bcastBTexto === null) {
      return false;
    }
    var inicioA = aNumero(redATexto);
    var finA = aNumero(bcastATexto);
    var inicioB = aNumero(redBTexto);
    var finB = aNumero(bcastBTexto);
    return inicioA <= finB && inicioB <= finA;
  }

  // El orden importa: 255.255.255.255 también cae dentro de 240.0.0.0/4.
  function clasificar(ip) {
    var n = aNumero(ip);
    if (n === null) {
      return "invalida";
    }
    var num = n >>> 0;
    var o1 = (num >>> 24) & 255;
    var o2 = (num >>> 16) & 255;
    if (num === 0xFFFFFFFF) {
      return "broadcast-limitado";
    }
    if (o1 === 0) {
      return "esta-red";
    }
    if (o1 === 127) {
      return "loopback";
    }
    if (o1 === 169 && o2 === 254) {
      return "apipa";
    }
    if (o1 === 10 || (o1 === 172 && o2 >= 16 && o2 <= 31) || (o1 === 192 && o2 === 168)) {
      return "privada";
    }
    if (o1 === 100 && o2 >= 64 && o2 <= 127) {
      return "cgnat";
    }
    if (o1 >= 224 && o1 <= 239) {
      return "multicast";
    }
    if (o1 >= 240) {
      return "reservada";
    }
    return "publica";
  }

  // Clase histórica (sistema de clases, anterior a CIDR) según el primer
  // octeto. Sólo A, B y C tenían un prefijo fijo; D es multicast y E quedó
  // reservada.
  var CLASES = [
    { letra: "A", desde: 0, hasta: 127, prefijoClasico: 8 },
    { letra: "B", desde: 128, hasta: 191, prefijoClasico: 16 },
    { letra: "C", desde: 192, hasta: 223, prefijoClasico: 24 },
    { letra: "D", desde: 224, hasta: 239, prefijoClasico: null },
    { letra: "E", desde: 240, hasta: 255, prefijoClasico: null }
  ];

  function clase(ip) {
    if (!esIpValida(ip)) {
      return null;
    }
    var o1 = parseInt(String(ip).trim().split(".")[0], 10);
    for (var i = 0; i < CLASES.length; i++) {
      var c = CLASES[i];
      if (o1 >= c.desde && o1 <= c.hasta) {
        return { letra: c.letra, prefijoClasico: c.prefijoClasico, rango: c.desde + ".0.0.0 – " + c.hasta + ".255.255.255" };
      }
    }
    return null;
  }

  // Muestra el AND entre la IP y su máscara, con el detalle binario.
  function and(ip, prefijo) {
    var ipNum = aNumero(ip);
    var mascaraNum = prefijoANumero(prefijo);
    if (ipNum === null || mascaraNum === null) {
      return null;
    }
    var resultadoNum = (ipNum & mascaraNum) >>> 0;
    var resultado = aTexto(resultadoNum);
    var mascaraTexto = aTexto(mascaraNum);
    return {
      resultado: resultado,
      binarioIp: aBinario(ip),
      binarioMascara: aBinario(mascaraTexto),
      binarioResultado: aBinario(resultado)
    };
  }

  // Calcula la posición del corte red/host dentro de la cadena binaria
  // con puntos (por ejemplo /27 corta en el índice 30).
  function corteEnBinario(prefijo) {
    var puntosAntes = 0;
    if (prefijo > 8) {
      puntosAntes += 1;
    }
    if (prefijo > 16) {
      puntosAntes += 1;
    }
    if (prefijo > 24) {
      puntosAntes += 1;
    }
    return prefijo + puntosAntes;
  }

  function desglose(ip, prefijo, gateway) {
    var ipNum = aNumero(ip);
    if (ipNum === null || !esPrefijoValido(prefijo)) {
      return null;
    }
    var mascaraNum = prefijoANumero(prefijo);
    var mascaraDecimal = aTexto(mascaraNum);
    var redTexto = direccionDeRed(ip, prefijo);
    var broadcastTexto = broadcast(ip, prefijo);
    var primero = primerHost(ip, prefijo);
    var ultimo = ultimoHost(ip, prefijo);
    var rango = rangoTexto(ip, prefijo);

    var advertencia = null;
    if (esDireccionDeRed(ip, prefijo)) {
      advertencia = "Esta IP es la dirección de red de su subred";
    } else if (esBroadcast(ip, prefijo)) {
      advertencia = "Esta IP es la dirección de broadcast de su subred";
    }

    var gatewayInfo = null;
    if (gateway !== undefined && gateway !== null && String(gateway).trim() !== "") {
      var gatewayTexto = String(gateway).trim();
      var andIp = direccionDeRed(ip, prefijo);
      var andGateway = direccionDeRed(gatewayTexto, prefijo);
      var coinciden = andIp !== null && andGateway !== null && andIp === andGateway;
      gatewayInfo = {
        ip: gatewayTexto,
        andIp: andIp,
        andGateway: andGateway,
        coinciden: coinciden,
        veredicto: coinciden ? "Las dos dan la misma red: tu puerta de enlace está en tu red." : "Dan redes distintas: tu puerta de enlace está fuera de tu red."
      };
    }

    return {
      ip: ip.trim(),
      prefijo: prefijo,
      mascaraDecimal: mascaraDecimal,
      ipBinario: aBinario(ip),
      mascaraBinaria: aBinario(mascaraDecimal),
      bitsRed: prefijo,
      bitsHost: 32 - prefijo,
      cortePosicion: corteEnBinario(prefijo),
      direccionDeRed: redTexto,
      broadcast: broadcastTexto,
      primerHost: primero,
      ultimoHost: ultimo,
      rangoTexto: rango,
      cantidadHosts: cantidadHosts(prefijo),
      ipEsAsignable: esAsignable(ip, prefijo),
      advertencia: advertencia,
      gateway: gatewayInfo
    };
  }

  function autopruebas() {
    var total = 0;
    var pasadas = 0;
    var fallos = [];

    function comparar(nombre, obtenido, esperado) {
      total += 1;
      var textoObtenido = JSON.stringify(obtenido);
      var textoEsperado = JSON.stringify(esperado);
      if (textoObtenido === textoEsperado) {
        pasadas += 1;
      } else {
        fallos.push({ nombre: nombre, esperado: esperado, obtenido: obtenido });
      }
    }

    // Casos obligatorios del documento de la capa 1.
    comparar("red corta en tercer octeto /20", direccionDeRed("172.16.34.9", 20), "172.16.32.0");
    comparar("broadcast /20", broadcast("172.16.34.9", 20), "172.16.47.255");
    comparar("hosts /20", cantidadHosts(20), 4094);
    comparar("broadcast /16", broadcast("10.0.5.77", 16), "10.0.255.255");
    comparar("hosts /8 sin desborde de signo", cantidadHosts(8), 16777214);
    comparar("red /27", direccionDeRed("200.45.12.201", 27), "200.45.12.192");
    comparar("broadcast /27", broadcast("200.45.12.201", 27), "200.45.12.223");
    comparar("mascara 255.255.255.100 invalida", esMascaraValida("255.255.255.100"), false);
    comparar("mascara 255.255.255.252 valida", esMascaraValida("255.255.255.252"), true);
    comparar("mascara a prefijo 21", mascaraAPrefijo("255.255.248.0"), 21);
    comparar("broadcast no asignable", esAsignable("172.16.5.95", 27), false);
    comparar("host /30 asignable", esAsignable("10.0.0.5", 30), true);
    comparar("distinta red con /26", mismaRed("192.168.1.50", "192.168.1.200", 26), false);

    comparar("binario con ceros a la izquierda", aBinario("10.0.45.200"), "00001010.00000000.00101101.11001000");

    comparar("ip a numero", aNumero("192.168.10.10"), 3232238090);
    comparar("numero a texto", aTexto(3232238090), "192.168.10.10");
    comparar("tamano de bloque /27", tamanoBloque(27), 32);
    comparar("rango administracion /27", rangoTexto("10.45.7.66", 27), "10.45.7.65 – 10.45.7.94");
    comparar("ip invalida 300", esIpValida("300.1.1.1"), false);
    comparar("loopback", clasificar("127.0.0.1"), "loopback");
    comparar("publica", clasificar("8.8.8.8"), "publica");
    comparar("mascara 0.0.0.0 valida", esMascaraValida("0.0.0.0"), true);
    comparar("hosts /24", cantidadHosts(24), 254);
    comparar("and de red", and("192.168.10.10", 24).resultado, "192.168.10.0");
    comparar("es direccion de red", esDireccionDeRed("10.45.7.64", 27), true);
    comparar("es broadcast", esBroadcast("10.45.7.95", 27), true);

    // Desglose con un prefijo que corta dentro del octeto (/27).
    var detalle = desglose("192.168.10.10", 27, "192.168.10.1");
    comparar("desglose red /27", detalle.direccionDeRed, "192.168.10.0");
    comparar("desglose broadcast /27", detalle.broadcast, "192.168.10.31");
    comparar("desglose corte dentro del octeto", detalle.cortePosicion, 30);
    comparar("desglose mascara binaria", detalle.mascaraBinaria, "11111111.11111111.11111111.11100000");
    comparar("desglose gateway coincide", detalle.gateway.coinciden, true);
    comparar("desglose veredicto gateway", detalle.gateway.veredicto, "Las dos dan la misma red: tu puerta de enlace está en tu red.");
    var detalleAjeno = desglose("192.168.10.10", 27, "192.168.10.200");
    comparar("desglose gateway ajeno", detalleAjeno.gateway.veredicto, "Dan redes distintas: tu puerta de enlace está fuera de tu red.");
    var detalleRed = desglose("10.45.7.64", 27, null);
    comparar("desglose advierte direccion de red", detalleRed.advertencia, "Esta IP es la dirección de red de su subred");

    // Rangos especiales: nada que no se reconozca se llama "pública" por descarte.
    comparar("clasifica broadcast limitado", clasificar("255.255.255.255"), "broadcast-limitado");
    comparar("clasifica esta red", clasificar("0.0.0.0"), "esta-red");
    comparar("clasifica multicast bajo", clasificar("224.0.0.1"), "multicast");
    comparar("clasifica multicast alto", clasificar("239.255.255.250"), "multicast");
    comparar("clasifica reservada", clasificar("240.0.0.1"), "reservada");
    comparar("clasifica cgnat", clasificar("100.64.0.1"), "cgnat");
    comparar("clasifica justo antes de cgnat", clasificar("100.63.255.255"), "publica");
    comparar("clasifica 172.32 pública", clasificar("172.32.0.1"), "publica");
    comparar("clasifica pública", clasificar("8.8.8.8"), "publica");
    comparar("ultimo host /32", ultimoHost("10.0.0.0", 32), null);

    // Clases históricas.
    comparar("clase A privada", clase("10.45.7.1"), { letra: "A", prefijoClasico: 8, rango: "0.0.0.0 – 127.255.255.255" });
    comparar("clase B", [clase("172.16.0.1").letra, clase("172.16.0.1").prefijoClasico], ["B", 16]);
    comparar("clase C", [clase("192.168.1.1").letra, clase("192.168.1.1").prefijoClasico], ["C", 24]);
    comparar("clase D sin prefijo", [clase("224.0.0.5").letra, clase("224.0.0.5").prefijoClasico], ["D", null]);
    comparar("clase E sin prefijo", [clase("240.0.0.1").letra, clase("240.0.0.1").prefijoClasico], ["E", null]);
    comparar("clase de ip inválida", clase("300.1.1.1"), null);

    return { total: total, pasadas: pasadas, fallos: fallos };
  }

  return {
    esIpValida: esIpValida,
    aNumero: aNumero,
    aTexto: aTexto,
    aBinario: aBinario,
    prefijoAMascara: prefijoAMascara,
    mascaraAPrefijo: mascaraAPrefijo,
    esMascaraValida: esMascaraValida,
    tamanoBloque: tamanoBloque,
    direccionDeRed: direccionDeRed,
    broadcast: broadcast,
    primerHost: primerHost,
    ultimoHost: ultimoHost,
    cantidadHosts: cantidadHosts,
    rangoTexto: rangoTexto,
    mismaRed: mismaRed,
    esDireccionDeRed: esDireccionDeRed,
    esBroadcast: esBroadcast,
    esAsignable: esAsignable,
    estaAlineada: estaAlineada,
    solapan: solapan,
    clasificar: clasificar,
    clase: clase,
    and: and,
    desglose: desglose,
    autopruebas: autopruebas
  };
})();

<script>
/* capa2-motor.js — Capa 2: simulación y diagnóstico.
 *
 * Objeto global `Motor` con las firmas del §5 del BASE.
 * JavaScript vanilla, sin DOM, sin dependencias. Usa el objeto global `Red`
 * de la capa 1 para toda la aritmética de direccionamiento: acá no se
 * calcula ninguna máscara, red ni broadcast a mano.
 *
 * Idea central: lo que se enseña no es que el ping ande, sino por qué no anda.
 * Por eso `ping` devuelve los pasos ejecutados uno por uno y un diagnóstico
 * del catálogo D01–D17 con las direcciones concretas del caso.
 */

var Motor = (function () {
  "use strict";

  // Alcance máximo del enlace inalámbrico, en las mismas unidades que las
  // coordenadas x/y del lienzo. Es configurable: la capa 4 puede leerlo para
  // el tooltip y la prueba puede ajustarlo. Por defecto 250.
  var UMBRAL_WIRELESS = 250;

  // Tiempo de vida de las entradas ARP y MAC, en milisegundos.
  var VIDA_ARP_MS = 300000;
  var VIDA_MAC_MS = 300000;

  // TTL con el que sale cada paquete, como en un equipo real. Cada router le
  // resta uno; al llegar a 0 se descarta (y eso corta los bucles de rutas).
  var TTL_INICIAL = 64;

  // Las capas en las que ocurre cada paso del ping, en los dos modelos que
  // usa la materia: OSI y TCP/IP de cinco capas (como Stallings).
  var CAPAS = {
    1: { osi: "Física", tcpip: "Física", pdu: "bits" },
    2: { osi: "Enlace", tcpip: "Acceso a la red", pdu: "trama" },
    3: { osi: "Red", tcpip: "Internet", pdu: "paquete" },
    4: { osi: "Transporte", tcpip: "Transporte", pdu: "segmento" },
    7: { osi: "Aplicación", tcpip: "Aplicación", pdu: "mensaje" }
  };

  /* ---------------- Catálogo de diagnósticos ----------------
   * Cada entrada tiene un título corto, una explicación en lenguaje de aula
   * (qué pasó y por qué impide el ping, con los nombres visibles de los
   * equipos y las direcciones concretas) y una sugerencia de dónde mirar,
   * nunca la respuesta directa. La sugerencia puede depender del contexto. */

  function valor(dato, porDefecto) {
    return dato === undefined || dato === null || dato === "" ? porDefecto : dato;
  }

  var CATALOGO = {
    D01: {
      titulo: "El equipo está apagado o su interfaz está deshabilitada",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var puerto = ctx.interfaz && ctx.interfaz !== "?" ? "su puerto " + ctx.interfaz + " está deshabilitado" : "su interfaz está deshabilitada";
        return valor(ctx.origen, "El equipo") + " no puede enviar ni recibir nada: está apagado o " + puerto + ".";
      },
      sugerencia: function (ctx) {
        ctx = ctx || {};
        return "Encendé el equipo y habilitá " + (ctx.interfaz && ctx.interfaz !== "?" ? ctx.interfaz : "la interfaz") +
          " en la pestaña Interfaces.";
      }
    },
    D02: {
      titulo: "No hay conexión física",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return "El puerto " + valor(ctx.interfaz, "?") + " de " + valor(ctx.origen, "el equipo") +
          " no tiene un cable conectado, o el cable está marcado como caído. Sin conexión física no sale ningún paquete.";
      },
      sugerencia: function (ctx) {
        ctx = ctx || {};
        return "Conectá un cable a " + valor(ctx.interfaz, "ese puerto") +
          " o, si ya hay uno, seleccionalo y ponelo en estado activo.";
      }
    },
    D03: {
      titulo: "El cable no corresponde a los puertos",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return valor(ctx.cable, "Ese cable") + valor(ctx.tipoCable, "") + ", pero une un puerto " +
          valor(ctx.medioA, "?") + " con uno " + valor(ctx.medioB, "?") +
          ". Cada puerto acepta un solo tipo de cable: de cobre, de fibra o inalámbrico.";
      },
      sugerencia: "Usá un cable del mismo tipo que los dos puertos, o conectalo a otro puerto."
    },
    D04: {
      titulo: "El equipo no tiene dirección IP",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return "El puerto " + valor(ctx.interfaz, "?") + " de " + valor(ctx.origen, "el equipo") +
          " no tiene dirección IP: sin una IP de origen no se puede armar el paquete.";
      },
      sugerencia: "Configurá una IP en la pestaña Configuración, o elegí el modo DHCP."
    },
    D05: {
      titulo: "La máscara no es válida",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return "La máscara configurada en " + valor(ctx.origen, "el equipo") + " no es válida (prefijo " +
          valor(ctx.prefijo, "?") + "), así que no se puede calcular a qué red pertenece.";
      },
      sugerencia: "Corregí la máscara en la pestaña Configuración: el prefijo va de 0 a 32."
    },
    D06: {
      titulo: "Esa IP no se puede asignar a un equipo",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var red = valor(ctx.red, "?") + "/" + valor(ctx.prefijo, "?");
        if (ctx.rol === "dirección de broadcast") {
          return valor(ctx.ip, "Esa IP") + " es la dirección de broadcast de " + red +
            ": se usa para hablarles a todos los equipos de la red a la vez.";
        }
        return valor(ctx.ip, "Esa IP") + " es la dirección de red de " + red + ": identifica a la red entera, no a un equipo.";
      },
      sugerencia: "Calculá el rango asignable en la pestaña Cálculo de subred y elegí una dirección dentro de él."
    },
    D07: {
      titulo: "Dos equipos tienen la misma IP",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return valor(ctx.ip, "Esa IP") + " está configurada en " + valor(ctx.origen, "este equipo") + " y en " +
          valor(ctx.otro, "otro equipo") + ", que están en la misma red. Cuando alguien pregunta quién tiene esa IP (ARP) " +
          "responden los dos, y los paquetes llegan a cualquiera.";
      },
      sugerencia: "Cambiale la IP a uno de los dos equipos."
    },
    D08: {
      titulo: "Falta la puerta de enlace",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return valor(ctx.destino, "El destino") + " está en otra red y " + valor(ctx.origen, "tu equipo") +
          " no tiene puerta de enlace: sin ella solo puede comunicarse con su propia red (" + valor(ctx.red, "?") + ").";
      },
      sugerencia: "Configurá la puerta de enlace predeterminada: es la IP del router en tu red."
    },
    D09: {
      titulo: "La puerta de enlace está fuera de tu red",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return "La puerta de enlace " + valor(ctx.gateway, "?") + " no pertenece a la red de " + valor(ctx.equipo, "tu equipo") +
          " (" + valor(ctx.red, "?") + "/" + valor(ctx.prefijo, "?") + "): con esa máscara, el equipo no la puede alcanzar.";
      },
      sugerencia: "Revisá la máscara del equipo o la dirección de la puerta de enlace: una de las dos está mal. " +
        "La pestaña Cálculo de subred muestra el AND de las dos."
    },
    D10: {
      titulo: "La puerta de enlace no responde",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return "La puerta de enlace " + valor(ctx.gateway, "?") + " está en la red correcta, pero cuando " +
          valor(ctx.origen, "el equipo") + " pregunta quién tiene esa IP (ARP), nadie responde. " +
          "El router puede no tener esa IP, o estar apagado o desconectado.";
      },
      sugerencia: "Verificá que el router tenga esa IP en el puerto conectado a tu red, y que esté encendido y cableado."
    },
    D11: {
      titulo: "El router no sabe cómo llegar al destino",
      explicacion: function (ctx) {
        ctx = ctx || {};
        if (ctx.internet) {
          return valor(ctx.destino, "Esa dirección") + " es una dirección privada: internet no la enruta y descarta el paquete. " +
            "El destino tendría que estar dentro de tu red, y algún router no tiene ruta hacia él (o la IP está mal escrita).";
        }
        if (ctx.noRouter) {
          return "Quien responde por la puerta de enlace es " + valor(ctx.router, "otro equipo") +
            ", que no es un router: no sabe reenviar paquetes a otra red.";
        }
        return valor(ctx.router, "El router") + " no tiene ninguna ruta que lleve a " + valor(ctx.destino, "ese destino") +
          ", ni una ruta por defecto, así que descarta el paquete.";
      },
      sugerencia: function (ctx) {
        ctx = ctx || {};
        if (ctx.internet) { return "Revisá la IP de destino y las rutas de tus routers hacia esa red."; }
        if (ctx.noRouter) { return "Revisá la puerta de enlace del equipo: tiene que ser la IP del router de su red."; }
        return "Agregá en la tabla de rutas de " + valor(ctx.router, "ese router") +
          " una ruta hacia la red de destino, o una ruta por defecto.";
      }
    },
    D12: {
      titulo: "La respuesta no puede volver",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return "El paquete llegó a " + valor(ctx.destino, "destino") + ", pero la respuesta no encuentra el camino de regreso a " +
          valor(ctx.origen, "origen") + "." + (ctx.causa ? " En la vuelta: " + ctx.causa : "");
      },
      sugerencia: "Revisá la puerta de enlace del destino y las rutas de los routers en sentido contrario: la vuelta necesita su propio camino."
    },
    D13: {
      titulo: "El equipo de destino está apagado",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return (ctx.destinoNombre ? ctx.destinoNombre + " tiene la IP " + valor(ctx.destino, "?") : "El equipo con la IP " + valor(ctx.destino, "?")) +
          ", pero está apagado o su interfaz está deshabilitada, así que no responde.";
      },
      sugerencia: "Encendé el equipo de destino y habilitá su interfaz."
    },
    D14: {
      titulo: "Equipos de la misma red con máscaras distintas",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var a = (ctx.nombreA ? ctx.nombreA + " (" : "") + valor(ctx.ipA, "?") + "/" + valor(ctx.prefijoA, "?") + (ctx.nombreA ? ")" : "");
        var b = (ctx.nombreB ? ctx.nombreB + " (" : "") + valor(ctx.ipB, "?") + "/" + valor(ctx.prefijoB, "?") + (ctx.nombreB ? ")" : "");
        return a + " y " + b + " están conectados a la misma red física, pero con máscaras distintas cada uno calcula " +
          "una red diferente y no coinciden en quién está en su red.";
      },
      sugerencia: "Usá la misma máscara en todos los equipos de esa red."
    },
    D15: {
      titulo: "Están en el mismo switch, pero en subredes distintas",
      tituloAire: "Están en el mismo punto de acceso, pero en subredes distintas",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var aparato = ctx.aire ? "punto de acceso" : "switch";
        return valor(ctx.origen, "Tu equipo") + " (" + valor(ctx.redA, "?") + ") y " + valor(ctx.destinoNombre, "el destino") +
          " (" + valor(ctx.redB, "?") + ") están conectados al mismo " + aparato + ", pero en subredes diferentes. Un " + aparato +
          " no mira las direcciones IP, así que no puede pasar paquetes de una subred a otra: para eso hace falta un router.";
      },
      sugerencia: "Poné los dos equipos en la misma subred, o conectalos a través de un router."
    },
    D16: {
      titulo: "No se obtuvo una IP por DHCP",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return (ctx.motivo
          ? ctx.motivo
          : ctx.servidor
          ? "El servidor DHCP de " + ctx.servidor + " no tiene direcciones libres para ofrecer."
          : "Ningún servidor DHCP respondió en la red.") +
          " El equipo se asigna solo una dirección 169.254.x.x (APIPA) y no puede comunicarse con nadie.";
      },
      sugerencia: "Verificá que el router de esa red tenga el servidor DHCP habilitado y con direcciones libres en su rango."
    },
    D17: {
      titulo: "El equipo está fuera del alcance inalámbrico",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var quien = ctx.nombreA && ctx.nombreB
          ? ctx.nombreA + " está a " + valor(ctx.distancia, "?") + " m de " + ctx.nombreB
          : "Los dos equipos están a " + valor(ctx.distancia, "?") + " m";
        return quien + " y el alcance máximo es de " + valor(ctx.umbral, "?") + " m: la señal no llega.";
      },
      sugerencia: "Acercá el equipo al punto de acceso (arrastralo en el lienzo)."
    },
    D18: {
      titulo: "Los modos de radio no son compatibles",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var a = valor(ctx.nombreA, "Un equipo");
        var b = valor(ctx.nombreB, "otro equipo");
        if (ctx.modoA === "cliente" && ctx.modoB === "cliente") {
          return a + " y " + b + " están los dos en modo cliente, y dos clientes no se conectan entre sí: hace falta un punto de acceso.";
        }
        if (ctx.modoA === "ap" && ctx.modoB === "ap") {
          return a + " y " + b + " están los dos en modo punto de acceso, y dos puntos de acceso no se conectan entre sí: " +
            "un cliente se conecta a un punto de acceso.";
        }
        return "El enlace inalámbrico entre " + a + " y " + b + " une modos que no se entienden (" + valor(ctx.modoA, "?") +
          " con " + valor(ctx.modoB, "?") + "): solo funcionan cliente con ap, o bridge con bridge.";
      },
      sugerencia: "Poné uno de los dos en modo ap o, para unirlos punto a punto, los dos en modo bridge (pestaña Interfaces)."
    },
    D19: {
      titulo: "El equipo inalámbrico no está conectado a un punto de acceso",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return valor(ctx.origen, "El equipo") + " es un cliente inalámbrico, pero el punto de acceso con el que está enlazado" +
          (ctx.ap ? " (" + ctx.ap + ")" : "") + " está apagado, tiene la interfaz deshabilitada o no está en modo ap.";
      },
      sugerencia: "Revisá que el punto de acceso esté encendido, con wlan0 habilitada y en modo ap."
    },
    D20: {
      titulo: "Nadie tiene esa IP en tu red",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return valor(ctx.origen, "El equipo") + " preguntó en su red quién tiene la IP " + valor(ctx.destino, "?") +
          " (ARP) y nadie respondió: ningún equipo la tiene configurada, o el que la tiene está desconectado.";
      },
      sugerencia: "Revisá que la IP de destino esté bien escrita y que ese equipo esté conectado a la misma red."
    },
    D21: {
      titulo: "El destino es la dirección de broadcast",
      explicacion: function (ctx) {
        ctx = ctx || {};
        return valor(ctx.destino, "Esa IP") + " es la dirección de broadcast de la red " + valor(ctx.red, "?") + "/" +
          valor(ctx.prefijo, "?") + ": sirve para hablarles a todos los equipos a la vez, no identifica a uno. " +

      },
      sugerencia: "Hacé ping a la IP de un equipo."
    },
    D22: {
      titulo: "La ruta apunta a un router que no está al alcance",
      explicacion: function (ctx) {
        ctx = ctx || {};
        var router = valor(ctx.router, "El router");
        var inicio = router + " tiene una ruta hacia " + valor(ctx.red, "esa red") + " que manda los paquetes a " +
          valor(ctx.siguienteSalto, "?") + ", pero ";
        if (ctx.motivo === "sin-respuesta") {

        }

      },

    },
    D24: {
      titulo: "El equipo no tiene servidor DNS",
      explicacion: function (ctx) {

        return "Para hacer ping a " + valor(ctx.nombre, "ese nombre") + " primero hay que averiguar su IP, y eso se le pregunta " +
          "a un servidor DNS. " + valor(ctx.origen, "El equipo") + " no tiene ninguno configurado.";
      },
      sugerencia: "Cargá un servidor DNS en la pestaña Configuración (por ejemplo 8.8.8.8), o hacé el ping directamente a una IP."
    },
    D25: {
      titulo: "El nombre no existe",

  /* ---------------- Utilidades internas ---------------- */

  function clonar(obj) {

  function clavePuerto(idDispositivo, idInterfaz) {

  }

  // MAC determinística a partir del id del dispositivo y el índice de la
  // interfaz, para que el mismo JSON produzca siempre las mismas MAC.
  function macDeterministica(idDispositivo, indice) {
    var base = 0;
    var texto = String(idDispositivo);
    for (var i = 0; i < texto.length; i++) {
      base = (base * 31 + texto.charCodeAt(i)) >>> 0;
    }
    base = (base + indice * 137) >>> 0;
    function dos(valor) {
      var h = (valor & 255).toString(16);
      return h.length < 2 ? "0" + h : h;
    }
    return "02:00:" + dos(base >>> 24) + ":" + dos(base >>> 16) + ":" + dos(base >>> 8) + ":" + dos(base);

    for (var i = 0; i < dispositivo.interfaces.length; i++) {

        return dispositivo.interfaces[i];

    }

    if (interfaz.modoRadio === "ap" || interfaz.modoRadio === "cliente" || interfaz.modoRadio === "bridge") {

    var bD = buscarDispositivo(estado, enlace.b.dispositivo);
    var aI = buscarInterfaz(aD, enlace.a.interfaz);
    var bI = buscarInterfaz(bD, enlace.b.interfaz);
    if (!aI || !bI) {
      return false;
    }
    var ma = modoRadioDe(aD, aI);
    var mb = modoRadioDe(bD, bI);
    return (ma === "ap" && mb === "cliente") ||
      (ma === "cliente" && mb === "ap") ||
      (ma === "bridge" && mb === "bridge");

    var dispositivoB = buscarDispositivo(estado, enlace.b.dispositivo);
    var interfazA = buscarInterfaz(dispositivoA, enlace.a.interfaz);
    var interfazB = buscarInterfaz(dispositivoB, enlace.b.interfaz);
    if (!dispositivoA || !dispositivoB || !interfazA || !interfazB ||

        !interfazA.habilitada || !interfazB.habilitada) {

      if (regla.protocolo && regla.protocolo !== paquete.protocolo) { continue; }
      if (regla.puerto && Number(regla.puerto) !== Number(paquete.puertoDestino)) { continue; }
      if (regla.entrada && regla.entrada !== entrada) { continue; }
      if (Red.mismaRed(ipOrigen, o.red, o.prefijo) && Red.mismaRed(ipDestino, d.red, d.prefijo)) {

    return que + " de " + (origen || regla.origen) + " hacia " + (destino || regla.destino) +
