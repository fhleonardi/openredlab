      // con que uno deje pasar la trama.
      var enlacesEgreso = enlacesDe(estado, router.id, egreso.id);
      var egresoUsable = null;
      var problemaEgreso = null;
      for (var loi = 0; loi < enlacesEgreso.length; loi++) {
        var candEg = enlacesEgreso[loi];
        var compatEg = mediosCompatibles(estado, candEg);
        if (!compatEg.ok) {
          if (!problemaEgreso) {
            problemaEgreso = {
              codigo: "D03",
              ctx: { enlace: candEg.id, medioA: compatEg.medioA, medioB: compatEg.medioB },
              detalle: "El enlace " + candEg.id + " une medios distintos (" +
                compatEg.medioA + " con " + compatEg.medioB + ")."
            };
          }
          continue;
        }
        if (candEg.tipo === "wireless" && !modosEnlaceOk(estado, candEg)) {
          if (!problemaEgreso) {
            var modosEg = modoEnlaceDe(estado, candEg, router.id, egreso.id);
            var otroEg = buscarDispositivo(estado, modosEg.otroDispositivo);
            problemaEgreso = {
              codigo: "D18",
              ctx: {
                enlace: candEg.id,
                modoA: modosEg.mio, modoB: modosEg.ajeno,
                nombreA: router.nombre || router.id,
                nombreB: (otroEg && (otroEg.nombre || otroEg.id)) || modosEg.otroDispositivo
              },
              detalle: "El enlace " + candEg.id + " une modos incompatibles (" +
                modosEg.mio + " con " + modosEg.ajeno + ")."
            };
          }
          continue;
        }
        var wlEgreso = chequeoWireless(estado, candEg);
        if (wlEgreso.aplica && !wlEgreso.enAlcance) {
          if (!problemaEgreso) {
            problemaEgreso = {
              codigo: "D17",
              ctx: { distancia: wlEgreso.distancia, umbral: estado.umbralWireless },
              detalle: "El tramo wireless de " + router.id + " está fuera de alcance (" +
                wlEgreso.distancia + " > " + estado.umbralWireless + ")."
            };
          }
          continue;
        }
        if (candEg.estado !== "up") {
          if (!problemaEgreso) {
            problemaEgreso = {
              codigo: "D02",
              ctx: { origen: router.id, interfaz: egreso.id },
              detalle: "El enlace " + candEg.id + " de " + router.id + ":" + egreso.id + " está caído."
            };
          }
          continue;
        }
        egresoUsable = candEg;
        break;
      }
      if (!egresoUsable) {
        var pe = problemaEgreso || {
          codigo: "D02",
          ctx: { origen: router.id, interfaz: egreso.id },
          detalle: "El enlace de " + router.id + ":" + egreso.id + " está caído."
        };
        agregarPaso("Avanzar al siguiente salto", pe.detalle, false);
        return {
          exito: false,
          pasos: pasos,
          saltos: saltos,
          diagnostico: diagnosticoDe(pe.codigo, pe.ctx),
          respuestas: []
        };
      }
      var siguienteDispositivo = router;
      var siguienteInterfaz = egreso;
      var siguienteIp = egreso.ip;
      if (!ruta.directa && ruta.siguienteSalto) {
        var vecinos = respondedoresArp(estado, router.id, egreso.id, ruta.siguienteSalto)
          .filter(function (vecino) { return vecino.dispositivo.id !== router.id; });
        if (vecinos.length !== 1 || !esRouter(vecinos[0].dispositivo)) {
          agregarPaso("Resolver el siguiente salto",
            "No se pudo resolver un router vecino único para " + ruta.siguienteSalto + ".", false);
          return {
            exito: false,
            pasos: pasos,
            saltos: saltos,
            diagnostico: diagnosticoDe("D22", {
              router: router.nombre || router.id,
              red: ruta.destino + "/" + ruta.prefijo,
              siguienteSalto: ruta.siguienteSalto,
              motivo: "sin-respuesta"
            }),
            respuestas: []
          };
        }
        siguienteDispositivo = vecinos[0].dispositivo;
        siguienteInterfaz = vecinos[0].interfaz;
        siguienteIp = vecinos[0].interfaz.ip;
        agregarArp(estado, router.id, ruta.siguienteSalto, vecinos[0].interfaz.mac, registrar);
        agregarArp(estado, vecinos[0].dispositivo.id, egreso.ip, egreso.mac, registrar);
      }
      recorrido.push(router.nombre || router.id);
      saltos.push({ dispositivo: router.id, interfaz: egreso.id });
      if (siguienteDispositivo.id !== router.id) {
        saltos.push({ dispositivo: siguienteDispositivo.id, interfaz: siguienteInterfaz.id });
      }
      agregarPaso("Avanzar al siguiente salto (TTL " + ttl + ")",
        "El paquete sale por " + router.id + ":" + egreso.id + ". Quedan " + (ttl - 1) +
        " saltos. Se repite desde comparar redes.", true);
      ttl -= 1;
      actualId = siguienteDispositivo.id;
      actualIface = siguienteInterfaz;
      actualIp = siguienteIp;
    }
  }

  function ping(estado, idOrigen, destinoIp) {
    estado.ahora = Date.now();
    return ejecutarPing(estado, idOrigen, destinoIp, { registrar: true, profundidad: 0 });
  }

  function diagnosticar(estado, idOrigen, destinoIp) {
    var resultado = ejecutarPing(estado, idOrigen, destinoIp, { registrar: false, profundidad: 0 });
    return resultado.diagnostico;
  }

  /* ---------------- Advertencias al configurar ---------------- */

  function advertenciasDe(estado, idDispositivo, opciones) {
    if (opciones === true || (opciones && opciones.modoDocente)) {
      return [];
    }
    var dev = buscarDispositivo(estado, idDispositivo);
    if (!dev) {
      return [];
    }
    var avisos = [];
    var vistos = {};
    function agregar(codigo, ctx) {
      if (vistos[codigo]) {
        return;
      }
      vistos[codigo] = true;
      var d = diagnosticoDe(codigo, ctx);
      avisos.push({
        codigo: d.codigo,
        titulo: d.titulo,
        explicacion: d.explicacion,
        sugerencia: d.sugerencia
      });
    }
    var i, j;
    for (i = 0; i < dev.interfaces.length; i++) {
      var iface = dev.interfaces[i];
      if (!iface.habilitada || !iface.ip || !Red.esIpValida(iface.ip)) {
        continue;
      }
      if (!prefijoValido(iface.prefijo)) {
        continue;
      }
      var red = Red.direccionDeRed(iface.ip, iface.prefijo);
      // D06: red o broadcast.
      if (Red.esDireccionDeRed(iface.ip, iface.prefijo) || Red.esBroadcast(iface.ip, iface.prefijo)) {
        agregar("D06", {
          ip: iface.ip,
          red: red,
          prefijo: iface.prefijo,
          rol: Red.esDireccionDeRed(iface.ip, iface.prefijo) ? "dirección de red" : "dirección de broadcast"
        });
      }
      // D07: duplicada en el mismo segmento.
      var pares = paresEnSegmento(estado, dev.id, iface.id);
      for (j = 0; j < pares.length; j++) {
        if (pares[j].interfaz.ip === iface.ip) {
          agregar("D07", { ip: iface.ip, origen: dev.id, otro: pares[j].dispositivo.id });
          break;
        }
      }
      // D09: gateway fuera de la subred de todas las interfaces.
      if (dev.gateway && Red.esIpValida(dev.gateway)) {
        var gwEnAlguna = false;
        for (var k = 0; k < dev.interfaces.length; k++) {
          var otra = dev.interfaces[k];
          if (!otra.habilitada || !otra.ip || !prefijoValido(otra.prefijo)) {
            continue;
          }
          if (Red.mismaRed(otra.ip, dev.gateway, otra.prefijo)) {
            gwEnAlguna = true;
            break;
          }
        }
        if (!gwEnAlguna) {
          agregar("D09", { gateway: dev.gateway, red: red, prefijo: iface.prefijo, equipo: dev.nombre || dev.id });
        }
      }
      // D14 y D15 contra los pares del segmento.
      for (j = 0; j < pares.length; j++) {
        var par = pares[j];
        if (!prefijoValido(par.interfaz.prefijo) || !Red.esIpValida(par.interfaz.ip)) {
          continue;
        }
        var mismaMia = Red.mismaRed(iface.ip, par.interfaz.ip, iface.prefijo);
        var mismaSuya = Red.mismaRed(iface.ip, par.interfaz.ip, par.interfaz.prefijo);
        if (!mismaMia && !mismaSuya) {
          var redPar = Red.direccionDeRed(par.interfaz.ip, par.interfaz.prefijo);
          agregar("D15", {
            origen: dev.id,
            destinoNombre: par.dispositivo.id,
            redA: red + "/" + iface.prefijo,
            redB: redPar + "/" + par.interfaz.prefijo,
            aire: iface.medio === "wireless" || par.interfaz.medio === "wireless"
          });
        } else if (iface.prefijo !== par.interfaz.prefijo || mismaMia !== mismaSuya) {
          agregar("D14", {
            ipA: iface.ip, prefijoA: iface.prefijo,
            ipB: par.interfaz.ip, prefijoB: par.interfaz.prefijo
          });
        }
      }
    }
    return avisos;
  }

  /* ---------------- DHCP ---------------- */

  function ipANumeroSeguro(ip) {
    return Red.aNumero(ip);
  }

  function numeroAIpSeguro(n) {
    return Red.aTexto(n >>> 0);
  }

  function apipaPara(idDispositivo, idInterfaz) {
    var base = 0;
    var texto = String(idDispositivo) + ":" + String(idInterfaz);
    for (var i = 0; i < texto.length; i++) {
      base = (base * 33 + texto.charCodeAt(i)) >>> 0;
    }
    var x = 1 + (base % 200);
    var y = 1 + ((base >>> 8) % 250);
    return "169.254." + x + "." + y;
  }

  function dhcpSolicitar(estado, idDispositivo, idInterfaz) {
    var cliente = buscarDispositivo(estado, idDispositivo);
    if (!cliente) {
      return {
        exito: false,
        mensajes: [],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D01", { origen: idDispositivo, interfaz: idInterfaz })
      };
    }
    var iface = buscarInterfaz(cliente, idInterfaz);
    if (!iface) {
      return {
        exito: false,
        mensajes: [],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D01", { origen: idDispositivo, interfaz: idInterfaz })
      };
    }
    if (!cliente.encendido || !iface.habilitada) {
      return {
        exito: false,
        mensajes: [],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D01", { origen: idDispositivo, interfaz: idInterfaz })
      };
    }
    var enlacesCliente = enlacesDe(estado, idDispositivo, idInterfaz);
    var enlaceCliente = null;
    for (var lic = 0; lic < enlacesCliente.length; lic++) {
      if (enlacesCliente[lic] && enlacesCliente[lic].estado === "up") {
        enlaceCliente = enlacesCliente[lic];
        break;
      }
    }
    if (!enlaceCliente) {
      return {
        exito: false,
        mensajes: [{ tipo: "discover", origen: idDispositivo, destino: "broadcast" }],
        ip: null,
        prefijo: null,
        gateway: null,
        diagnostico: diagnosticoDe("D02", { origen: idDispositivo, interfaz: idInterfaz })
      };
    }

    // Servidores DHCP alcanzables en el mismo segmento.
    var candidatos = [];
    var claves = segmentoL2(estado, idDispositivo, idInterfaz);
    for (var i = 0; i < claves.length; i++) {
      var partes = claves[i].split(":");
      var dev = buscarDispositivo(estado, partes[0]);
      if (esRouter(dev) && dev.encendido && dev.dhcp && dev.dhcp.habilitado) {
        if (candidatos.indexOf(dev) < 0) {
          candidatos.push(dev);
        }
      }
    }
    var mensajes = [{ tipo: "discover", origen: idDispositivo, destino: "broadcast" }];
    if (candidatos.length === 0) {
      var apipa = apipaPara(idDispositivo, idInterfaz);
      iface.ip = apipa;
      iface.prefijo = 16;
      iface.modo = "dhcp";
      cliente.gateway = null;
      return {
        exito: false,
        mensajes: mensajes,
        ip: apipa,
        prefijo: 16,
        gateway: null,
        diagnostico: diagnosticoDe("D16", {})
      };
    }
    var servidor = candidatos[0];
    var cfg = servidor.dhcp;
    var desdeNum = ipANumeroSeguro(cfg.desde);
    var hastaNum = ipANumeroSeguro(cfg.hasta);
    if (desdeNum === null || hastaNum === null || desdeNum > hastaNum ||
        !prefijoValido(cfg.prefijo)) {
      var apipaMala = apipaPara(idDispositivo, idInterfaz);
      iface.ip = apipaMala;
      iface.prefijo = 16;
      iface.modo = "dhcp";
      cliente.gateway = null;
      return {
        exito: false,
        mensajes: mensajes,
        ip: apipaMala,
        prefijo: 16,
        gateway: null,
        diagnostico: diagnosticoDe("D16", { servidor: servidor.id })
      };
    }
    if (!estado.concesiones[servidor.id]) {
      estado.concesiones[servidor.id] = {};
    }
    var concesiones = estado.concesiones[servidor.id];
    // Marcar como ocupadas las IP estáticas del segmento que caigan en el rango.
    function ocupada(ipTexto) {
      if (concesiones[ipTexto]) {
        var c = concesiones[ipTexto];
        if (c.cliente === idDispositivo && c.interfaz === idInterfaz) {
          return false;
        }
        return true;
      }
      var duenos = configuradosConIp(estado, ipTexto);
      for (var d = 0; d < duenos.length; d++) {
        if (duenos[d].dispositivo.id === idDispositivo && duenos[d].interfaz.id === idInterfaz) {
          continue;
        }
        return true;
      }
      return false;
    }
    var elegida = null;
    for (var n = desdeNum; n <= hastaNum; n++) {
      var textoIp = numeroAIpSeguro(n);
      if (!ocupada(textoIp)) {
        elegida = textoIp;
        break;
      }
    }
    if (!elegida) {
      var apipaLlena = apipaPara(idDispositivo, idInterfaz);
      iface.ip = apipaLlena;
      iface.prefijo = 16;
      iface.modo = "dhcp";
      cliente.gateway = null;
      return {
        exito: false,
        mensajes: mensajes,
        ip: apipaLlena,
        prefijo: 16,
        gateway: null,
        diagnostico: diagnosticoDe("D16", { servidor: servidor.id })
      };
    }
    mensajes.push({ tipo: "offer", origen: servidor.id, destino: idDispositivo });
    mensajes.push({ tipo: "request", origen: idDispositivo, destino: servidor.id });
    mensajes.push({ tipo: "ack", origen: servidor.id, destino: idDispositivo });
    concesiones[elegida] = { cliente: idDispositivo, interfaz: idInterfaz, mac: iface.mac };
    iface.ip = elegida;
    iface.prefijo = cfg.prefijo;
    iface.modo = "dhcp";
    cliente.gateway = cfg.gateway || null;
    return {
      exito: true,
      mensajes: mensajes,
      ip: elegida,
      prefijo: cfg.prefijo,
      gateway: cfg.gateway || null,
      diagnostico: null
    };
  }

  /* ---------------- Tablas ---------------- */

  function tablaArp(estado, idDispositivo) {
    var tabla = estado.arp[idDispositivo] || [];
    var copia = [];
    for (var i = 0; i < tabla.length; i++) {
      if (tabla[i].vence >= estado.ahora) {
        copia.push({ ip: tabla[i].ip, mac: tabla[i].mac, vence: tabla[i].vence });
      }
    }
    return copia;
  }

  function tablaMac(estado, idSwitch) {
    var tabla = estado.mac[idSwitch] || [];
    var copia = [];
    for (var i = 0; i < tabla.length; i++) {
      if (tabla[i].vence >= estado.ahora) {
        copia.push({ mac: tabla[i].mac, puerto: tabla[i].puerto, vence: tabla[i].vence });
      }
    }
    return copia;
  }

  /* ---------------- Autopruebas ----------------
   * Topologías mínimas en memoria. Cada una arma lo justo para aislar un
   * diagnóstico, sin depender de los ejemplos de la capa 3. */

  function fabPc(id, ip, prefijo, gateway, extra) {
    extra = extra || {};
    return {
      id: id,
      tipo: "pc",
      nombre: id,
      x: extra.x !== undefined ? extra.x : 100,
      y: extra.y !== undefined ? extra.y : 100,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: [
        {
          id: "eth0",
          nombre: "eth0",
          medio: "ethernet",
          habilitada: extra.habilitada !== undefined ? extra.habilitada : true,
          modo: extra.modo || "estatico",
          ip: ip !== undefined ? ip : null,
          prefijo: prefijo !== undefined ? prefijo : 24,
          mac: "02:00:00:00:01:" + id.slice(-2).padStart(2, "0")
        },
        {
          id: "wlan0",
          nombre: "wlan0",
          medio: "wireless",
          habilitada: false,
          modo: "estatico",
          ip: null,
          prefijo: 24,
          mac: "02:00:00:00:02:" + id.slice(-2).padStart(2, "0")
        }
      ],
      gateway: gateway !== undefined ? gateway : null,
      dns: "8.8.8.8",
      rutas: [],
      dhcp: null
    };
  }

  function fabSwitch(id, extra) {
    extra = extra || {};
    var interfaces = [];
    for (var i = 1; i <= 8; i++) {
      interfaces.push({
        id: "fa0/" + i,
        nombre: "fa0/" + i,
        medio: "ethernet",
        habilitada: true,
        modo: "estatico",
        ip: null,
        prefijo: 24,
        mac: "02:00:00:00:03:0" + i
      });
    }
    interfaces.push({
      id: "fib0", nombre: "fib0", medio: "fibra", habilitada: true,
      modo: "estatico", ip: null, prefijo: 24, mac: "02:00:00:00:03:09"
    });
    return {
      id: id, tipo: "switch-l2", nombre: id,
      x: extra.x !== undefined ? extra.x : 200,
      y: extra.y !== undefined ? extra.y : 200,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: interfaces,
      gateway: null, dns: null, rutas: [], dhcp: null
    };
  }

  // Punto de acceso: bridge de capa 2 entre el aire (wlan0, modo ap) y el
  // cable (eth0). No enruta; la IP es sólo de gestión y puede ser nula.
  function fabAp(id, ipGestion, extra) {
    extra = extra || {};
    return {
      id: id, tipo: "ap", nombre: id,
      x: extra.x !== undefined ? extra.x : 200,
      y: extra.y !== undefined ? extra.y : 200,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: [
        {
          id: "wlan0", nombre: "wlan0", medio: "wireless", modoRadio: "ap",
          habilitada: true, modo: "estatico",
          ip: ipGestion || null, prefijo: 24,
          mac: "02:00:00:00:05:01"
        },
        {
          id: "eth0", nombre: "eth0", medio: "ethernet", modoRadio: null,
          habilitada: true, modo: "estatico",
          ip: null, prefijo: 24,
          mac: "02:00:00:00:05:02"
        }
      ],
      gateway: null, dns: null, rutas: [], dhcp: null
    };
  }

  function fabRouter(id, bocas, rutas, extra) {
    extra = extra || {};
    // bocas: [{id, ip, prefijo, medio, modoRadio, habilitada}]
    var interfaces = [];
    for (var i = 0; i < bocas.length; i++) {
      interfaces.push({
        id: bocas[i].id,
        nombre: bocas[i].id,
        medio: bocas[i].medio || "ethernet",
        modoRadio: bocas[i].modoRadio || null,
        habilitada: bocas[i].habilitada !== undefined ? bocas[i].habilitada : true,
        modo: "estatico",
        ip: bocas[i].ip || null,
        prefijo: bocas[i].prefijo !== undefined ? bocas[i].prefijo : 24,
        mac: "02:00:00:00:04:0" + (i + 1)
      });
    }
    return {
      id: id, tipo: "router", nombre: id,
      x: extra.x !== undefined ? extra.x : 300,
      y: extra.y !== undefined ? extra.y : 200,
      encendido: extra.encendido !== undefined ? extra.encendido : true,
      interfaces: interfaces,
      gateway: null, dns: null,
      rutas: rutas || [],
      dhcp: extra.dhcp || null
    };
  }

  function fabEnlace(id, aDev, aIf, bDev, bIf, extra) {
    extra = extra || {};
    return {
      id: id,
      a: { dispositivo: aDev, interfaz: aIf },
      b: { dispositivo: bDev, interfaz: bIf },
      tipo: extra.tipo || "ethernet",
      estado: extra.estado || "up",
      velocidadMbps: 100,
      retardoMs: 1
    };
  }

  function fabTopo(dispositivos, enlaces) {
    return {
      version: 1,
      nombre: "prueba",
      dispositivos: dispositivos,
      enlaces: enlaces,
      escenario: null
    };
  }

  function autopruebas() {
    var total = 0;
    var pasadas = 0;
    var fallos = [];

    function comparar(nombre, obtenido, esperado) {
      total += 1;
      var a = JSON.stringify(obtenido);
      var b = JSON.stringify(esperado);
      if (a === b) {
        pasadas += 1;
      } else {
        fallos.push({ nombre: nombre, esperado: esperado, obtenido: obtenido });
      }
    }

    // 1. D01: interfaz deshabilitada.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.1", { habilitada: false }),
         fabPc("pc2", "192.168.1.20", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D01 interfaz deshabilitada", ping(est, "pc1", "192.168.1.1").diagnostico.codigo, "D01");
    })();

    // 2. D02: enlace en down.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.1"),
         fabRouter("r1", [{ id: "g0/0", ip: "192.168.1.1", prefijo: 24 }], []),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1", { estado: "down" }),
         fabEnlace("l2", "r1", "g0/0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D02 enlace caido", ping(est, "pc1", "192.168.1.1").diagnostico.codigo, "D02");
    })();

    // 3. D03: medios incompatibles (fibra contra ethernet).
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1", { tipo: "fibra" })]);
      var est = crearEstado(topo);
      comparar("D03 medios incompatibles", ping(est, "pc1", "192.168.1.20").diagnostico.codigo, "D03");
    })();

    // 4. D04: sin IP.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", null, 24, null),
         fabPc("pc2", "192.168.1.20", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D04 sin IP", ping(est, "pc1", "192.168.1.20").diagnostico.codigo, "D04");
    })();

    // 5. D05: prefijo inválido.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 33, null),
         fabPc("pc2", "192.168.1.20", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D05 mascara invalida", ping(est, "pc1", "192.168.1.20").diagnostico.codigo, "D05");
    })();

    // 6. D06: broadcast .95/27.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "10.45.7.95", 27, "10.45.7.65"),
         fabPc("pc2", "10.45.7.66", 27, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D06 broadcast", ping(est, "pc1", "10.45.7.66").diagnostico.codigo, "D06");
    })();

    // 7. D07: misma IP en el mismo segmento.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, null),
         fabPc("pc2", "192.168.1.10", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1"),
         fabEnlace("l2", "pc2", "eth0", "sw1", "fa0/2")]);
      var est = crearEstado(topo);
      comparar("D07 duplicada", ping(est, "pc1", "192.168.1.10").diagnostico.codigo, "D07");
    })();

    // 8. D08: sin gateway a otra subred.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, null),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1")]);
      var est = crearEstado(topo);
      comparar("D08 sin gateway", ping(est, "pc1", "192.168.2.10").diagnostico.codigo, "D08");
    })();

    // 9. D09: gateway fuera de la subred. La tabla pedía 10.45.7.66/28 con
    // gateway 10.45.7.65, pero con aritmética correcta ambos caen en
    // 10.45.7.64/28 y no hay D09 (ver nota al final). Se prueba la intención
    // didáctica con una IP que sí queda fuera: 10.45.7.98/28 vs 10.45.7.65.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "10.45.7.98", 28, "10.45.7.65"),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1")]);
      var est = crearEstado(topo);
      comparar("D09 gateway fuera de subred", ping(est, "pc1", "8.8.8.8").diagnostico.codigo, "D09");
    })();

    // 10. D10: gateway sin ARP.
    (function () {
      var topo = fabTopo(
        [fabPc("pc1", "192.168.1.10", 24, "192.168.1.99"),
         fabSwitch("sw1")],
        [fabEnlace("l1", "pc1", "eth0", "sw1", "fa0/1")]);
      var est = crearEstado(topo);
      comparar("D10 gateway sin ARP", ping(est, "pc1", "8.8.8.8").diagnostico.codigo, "D10");
    })();

    // 11. D11: router de ida sin ruta.
    (function () {

      comparar("D09 nombra al equipo", res.diagnostico && res.diagnostico.explicacion.indexOf("PC-Aula no puede alcanzarlo") >= 0, true);
    })();

    // 36. Un destino mal escrito no es un diagnóstico de red.
    (function () {
      var topo = fabTopo([fabPc("pc-admin", "10.45.7.66", 27, "10.45.7.65")], []);
      var res = ping(crearEstado(topo), "pc-admin", "10.45.7.1000");
      comparar("destino inválido da ENTRADA", res.diagnostico.codigo, "ENTRADA");
      comparar("destino inválido sin pasos", res.pasos.length, 0);
    })();

    return { total: total, pasadas: pasadas, fallos: fallos };
  }

  return {
    crearEstado: crearEstado,
    ping: ping,
    diagnosticar: diagnosticar,
    advertenciasDe: advertenciasDe,
    dhcpSolicitar: dhcpSolicitar,
    rutaElegida: rutaElegida,
    tablaArp: tablaArp,
    tablaMac: tablaMac,
    CATALOGO: CATALOGO,
    UMBRAL_WIRELESS: UMBRAL_WIRELESS,
    umbralWireless: UMBRAL_WIRELESS,
    autopruebas: autopruebas
  };
})();

</script>
<script>
/* capa3-escenarios.js — Capa 3: persistencia, ejemplos y verificación.
 *
 * Objeto global `Escenarios` con las firmas del §5 del BASE.
 * JavaScript vanilla, sin DOM, sin dependencias. Usa los objetos globales
 * `Red` (capa 1) y `Motor` (capa 2): acá no se recalcula nada de
 * direccionamiento ni se diagnostica nada a mano.
 *
 * Decisiones:
 * - `validarTopologia` devuelve todos los errores juntos, no sólo el primero,
 *   y cada mensaje nombra el id o campo problemático para que el docente
 *   pueda corregirlo a mano en el JSON.
 * - El juego de interfaces de cada dispositivo se valida contra la tabla
 *   del §4 del BASE de forma exacta (mismos ids y mismos medios): el
 *   hardware es fijo, como en un equipo real.
 * - `aplicarFallas` nunca muta el original: trabaja sobre una copia profunda.
 * - `exportarParaAlumno` aplica las fallas y elimina la clave `fallas`, de
 *   modo que el archivo del alumno es una red que simplemente viene mal
 *   configurada, sin nada que espiar.
 * - `verificarDesafio` lee los `requerimientos` del escenario (también
 *   acepta `sectores`) y deriva la subred de cada sector de las IP y
 *   máscaras que el alumno configuró en los equipos: verifica la respuesta
 *   del alumno, no lo que declara el enunciado.
 */

var Escenarios = (function () {
  "use strict";

  /* ---------------- Tablas fijas ---------------- */

  // Versiones de topología soportadas por esta capa.
  var VERSIONES_SOPORTADAS = [1];

  // Tipos de dispositivo reconocidos (§4 del BASE, más el punto de acceso).
  var TIPOS_VALIDOS = ["pc", "switch-l2", "router", "camara", "iot", "ap"];

  // Medios y tipos de enlace reconocidos.
  var MEDIOS_VALIDOS = ["ethernet", "fibra", "wireless"];

  // Juego de interfaces esperado por tipo: ids y medios exactos.
  var INTERFACES_ESPERADAS = {
    pc: [
      { id: "eth0", medio: "ethernet" },
      { id: "wlan0", medio: "wireless" }
    ],
    camara: [
      { id: "eth0", medio: "ethernet" },
      { id: "wlan0", medio: "wireless" }
    ],
    iot: [
      { id: "wlan0", medio: "wireless" }
    ],
    router: [
      { id: "g0/0", medio: "ethernet" },
      { id: "g0/1", medio: "ethernet" },
      { id: "fib0", medio: "fibra" },
      { id: "wlan0", medio: "wireless" }
    ],
    "switch-l2": [
      { id: "fa0/1", medio: "ethernet" },
      { id: "fa0/2", medio: "ethernet" },
      { id: "fa0/3", medio: "ethernet" },
      { id: "fa0/4", medio: "ethernet" },
      { id: "fa0/5", medio: "ethernet" },
      { id: "fa0/6", medio: "ethernet" },
      { id: "fa0/7", medio: "ethernet" },
      { id: "fa0/8", medio: "ethernet" },
      { id: "fib0", medio: "fibra" }
    ],
    // Punto de acceso: bridge de capa 2 entre el aire y el cable.
    ap: [
      { id: "wlan0", medio: "wireless" },
      { id: "eth0", medio: "ethernet" }
    ]
  };

  // Modelos de router. El estándar es el de la tabla del §4; el de 8
  // puertos replica un equipo de oficina (por ejemplo, un MikroTik): cada
  // puerto es una interfaz ruteada que puede tener su propia subred.
  var MODELOS_ROUTER = {
    "8-puertos": [
      { id: "ether1", medio: "ethernet" },
      { id: "ether2", medio: "ethernet" },
      { id: "ether3", medio: "ethernet" },
      { id: "ether4", medio: "ethernet" },
      { id: "ether5", medio: "ethernet" },
      { id: "ether6", medio: "ethernet" },
      { id: "ether7", medio: "ethernet" },
      { id: "ether8", medio: "ethernet" },
      { id: "sfp1", medio: "fibra" },
      { id: "wlan1", medio: "wireless" }
    ]
  };

  function interfacesEsperadas(dispositivo) {
    if (dispositivo.tipo === "router" && dispositivo.modelo && MODELOS_ROUTER[dispositivo.modelo]) {
      return MODELOS_ROUTER[dispositivo.modelo];
    }
    return INTERFACES_ESPERADAS[dispositivo.tipo] || [];
  }

  // Modo de radio efectivo de una interfaz wireless. Si no está declarado se
  // usa el valor inicial por tipo (ap en puntos de acceso y routers, cliente
  // en el resto), igual que hace el Motor.
  function modoEfectivo(topologia, idDispositivo, idInterfaz) {
    var dev = buscarDispositivo(topologia, idDispositivo);
    var iface = buscarInterfaz(dev, idInterfaz);
    if (!iface || iface.medio !== "wireless") {
      return null;
    }
    if (iface.modoRadio === "ap" || iface.modoRadio === "cliente" || iface.modoRadio === "bridge") {
      return iface.modoRadio;
    }
    if (dev && (dev.tipo === "ap" || dev.tipo === "router")) {
      return "ap";
    }
    return "cliente";
  }

  /* ---------------- Utilidades internas ---------------- */

  // Copia profunda por JSON: las topologías son sólo datos, sin funciones.
  function clonar(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function esEnteroPrefijo(valor) {
    return typeof valor === "number" && Number.isInteger(valor) && valor >= 0 && valor <= 32;
  }

  function textoNoVacio(valor) {
    return typeof valor === "string" && valor.trim() !== "";
  }

  function buscarDispositivo(topologia, idDispositivo) {
    if (!topologia || !topologia.dispositivos) {
      return null;
    }
    for (var i = 0; i < topologia.dispositivos.length; i++) {
      if (topologia.dispositivos[i].id === idDispositivo) {
        return topologia.dispositivos[i];
      }
    }
    return null;
  }

  function buscarInterfaz(dispositivo, idInterfaz) {
    if (!dispositivo || !dispositivo.interfaces) {
      return null;
    }
    for (var i = 0; i < dispositivo.interfaces.length; i++) {
      if (dispositivo.interfaces[i].id === idInterfaz) {
        return dispositivo.interfaces[i];
      }
    }
    return null;
  }

  function buscarEnlace(topologia, idEnlace) {
    if (!topologia || !topologia.enlaces) {
      return null;
    }
    for (var i = 0; i < topologia.enlaces.length; i++) {
      if (topologia.enlaces[i].id === idEnlace) {
        return topologia.enlaces[i];
      }
    }
    return null;
  }

  // Primera interfaz con IP válida: primero entre las habilitadas, si no
  // entre todas. Sirve para saber con qué dirección se presenta un equipo.
  function primeraIpDe(dispositivo) {
    if (!dispositivo || !dispositivo.interfaces) {
      return null;
    }
    var i;
    for (i = 0; i < dispositivo.interfaces.length; i++) {
      var a = dispositivo.interfaces[i];
      if (a.habilitada && textoNoVacio(a.ip) && Red.esIpValida(a.ip)) {
        return { interfaz: a, ip: a.ip.trim(), prefijo: a.prefijo };
      }
    }
    for (i = 0; i < dispositivo.interfaces.length; i++) {
      var b = dispositivo.interfaces[i];
      if (textoNoVacio(b.ip) && Red.esIpValida(b.ip)) {
        return { interfaz: b, ip: b.ip.trim(), prefijo: b.prefijo };
      }
    }
    return null;
  }

  /* ---------------- Validación e importación ---------------- */

  function validarTopologia(obj) {
    var errores = [];

    function anotar(campo, mensaje) {
      errores.push({ campo: campo, mensaje: mensaje });
    }

    if (!obj || typeof obj !== "object" || Array.isArray(obj)) {
      anotar("topologia", "La topología no es un objeto válido.");
      return { ok: false, errores: errores };
    }

    // Versión presente y soportada.
    if (obj.version === undefined || obj.version === null) {
      anotar("version", "Falta el campo version de la topología.");
    } else if (VERSIONES_SOPORTADAS.indexOf(obj.version) < 0) {
      anotar("version", "Versión no soportada: " + JSON.stringify(obj.version) + ".");
    }

    // Sin mutar el objeto recibido: se trabaja sobre listas locales.
    var listaDispositivos = Array.isArray(obj.dispositivos) ? obj.dispositivos : null;
    var listaEnlaces = Array.isArray(obj.enlaces) ? obj.enlaces : null;
    if (!listaDispositivos) {
      anotar("dispositivos", "El campo dispositivos debe ser una lista.");
      listaDispositivos = [];
    }
    if (!listaEnlaces) {
      anotar("enlaces", "El campo enlaces debe ser una lista.");
      listaEnlaces = [];
    }

    // Ids de dispositivo únicos en toda la topología.
    var vistosDisp = {};
    var i;
    for (i = 0; i < listaDispositivos.length; i++) {
      var dev = listaDispositivos[i];
      var idDev = dev && dev.id;
      if (!textoNoVacio(idDev)) {
        anotar("dispositivos[" + i + "].id", "Hay un dispositivo sin id.");
        continue;
      }
      if (vistosDisp[idDev]) {
        anotar("dispositivos", "Id de dispositivo duplicado: \"" + idDev + "\".");
      } else {
        vistosDisp[idDev] = true;
      }
    }

    // Por dispositivo: tipo, interfaces, IPs y prefijos.
    for (i = 0; i < listaDispositivos.length; i++) {
      var d = listaDispositivos[i];
      if (!d || !textoNoVacio(d.id)) {
        continue;
      }
      var etiqueta = "dispositivos." + d.id;

      if (TIPOS_VALIDOS.indexOf(d.tipo) < 0) {
        anotar(etiqueta + ".tipo", "Tipo de dispositivo desconocido en \"" + d.id + "\": " + JSON.stringify(d.tipo) + ".");
        continue;
      }
      if (typeof d.encendido !== "boolean") {
        anotar(etiqueta + ".encendido", "El estado encendido de \"" + d.id + "\" debe ser booleano.");
      }
      if (typeof d.x !== "number" || !isFinite(d.x) || typeof d.y !== "number" || !isFinite(d.y)) {
        anotar(etiqueta, "Las coordenadas x e y de \"" + d.id + "\" deben ser números finitos.");
      }

      if (!Array.isArray(d.interfaces)) {
        anotar(etiqueta + ".interfaces", "El dispositivo \"" + d.id + "\" no trae lista de interfaces.");
        continue;
      }

      // Ids de interfaz únicos dentro del dispositivo.
      var vistasIf = {};
      var j;
      for (j = 0; j < d.interfaces.length; j++) {
        var iface = d.interfaces[j];
        var idIf = iface && iface.id;
        if (!textoNoVacio(idIf)) {
          anotar(etiqueta + ".interfaces[" + j + "].id", "Hay una interfaz sin id en \"" + d.id + "\".");
          continue;
        }
        if (vistasIf[idIf]) {
          anotar(etiqueta + ".interfaces", "Id de interfaz duplicado en \"" + d.id + "\": \"" + idIf + "\".");
        } else {
          vistasIf[idIf] = true;
        }
      }

      // Juego de interfaces coherente con la tabla del §4 del BASE.
      if (d.modelo !== undefined && d.modelo !== null) {
        if (d.tipo !== "router") {
          anotar(etiqueta + ".modelo", "Sólo los routers tienen modelo (\"" + d.id + "\" es " + d.tipo + ").");
        } else if (!MODELOS_ROUTER[d.modelo]) {
          anotar(etiqueta + ".modelo", "Modelo de router desconocido en \"" + d.id + "\": tiene que ser \"8-puertos\" o no indicarse.");
        }
      }
      var esperadas = interfacesEsperadas(d);
      var nombresEsperados = esperadas.map(function (e) { return e.id; }).join(", ");
      if (d.interfaces.length !== esperadas.length) {
        anotar(etiqueta + ".interfaces", "El dispositivo \"" + d.id + "\" de tipo \"" + d.tipo + "\" debería tener interfaces " + nombresEsperados + ".");
      } else {
        for (j = 0; j < esperadas.length; j++) {
          var esp = esperadas[j];
          var real = buscarInterfaz(d, esp.id);
          if (!real) {
            anotar(etiqueta + ".interfaces", "Al dispositivo \"" + d.id + "\" le falta la interfaz \"" + esp.id + "\" (debería tener " + nombresEsperados + ").");
          } else if (real.medio !== esp.medio) {
            anotar(etiqueta + ".interfaces." + esp.id, "La interfaz \"" + esp.id + "\" de \"" + d.id + "\" debería ser de medio \"" + esp.medio + "\".");
          }
        }
      }

      // IPs, prefijos y máscaras de cada interfaz.
      for (j = 0; j < d.interfaces.length; j++) {
        var f = d.interfaces[j];
        if (!f || !textoNoVacio(f.id)) {
          continue;
        }
        var campoBase = etiqueta + ".interfaces." + f.id;
        if (typeof f.habilitada !== "boolean") {
          anotar(campoBase + ".habilitada", "El estado habilitada de \"" + d.id + ":" + f.id + "\" debe ser booleano.");
        }
        if (f.ip !== undefined && f.ip !== null && String(f.ip).trim() !== "") {
          if (!Red.esIpValida(String(f.ip))) {
            anotar(campoBase + ".ip", "IP inválida en \"" + d.id + ":" + f.id + "\": " + JSON.stringify(f.ip) + ".");
          }
        }
        if (!esEnteroPrefijo(f.prefijo)) {
          anotar(campoBase + ".prefijo", "Prefijo inválido en \"" + d.id + ":" + f.id + "\": tiene que ser un entero entre 0 y 32.");
        } else {
          var mascaraDerivada = Red.prefijoAMascara(f.prefijo);
          if (mascaraDerivada === null || !Red.esMascaraValida(mascaraDerivada)) {
            anotar(campoBase + ".prefijo", "La máscara derivada del prefijo " + f.prefijo + " en \"" + d.id + ":" + f.id + "\" no es válida.");
          }
        }
        if (f.mascara !== undefined && f.mascara !== null && String(f.mascara).trim() !== "") {
          if (!Red.esMascaraValida(String(f.mascara))) {
            anotar(campoBase + ".mascara", "Máscara inválida en \"" + d.id + ":" + f.id + "\": los unos no son contiguos.");
          }
        }
        if (f.medio !== undefined && MEDIOS_VALIDOS.indexOf(f.medio) < 0) {
          anotar(campoBase + ".medio", "Medio desconocido en \"" + d.id + ":" + f.id + "\": " + JSON.stringify(f.medio) + ".");
        }
        // El modo de radio sólo existe en interfaces wireless.
        if (f.modoRadio !== undefined && f.modoRadio !== null && String(f.modoRadio).trim() !== "") {
          if (f.medio !== "wireless") {
            anotar(campoBase + ".modoRadio", "El modo de radio sólo existe en interfaces wireless (\"" + d.id + ":" + f.id + "\" es " + f.medio + ").");
          } else if (["ap", "cliente", "bridge"].indexOf(f.modoRadio) < 0) {
            anotar(campoBase + ".modoRadio", "Modo de radio desconocido en \"" + d.id + ":" + f.id + "\": tiene que ser ap, cliente o bridge.");
          }
        }
      }

      // Puerta de enlace y DNS, cuando están presentes.
      if (d.gateway !== undefined && d.gateway !== null && String(d.gateway).trim() !== "") {
        if (!Red.esIpValida(String(d.gateway))) {
          anotar(etiqueta + ".gateway", "Puerta de enlace inválida en \"" + d.id + "\": " + JSON.stringify(d.gateway) + ".");
        }
      }
      if (d.dns !== undefined && d.dns !== null && String(d.dns).trim() !== "") {
        if (!Red.esIpValida(String(d.dns))) {
          anotar(etiqueta + ".dns", "DNS inválido en \"" + d.id + "\": " + JSON.stringify(d.dns) + ".");
        }
      }

      // Rutas de los routers.
      if (d.rutas !== undefined && d.rutas !== null) {
        if (!Array.isArray(d.rutas)) {
          anotar(etiqueta + ".rutas", "Las rutas de \"" + d.id + "\" deben ser una lista.");
        } else {
          for (var r = 0; r < d.rutas.length; r++) {
            var ruta = d.rutas[r];
            var campoRuta = etiqueta + ".rutas[" + r + "]";
            if (!ruta || !Red.esIpValida(String(ruta.destino || ""))) {
              anotar(campoRuta, "Destino de ruta inválido en \"" + d.id + "\".");
            }
            if (!ruta || !esEnteroPrefijo(ruta.prefijo)) {
              anotar(campoRuta, "Prefijo de ruta inválido en \"" + d.id + "\": tiene que ser un entero entre 0 y 32.");
            }
            if (ruta && ruta.siguienteSalto !== undefined && ruta.siguienteSalto !== null && String(ruta.siguienteSalto).trim() !== "") {
              if (!Red.esIpValida(String(ruta.siguienteSalto))) {
                anotar(campoRuta, "Siguiente salto inválido en \"" + d.id + "\": " + JSON.stringify(ruta.siguienteSalto) + ".");
              }
            }
          }
        }
      }

      // Servidor DHCP, cuando está configurado.
      if (d.dhcp !== undefined && d.dhcp !== null) {
        var cfg = d.dhcp;
        if (cfg.habilitado) {
          if (!Red.esIpValida(String(cfg.desde || "")) || !Red.esIpValida(String(cfg.hasta || ""))) {
            anotar(etiqueta + ".dhcp", "Rango DHCP inválido en \"" + d.id + "\": revisá las direcciones desde y hasta.");
          }
          if (!esEnteroPrefijo(cfg.prefijo)) {
            anotar(etiqueta + ".dhcp", "Prefijo DHCP inválido en \"" + d.id + "\".");
          }
        }
      }
    }

    // Enlaces: extremos existentes, modos de radio compatibles, medios
    // compatibles y, salvo en puertos ap, sin reusar interfaces.
    var usoPuertos = {};
    var vistosEnlaces = {};
    for (i = 0; i < listaEnlaces.length; i++) {
      var e = listaEnlaces[i];
      var idE = (e && e.id) || ("enlaces[" + i + "]");
      if (!e || !textoNoVacio(e.id)) {
        anotar("enlaces[" + i + "].id", "Hay un enlace sin id.");
      } else if (vistosEnlaces[e.id]) {
        anotar("enlaces", "Id de enlace duplicado: \"" + e.id + "\".");
      } else {
        vistosEnlaces[e.id] = true;
      }
      if (!e || !e.a || !e.b) {
        anotar("enlaces." + idE, "El enlace \"" + idE + "\" no tiene sus dos extremos.");
        continue;
      }
      var devA = buscarDispositivo(obj, e.a.dispositivo);
      var devB = buscarDispositivo(obj, e.b.dispositivo);
      var ifA = devA ? buscarInterfaz(devA, e.a.interfaz) : null;
      var ifB = devB ? buscarInterfaz(devB, e.b.interfaz) : null;
      if (!devA) {
        anotar("enlaces." + idE, "El enlace \"" + idE + "\" apunta a un dispositivo inexistente: \"" + e.a.dispositivo + "\".");
      } else if (!ifA) {
        anotar("enlaces." + idE, "El enlace \"" + idE + "\" apunta a una interfaz inexistente: \"" + e.a.dispositivo + ":" + e.a.interfaz + "\".");
      }
      if (!devB) {
        anotar("enlaces." + idE, "El enlace \"" + idE + "\" apunta a un dispositivo inexistente: \"" + e.b.dispositivo + "\".");
      } else if (!ifB) {
        anotar("enlaces." + idE, "El enlace \"" + idE + "\" apunta a una interfaz inexistente: \"" + e.b.dispositivo + ":" + e.b.interfaz + "\".");
      }

      // Uso acumulado por puerto: un puerto ap sostiene un enlace por cliente.
      var claves = [];
      if (devA && ifA) {
        claves.push(e.a.dispositivo + ":" + e.a.interfaz);
      }
      if (devB && ifB) {
        claves.push(e.b.dispositivo + ":" + e.b.interfaz);
      }
      for (var k = 0; k < claves.length; k++) {
        if (!usoPuertos[claves[k]]) {
          usoPuertos[claves[k]] = [];
        }
        usoPuertos[claves[k]].push(idE);
      }

      // Medios compatibles con el tipo del enlace.
      if (e.tipo !== undefined && MEDIOS_VALIDOS.indexOf(e.tipo) < 0) {
        anotar("enlaces." + idE, "Tipo de enlace desconocido en \"" + idE + "\": " + JSON.stringify(e.tipo) + ".");
      } else if (ifA && ifB) {
        if (e.tipo !== ifA.medio || e.tipo !== ifB.medio) {
          anotar("enlaces." + idE, "Medios incompatibles en el enlace \"" + idE + "\": " + ifA.medio + " con " + ifB.medio + " para un enlace " + e.tipo + ".");
        } else if (e.tipo === "wireless") {
          // Pares válidos: cliente contra ap, o bridge contra bridge.
          var modoA = modoEfectivo(obj, e.a.dispositivo, e.a.interfaz);
          var modoB = modoEfectivo(obj, e.b.dispositivo, e.b.interfaz);
          var parOk = (modoA === "ap" && modoB === "cliente") ||
            (modoA === "cliente" && modoB === "ap") ||
            (modoA === "bridge" && modoB === "bridge");
          if (!parOk) {
            anotar("enlaces." + idE, "Modos de radio incompatibles en el enlace \"" + idE + "\": " +
              modoA + " con " + modoB + ". Un cliente sólo se asocia a un ap; bridge sólo con bridge.");
          }
        }
      }
    }

    // Conteo por puerto: cobre y fibra admiten un solo enlace; un puerto
    // wireless en modo ap admite uno por cliente asociado.
    Object.keys(usoPuertos).forEach(function (clave) {
      var ids = usoPuertos[clave];
      if (ids.length < 2) {
        return;
      }
      var partes = clave.split(":");
      var devId = partes[0];
      var ifId = partes.slice(1).join(":");
      var dev = buscarDispositivo(obj, devId);
      var iface = buscarInterfaz(dev, ifId);
      var esAp = iface && iface.medio === "wireless" && modoEfectivo(obj, devId, ifId) === "ap";
      var todosWireless = ids.every(function (idL) {
        var enl = buscarEnlace(obj, idL);
        return enl && enl.tipo === "wireless";
      });
      if (!(esAp && todosWireless)) {
        anotar("enlaces." + ids[1], "La interfaz \"" + clave + "\" participa en dos enlaces (\"" + ids[0] + "\" y \"" + ids[1] + "\").");
      }
    });

    return { ok: errores.length === 0, errores: errores };
  }

  function exportar(topologia) {
    return JSON.stringify(topologia, null, 2);
  }

  function importar(texto) {
    var parsed = null;
    try {
      parsed = JSON.parse(texto);
    } catch (err) {
      return {
        ok: false,
        topologia: null,
        errores: [{ campo: "json", mensaje: "El archivo no es un JSON válido: " + (err && err.message ? err.message : "sintaxis rota") + "." }]
      };
    }
    var validacion = validarTopologia(parsed);
    if (!validacion.ok) {
      return { ok: false, topologia: null, errores: validacion.errores };
    }
    return { ok: true, topologia: parsed, errores: [] };
  }

  /* ---------------- Modo docente: fallas ---------------- */

  function fallaMascara(copia, falla) {
    var dev = buscarDispositivo(copia, falla.dispositivo);
    if (!dev) {
      return;
    }
    var iface = buscarInterfaz(dev, falla.interfaz);
    if (!iface) {
      return;
    }
    iface.prefijo = falla.prefijo;
  }

  function fallaInterfaz(copia, falla) {
    var dev = buscarDispositivo(copia, falla.dispositivo);
    if (!dev) {
      return;
    }
    var iface = buscarInterfaz(dev, falla.interfaz);
    if (!iface) {
      return;
    }
    iface.habilitada = false;
  }

  function fallaRuta(copia, falla) {
    var dev = buscarDispositivo(copia, falla.dispositivo);
    if (!dev || !Array.isArray(dev.rutas)) {
      return;
    }
    dev.rutas = dev.rutas.filter(function (r) {
      if (!r) {
        return false;
      }
      // Coincidencia exacta, o misma red normalizada con igual prefijo.
      if (r.destino === falla.destino && r.prefijo === falla.prefijo) {
        return false;
      }
      try {
        var redR = Red.direccionDeRed(r.destino, r.prefijo);
        var redF = Red.direccionDeRed(falla.destino, falla.prefijo);
        if (redR !== null && redR === redF && r.prefijo === falla.prefijo) {
          return false;
        }
      } catch (err) {
        // Si Red falla con datos rotos, se conserva la ruta.
      }
      return true;
    });
  }

  function fallaIpDuplicada(copia, falla) {
    var fuente = buscarDispositivo(copia, falla.copiarDe);
    var destino = buscarDispositivo(copia, falla.dispositivo);
    if (!fuente || !destino) {
      return;
    }
    var ipFuente = primeraIpDe(fuente);
    if (!ipFuente) {
      return;
    }
    // Destino: la primera interfaz habilitada con IP, si no la primera con
    // IP, si no la eth0/wlan0 habilitada que corresponda.
    var elegida = null;
    var i;
    for (i = 0; i < destino.interfaces.length; i++) {
      var a = destino.interfaces[i];
      if (a.habilitada && textoNoVacio(a.ip)) {
        elegida = a;
        break;
      }
    }
    if (!elegida) {
      for (i = 0; i < destino.interfaces.length; i++) {
        if (textoNoVacio(destino.interfaces[i].ip)) {
          elegida = destino.interfaces[i];
          break;
        }
      }
    }
    if (!elegida) {
      for (i = 0; i < destino.interfaces.length; i++) {
        if (destino.interfaces[i].habilitada) {
          elegida = destino.interfaces[i];
          break;
        }
      }
    }
    if (!elegida) {
      return;
    }
    elegida.ip = ipFuente.ip;
    elegida.prefijo = ipFuente.prefijo;
  }

  function fallaGateway(copia, falla) {
    var dev = buscarDispositivo(copia, falla.dispositivo);
    if (!dev) {
      return;
    }
    dev.gateway = falla.gateway;
  }

  function fallaEnlace(copia, falla) {
    var e = buscarEnlace(copia, falla.enlace);
    if (!e) {
      return;
    }
    e.estado = "down";
  }

  function aplicarFallas(topologia) {
    var copia = clonar(topologia);
    var fallas = (copia.escenario && copia.escenario.fallas) || [];
    for (var i = 0; i < fallas.length; i++) {
      var f = fallas[i];
      if (!f || !f.tipo) {
        continue;
      }
      if (f.tipo === "mascara-incorrecta") {
        fallaMascara(copia, f);
      } else if (f.tipo === "interfaz-deshabilitada") {
        fallaInterfaz(copia, f);
      } else if (f.tipo === "ruta-faltante") {
        fallaRuta(copia, f);
      } else if (f.tipo === "ip-duplicada") {
        fallaIpDuplicada(copia, f);
      } else if (f.tipo === "gateway-incorrecto") {
        fallaGateway(copia, f);
      } else if (f.tipo === "enlace-caido") {
        fallaEnlace(copia, f);
      }
    }
    return copia;
  }

  // Archivo del alumno: fallas ya aplicadas sobre las configuraciones y sin
  // la clave `fallas`. Conserva sólo los objetivos.
  function exportarParaAlumno(topologia) {
    var copia = aplicarFallas(topologia);
    if (copia.escenario && typeof copia.escenario === "object") {
      copia.escenario = { objetivos: copia.escenario.objetivos || [] };
    }
    return JSON.stringify(copia, null, 2);
  }

  /* ---------------- Objetivos ---------------- */

  function verificarObjetivos(estado, objetivos) {
    if (!Array.isArray(objetivos)) {
      return [];
    }
    var resultados = [];
    for (var i = 0; i < objetivos.length; i++) {
      var obj = objetivos[i];
      if (!obj || obj.tipo !== "ping") {
        resultados.push({ objetivo: obj, cumple: false, codigo: null });
        continue;
      }
      var res = Motor.ping(estado, obj.origen, obj.destino);
      var cumple;
      if (obj.esperado === "falla") {
        cumple = !res.exito;
      } else {
        cumple = !!res.exito;
      }
      var codigo = res.exito ? null : (res.diagnostico ? res.diagnostico.codigo : null);
      resultados.push({ objetivo: obj, cumple: cumple, codigo: codigo });
    }
    return resultados;
  }

  /* ---------------- Modo desafío: verificación VLSM ---------------- */

  // Acepta "10.45.7.0/24" o un objeto con red y prefijo en varias formas.
  function parsearBloque(valor) {
    if (typeof valor === "string" && valor.indexOf("/") >= 0) {
      var partes = valor.split("/");
      var red = partes[0].trim();
      var pref = parseInt(partes[1], 10);
      if (Red.esIpValida(red) && esEnteroPrefijo(pref)) {
        return { red: Red.direccionDeRed(red, pref), prefijo: pref };
      }
      return null;
    }
    if (valor && typeof valor === "object") {
      var r = valor.red || valor.subred || valor.direccion || valor.network || valor.bloque || valor.base;
      var p = valor.prefijo;
      if (typeof r === "string" && r.indexOf("/") >= 0) {
        return parsearBloque(r);
      }
      if (typeof r === "string" && esEnteroPrefijo(p) && Red.esIpValida(r)) {
        return { red: Red.direccionDeRed(r, p), prefijo: p };
      }
    }
    return null;
  }

  function normalizarSectores(escenario) {
    if (Array.isArray(escenario)) {
      return escenario;
    }
    if (escenario && Array.isArray(escenario.requerimientos)) {
      return escenario.requerimientos;
    }
    if (escenario && Array.isArray(escenario.sectores)) {
      return escenario.sectores;
    }
    if (escenario && Array.isArray(escenario.sectors)) {
      return escenario.sectors;
    }
    return [];
  }

  function nombreSector(sector, indice) {
    return sector.nombre || sector.sector || ("Sector " + (indice + 1));
  }

  function hostsPedidos(sector) {
    var v = sector.hosts;
    if (v === undefined) {
      v = sector.hostsNecesarios;
    }
    if (v === undefined) {
      v = sector.hostsPedidos;
    }
    if (v === undefined) {
      v = sector.minHosts;
    }
    if (v === undefined) {
      v = sector.cantidadHosts;
    }
    if (v === undefined) {
      v = sector.equiposNecesarios;
    }
    return typeof v === "number" ? v : 0;
  }

  function equiposSector(sector) {
    var v = sector.dispositivos || sector.equipos || sector.ids || sector.equiposIds || sector.hostsLista;
    return Array.isArray(v) ? v : [];
  }

  /* Resuelve una entrada del sector: "pc-admin" (la primera interfaz
   * habilitada con IP) o "r1:g0/0" (esa interfaz). Devuelve la IP y el
   * prefijo que el alumno configuró, o null en ip si no hay dirección. */
  function resolverEntrada(topologia, entrada) {
    var texto = String(entrada);
    var corte = texto.indexOf(":");
    var idDisp = corte >= 0 ? texto.slice(0, corte) : texto;
    var idIf = corte >= 0 ? texto.slice(corte + 1) : null;
    var disp = buscarDispositivo(topologia, idDisp);
    if (!disp) {
      return { etiqueta: texto, error: "El equipo \"" + idDisp + "\" no existe en la topología." };
    }
    var iface = null;
    if (idIf !== null) {
      iface = buscarInterfaz(disp, idIf);
      if (!iface) {
        return { etiqueta: texto, error: "La interfaz \"" + texto + "\" no existe en la topología." };
      }
    } else {
      var prim = primeraIpDe(disp);
      iface = prim ? prim.interfaz : null;
    }
    var conIp = !!iface && iface.habilitada !== false && textoNoVacio(iface.ip) &&
      Red.esIpValida(iface.ip.trim()) && esEnteroPrefijo(iface.prefijo);
    return {
      etiqueta: texto,
      dispositivo: disp,
      esInterfazDeclarada: idIf !== null,
      ip: conIp ? iface.ip.trim() : null,
      prefijo: conIp ? iface.prefijo : null
    };
  }

  /* El modo desafío verifica lo que el alumno configuró en los equipos, no
   * lo que declara el escenario: la subred de cada sector se deriva de las
   * IP y máscaras de sus interfaces. El informe dice qué está mal y por qué,
   * nunca cuál sería la dirección correcta. */
  function verificarDesafio(topologia, escenario) {
    var baseCruda = escenario ? (escenario.bloqueBase || escenario.bloque || escenario.base || escenario.redBase || escenario.cidr) : null;
    var base = parsearBloque(baseCruda);
    // Compatibilidad: el escenario puede traer red y prefijo sueltos arriba.
    if (!base && escenario && typeof escenario === "object") {
      base = parsearBloque({ red: escenario.red || escenario.subred, prefijo: escenario.prefijo });
    }
    var lista = normalizarSectores(escenario);
    var infos = [];
    var i;

    function hallazgo(info, nivel, mensaje) {
      info.hallazgos.push({ nivel: nivel, mensaje: mensaje });
    }

    for (i = 0; i < lista.length; i++) {
      var s = lista[i] || {};
      var info = {
        nombre: nombreSector(s, i),
        hosts: hostsPedidos(s),
        miembros: [],
        red: null,
        prefijo: null,
        hallazgos: []
      };
      var entradas = equiposSector(s);
      for (var e = 0; e < entradas.length; e++) {
        var m = resolverEntrada(topologia, entradas[e]);
        if (m.error) {
          hallazgo(info, "error", m.error);
          continue;
        }
        info.miembros.push(m);
      }
      var direccionados = info.miembros.filter(function (x) { return x.ip !== null; });
      if (direccionados.length === 0) {
        hallazgo(info, "error", "El sector no está direccionado.");
      } else {
        info.red = Red.direccionDeRed(direccionados[0].ip, direccionados[0].prefijo);
        info.prefijo = direccionados[0].prefijo;
        // 1. Todos los equipos del sector en la misma subred.
        for (var k = 1; k < direccionados.length; k++) {
          var otro = direccionados[k];
          var redOtro = Red.direccionDeRed(otro.ip, otro.prefijo);
          if (redOtro !== info.red || otro.prefijo !== info.prefijo) {
            hallazgo(info, "error", "Los equipos del sector no están todos en la misma subred: " +
              direccionados[0].etiqueta + " está en " + info.red + "/" + info.prefijo + " y " +
              otro.etiqueta + " en " + redOtro + "/" + otro.prefijo + ".");
            break;
          }
        }
      }
      info.direccionados = direccionados;
      infos.push(info);
    }

    var inicioBase = null;
    var finBase = null;
    if (base) {
      inicioBase = Red.aNumero(base.red);
      var bcastBase = Red.broadcast(base.red, base.prefijo);
      finBase = bcastBase === null ? null : Red.aNumero(bcastBase);
    }

    for (i = 0; i < infos.length; i++) {
      var cur = infos[i];
      if (cur.red === null) {
        continue;
      }
      var etiquetaRed = cur.red + "/" + cur.prefijo;

      // 2. La subred cae dentro del bloque base.
      if (!base || inicioBase === null || finBase === null) {
        hallazgo(cur, "error", "No hay bloque base declarado para verificar el sector.");
      } else {
        var ini = Red.aNumero(cur.red);
        var fin = Red.aNumero(Red.broadcast(cur.red, cur.prefijo));
        if (ini < inicioBase || fin > finBase) {
          hallazgo(cur, "error", "La subred " + etiquetaRed + " no entra en el bloque base " + base.red + "/" + base.prefijo + ".");
        }
      }

      // 3. Alineación. IP AND máscara siempre da una red alineada; lo que
      // revela el error es dónde el alumno hizo arrancar la subred. Por la
      // convención de la cátedra, el gateway (la interfaz del router del
      // sector) es la primera dirección asignable: la subred que el alumno
      // pensó arranca una dirección antes.
      var referencia = null;
      for (var r = 0; r < cur.direccionados.length; r++) {
        var cand = cur.direccionados[r];
        if (cand.esInterfazDeclarada && cand.dispositivo.tipo === "router") {
          referencia = cand;
          break;
        }
      }
      if (referencia && cur.prefijo < 31) {
        var bloque = Red.tamanoBloque(cur.prefijo);
        var inicioPensado = Red.aNumero(referencia.ip) - 1;
        if (inicioPensado % bloque !== 0) {
          hallazgo(cur, "error", "La subred no arranca en un múltiplo de " + bloque + ": si " +
            referencia.ip + " (" + referencia.etiqueta + ") es la primera dirección asignable, la subred " +
            "arrancaría en " + Red.aTexto(inicioPensado) + ", y con /" + cur.prefijo + " eso no está alineado.");
        }
      }

      // 4. El prefijo alcanza para los hosts pedidos.
      var disponibles = Red.cantidadHosts(cur.prefijo);
      if (cur.prefijo === 31) {
        disponibles = 2;
      }
      if (cur.hosts > 0 && disponibles < cur.hosts) {
        hallazgo(cur, "error", "El prefijo /" + cur.prefijo + " sólo permite " + disponibles +
          " hosts y el sector pide " + cur.hosts + ".");
      }

      // 5. Ninguna IP configurada es la de red ni la de broadcast.
      for (var d = 0; d < cur.direccionados.length; d++) {
        var md = cur.direccionados[d];
        if (md.prefijo < 31 && !Red.esAsignable(md.ip, md.prefijo)) {
          var rol = Red.esDireccionDeRed(md.ip, md.prefijo) ? "la dirección de red" : "la dirección de broadcast";
          hallazgo(cur, "error", "La IP " + md.ip + " de " + md.etiqueta + " es " + rol +
            " de su subred: no se puede asignar a un equipo.");
        }
      }
    }

    // 6. Ninguna subred se solapa con la de otro sector.
    for (i = 0; i < infos.length; i++) {
      for (var j = i + 1; j < infos.length; j++) {
        var a = infos[i];
        var b = infos[j];
        if (a.red === null || b.red === null) {
          continue;
        }
        if (Red.solapan(a.red, a.prefijo, b.red, b.prefijo)) {
          hallazgo(a, "error", "Se solapa con la subred de " + b.nombre + " (" + b.red + "/" + b.prefijo + ").");
          hallazgo(b, "error", "Se solapa con la subred de " + a.nombre + " (" + a.red + "/" + a.prefijo + ").");
        }
      }
    }

    for (i = 0; i < infos.length; i++) {
      var sec = infos[i];
      if (sec.red === null) {
        continue;
      }
      // 7. El gateway de cada equipo pertenece a su subred y, si el sector
      // declaró la interfaz de un router, coincide con su IP.
      var ipsRouter = sec.direccionados.filter(function (x) {
        return x.esInterfazDeclarada && x.dispositivo.tipo === "router";
      }).map(function (x) { return x.ip; });
      for (var q = 0; q < sec.direccionados.length; q++) {
        var eq = sec.direccionados[q];
        var tipo = eq.dispositivo.tipo;
        if (tipo === "router" || tipo === "switch-l2" || tipo === "ap") {
          continue;
        }
        var gw = eq.dispositivo.gateway;
        if (!textoNoVacio(gw)) {
          if (ipsRouter.length > 0) {
            hallazgo(sec, "error", eq.etiqueta + " no tiene puerta de enlace configurada.");
          }
          continue;
        }
        gw = gw.trim();
        if (!Red.esIpValida(gw) || !Red.mismaRed(eq.ip, gw, eq.prefijo)) {
          hallazgo(sec, "error", "El gateway " + gw + " de " + eq.etiqueta + " no pertenece a su subred.");
        } else if (ipsRouter.length > 0 && ipsRouter.indexOf(gw) < 0) {
          hallazgo(sec, "error", "El gateway " + gw + " de " + eq.etiqueta +
            " no coincide con la interfaz del router del sector.");
        }
      }

      // 8. Advertencia, no error, si el bloque desperdicia más del 60 %.
      var ofrecidos = sec.prefijo >= 31 ? 2 : Red.cantidadHosts(sec.prefijo);
      if (sec.hosts > 0 && ofrecidos >= sec.hosts && ofrecidos > 0) {
        var desperdicio = (ofrecidos - sec.hosts) / ofrecidos;
        if (desperdicio > 0.6) {
          hallazgo(sec, "advertencia", "El bloque está sobredimensionado: se piden " + sec.hosts +
            " hosts pero /" + sec.prefijo + " ofrece " + ofrecidos + " (desperdicio " +
            Math.round(desperdicio * 100) + " %).");
        }
      }
    }

    var errores = 0;
    var advertencias = 0;
    var porSector = infos.map(function (inf) {
      var cantErrores = inf.hallazgos.filter(function (h) { return h.nivel === "error"; }).length;
      var cantAvisos = inf.hallazgos.filter(function (h) { return h.nivel !== "error"; }).length;
      errores += cantErrores;
      advertencias += cantAvisos;
      return { sector: inf.nombre, ok: cantErrores === 0, hallazgos: inf.hallazgos };
    });

    return { resumen: { errores: errores, advertencias: advertencias }, porSector: porSector };
  }

  /* ---------------- Constructores de ejemplos ----------------
   * Se arman con ayudantes para garantizar el juego exacto de interfaces
   * de la tabla del §4 del BASE. Las coordenadas dejan cerca sólo el par
   * inalámbrico (alcance 250); el resto es disposición de aula. */

  function interfaz(id, medio, ip, prefijo, habilitada) {
    return {
      id: id,
      nombre: id,
      medio: medio,
      habilitada: habilitada,
      modo: "estatico",
      ip: ip,
      prefijo: prefijo
    };
  }

  function armarPc(id, nombre, x, y, ipEth, prefEth, gateway) {
    return {
      id: id,
      tipo: "pc",
      nombre: nombre,
      x: x,
      y: y,
      encendido: true,
      interfaces: [
        interfaz("eth0", "ethernet", ipEth, prefEth, ipEth !== null),
        interfaz("wlan0", "wireless", null, 24, false)
      ],
      gateway: gateway,
      dns: "8.8.8.8",
      rutas: [],
      dhcp: null
    };
  }

  function armarPcWifi(id, nombre, x, y, ipWifi, prefWifi, gateway) {
    return {
      id: id,
      tipo: "pc",
      nombre: nombre,
      x: x,
      y: y,
      encendido: true,
      interfaces: [
        interfaz("eth0", "ethernet", null, 24, false),
        interfaz("wlan0", "wireless", ipWifi, prefWifi, true)
      ],
      gateway: gateway,
      dns: "8.8.8.8",
      rutas: [],
      dhcp: null
    };
  }

  function armarCamara(id, nombre, x, y, ip, prefijo, gateway) {
    return {
      id: id,
      tipo: "camara",
      nombre: nombre,
      x: x,
      y: y,
      encendido: true,
      interfaces: [
        interfaz("eth0", "ethernet", ip, prefijo, true),
        interfaz("wlan0", "wireless", null, 24, false)
      ],
      gateway: gateway,
      dns: "8.8.8.8",
      rutas: [],
      dhcp: null
    };
  }

  function armarIot(id, nombre, x, y, ip, prefijo, gateway) {
    return {
      id: id,
      tipo: "iot",
      nombre: nombre,
      x: x,
      y: y,
      encendido: true,
      interfaces: [
        interfaz("wlan0", "wireless", ip, prefijo, true)
      ],
      gateway: gateway,
      dns: "8.8.8.8",
      rutas: [],
      dhcp: null
    };
  }

  function armarSwitch(id, nombre, x, y) {
    var lista = [];
    for (var i = 1; i <= 8; i++) {
      lista.push(interfaz("fa0/" + i, "ethernet", null, 24, true));
    }
    lista.push(interfaz("fib0", "fibra", null, 24, true));
    return {
      id: id,
      tipo: "switch-l2",
      nombre: nombre,
      x: x,
      y: y,
      encendido: true,
      interfaces: lista,
      gateway: null,
      dns: null,
      rutas: [],
      dhcp: null
    };
  }

  function armarRouter(id, nombre, x, y, g00, p00, g01, p01, fib, pFib, gateway, rutas) {
    return {
      id: id,
      tipo: "router",
      nombre: nombre,
      x: x,
      y: y,
      encendido: true,
      interfaces: [
        interfaz("g0/0", "ethernet", g00, p00, g00 !== null),
        interfaz("g0/1", "ethernet", g01, p01, g01 !== null),
