  /* ---------------- Animaciones sobre el lienzo ---------------- */

  function msVelocidad() {
    if (S.velocidad === "lenta") { return 900; }
    if (S.velocidad === "rapida") { return 250; }
    return 500;
  }

  function puntoEn(d) {
    return { x: d ? d.x : 0, y: d ? d.y : 0 };
  }

  function limpiarAnim() {
    while (S.capaAnim.firstChild) { S.capaAnim.removeChild(S.capaAnim.firstChild); }
  }

  function animarPing(resultado) {
    var miToken = ++S.animToken;
    limpiarAnim();
    if (!resultado || !resultado.saltos || !resultado.saltos.length) { return; }
    var svgNS = "http://www.w3.org/2000/svg";
    var puntos = resultado.saltos.map(function (s) {
      var d = buscarDisp(s.dispositivo);
      return puntoEn(d);
    });
    if (puntos.length < 2 && !resultado.exito) {
      var solo = document.createElementNS(svgNS, "circle");
      solo.setAttribute("cx", puntos[0].x); solo.setAttribute("cy", puntos[0].y - 30);
      solo.setAttribute("r", 8); solo.setAttribute("fill", "#b42318");
      S.capaAnim.appendChild(solo);
      return;
    }
    var marca = document.createElementNS(svgNS, "circle");
    marca.setAttribute("r", 7); marca.setAttribute("fill", resultado.exito ? "#1a7f37" : "#b42318");
    marca.setAttribute("stroke", "#fff"); marca.setAttribute("stroke-width", 2);
    S.capaAnim.appendChild(marca);
    if (movimientoReducido()) {
      var fin = puntos[puntos.length - 1];
      marca.setAttribute("cx", fin.x); marca.setAttribute("cy", fin.y - 30);
      if (!resultado.exito) {
        var cruzFija = document.createElementNS(svgNS, "text");
        cruzFija.setAttribute("x", fin.x + 10); cruzFija.setAttribute("y", fin.y - 24);
        cruzFija.setAttribute("font-size", "18"); cruzFija.setAttribute("fill", "#b42318");
        cruzFija.textContent = "✗";
        S.capaAnim.appendChild(cruzFija);
      }
      return;
    }
    var tramo = 0;
    var t0 = null;
    var dur = msVelocidad();
    function cuadro(t) {
      if (miToken !== S.animToken) { return; }
      if (t0 === null) { t0 = t; }
      var avance = (t - t0) / dur;
      if (avance >= 1) {
        tramo += 1; t0 = t;
        if (tramo >= puntos.length - 1) {
          marca.setAttribute("cx", puntos[puntos.length - 1].x);
          marca.setAttribute("cy", puntos[puntos.length - 1].y - 30);
          if (!resultado.exito) {
            var cruz = document.createElementNS(svgNS, "text");
            cruz.setAttribute("x", puntos[puntos.length - 1].x + 10);
            cruz.setAttribute("y", puntos[puntos.length - 1].y - 24);
            cruz.setAttribute("font-size", "18"); cruz.setAttribute("fill", "#b42318");
            cruz.textContent = "✗";
            S.capaAnim.appendChild(cruz);
          }
          return;
        }
        avance = 0;
      }
      var a = puntos[tramo], b = puntos[tramo + 1];
      marca.setAttribute("cx", a.x + (b.x - a.x) * avance);
      marca.setAttribute("cy", (a.y + (b.y - a.y) * avance) - 30);
      requestAnimationFrame(cuadro);
    }
    requestAnimationFrame(cuadro);
    registrar("animacion", "Animación del ping sobre " + resultado.saltos.length + " saltos (" + S.velocidad + ", cancelable con Esc o nuevo ping).");
  }

  // Extremos de un enlace en el lienzo, en el sentido desde→hacia: la misma
  // geometría con la que renderLienzo dibuja el cable.
  function tramoEnlace(e, idDesde) {
    var a = buscarDisp(e.a.dispositivo), b = buscarDisp(e.b.dispositivo);
    if (!a || !b) { return null; }
    var pa = puntoPuerto(a, e.a.interfaz), pb = puntoPuerto(b, e.b.interfaz);
    return e.a.dispositivo === idDesde ? { de: pa, a: pb } : { de: pb, a: pa };
  }

  // Ondas de una trama que inunda: los enlaces se ordenan por distancia (en
  // saltos) al equipo que la emite, y cada onda avanza un enlace más.
  function ondasDifusion(idOrigen, idsEnlaces) {
    var pendientes = idsEnlaces.map(buscarEnlace).filter(Boolean);
    var alcanzados = {}; alcanzados[idOrigen] = true;
    var ondas = [];
    while (pendientes.length) {
      var onda = [], resto = [];
      pendientes.forEach(function (e) {
        if (alcanzados[e.a.dispositivo]) { onda.push({ e: e, desde: e.a.dispositivo }); }
        else if (alcanzados[e.b.dispositivo]) { onda.push({ e: e, desde: e.b.dispositivo }); }
        else { resto.push(e); }
      });
      if (!onda.length) { break; }
      onda.forEach(function (x) { alcanzados[x.e.a.dispositivo] = true; alcanzados[x.e.b.dispositivo] = true; });
      ondas.push(onda.map(function (x) { return tramoEnlace(x.e, x.desde); }).filter(Boolean));
      pendientes = resto;
    }
    return ondas;
  }

  function etiquetaDhcp(m) {
    var t = String(m.tipo).toUpperCase();
    if (m.ip && m.tipo !== "request") { t += " " + m.ip; }
    return t + (m.difusion ? " (difusión)" : "");
  }

  function animarDhcp(resultado) {
    var miToken = ++S.animToken;
    limpiarAnim();
    var svgNS = "http://www.w3.org/2000/svg";
    var msgs = (resultado && resultado.mensajes) || [];
    if (!msgs.length) { return; }
    function linea(p, q, color, ancho, punteada) {
      var l = document.createElementNS(svgNS, "line");
      l.setAttribute("x1", p.x); l.setAttribute("y1", p.y);
      l.setAttribute("x2", q.x); l.setAttribute("y2", q.y);
      l.setAttribute("stroke", color); l.setAttribute("stroke-width", ancho);
      l.setAttribute("stroke-linecap", "round");
      if (punteada) { l.setAttribute("stroke-dasharray", "6 5"); l.setAttribute("opacity", "0.7"); }
      S.capaAnim.appendChild(l);
    }
    // Dibujo fijo de un mensaje: la inundación punteada, el camino útil en
    // trazo firme y el nombre del mensaje sobre quien lo emite.
    function dibujarFijo(m, color) {
      var ondas = ondasDifusion(m.origen, (m.inundados && m.inundados.length) ? m.inundados : (m.enlaces || []));
      ondas.forEach(function (onda) { onda.forEach(function (t) { linea(t.de, t.a, color, 2, true); }); });
      var actual = m.origen;
      (m.enlaces || []).forEach(function (id) {
        var e = buscarEnlace(id);
        var t = e && tramoEnlace(e, actual);
        if (!t) { return; }
        linea(t.de, t.a, color, 4, false);
        actual = e.a.dispositivo === actual ? e.b.dispositivo : e.a.dispositivo;
      });
      var o = buscarDisp(m.origen);
      if (o) {
        var tx = document.createElementNS(svgNS, "text");
        tx.setAttribute("x", o.x + 14); tx.setAttribute("y", o.y - 38);
        tx.setAttribute("font-size", "14"); tx.setAttribute("font-weight", "700");
        tx.setAttribute("fill", color); tx.setAttribute("stroke", "#fff");
        tx.setAttribute("stroke-width", "3"); tx.setAttribute("paint-order", "stroke");
        tx.textContent = etiquetaDhcp(m);
        S.capaAnim.appendChild(tx);
      }
      return ondas;
    }
    function colorDe(m) {
      if (m.tipo === "offer" && resultado.exito && resultado.servidor !== m.origen) { return "#6b7280"; }
      // Cliente en azul, servidor en violeta: el verde ya es el de los cables en up.
      return (m.tipo === "discover" || m.tipo === "request") ? "#0b5fa5" : "#7c3aed";
    }
    if (movimientoReducido()) {
      // Sin animación: queda dibujado el último mensaje con su recorrido.
      dibujarFijo(msgs[msgs.length - 1], colorDe(msgs[msgs.length - 1]));
      return;
    }
    var i = 0;
    function siguiente() {
      if (miToken !== S.animToken) { return; }
      if (i >= msgs.length) { return; }
      limpiarAnim();
      var m = msgs[i];
      var color = colorDe(m);
      var ondas = dibujarFijo(m, color);
      registrar("dhcp", "DORA sobre el lienzo: " + etiquetaDhcp(m) + ", " + nombreDe(m.origen) + " → " +
        (m.destino === "broadcast" ? "toda la red" : nombreDe(m.destino)) + ".");
      var puntos = [];
      var dur = msVelocidad();
      var onda = 0, t0 = null;
      function cuadro(t) {
        if (miToken !== S.animToken) { return; }
        if (t0 === null) { t0 = t; }
        var avance = (t - t0) / dur;
        if (avance >= 1) { onda += 1; t0 = t; avance = 0; }
        puntos.forEach(function (p) { S.capaAnim.removeChild(p); });
        puntos = [];
        if (onda >= ondas.length) {
          i += 1;
          setTimeout(siguiente, dur);
          return;
        }
        ondas[onda].forEach(function (tr) {
          var c = document.createElementNS(svgNS, "circle");
          c.setAttribute("r", 7); c.setAttribute("fill", color);
          c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", 2);
          c.setAttribute("cx", tr.de.x + (tr.a.x - tr.de.x) * avance);
          c.setAttribute("cy", tr.de.y + (tr.a.y - tr.de.y) * avance);
          S.capaAnim.appendChild(c);
          puntos.push(c);
        });
        requestAnimationFrame(cuadro);
      }
      requestAnimationFrame(cuadro);
    }
    siguiente();
  }

  function solicitarDhcp(idDisp, idIf) {
    S.pestañaInf = "dhcp";
    return pedirDhcp(idDisp, idIf);
  }

  /* ---------------- Registro, persistencia, importar/exportar ---------------- */

  function registrar(codigo, texto) {
    var linea = "[" + momentoAbs() + " " + momentoRel() + "] " + codigo + " — " + texto;
    S.registro.push(linea);
    if (S.registro.length > 400) {
      S.registro.shift();
      S.registroDescartadas++;
    }
    if (typeof codigo === "string" && /^D\d/.test(codigo)) {
      consolaAgregar(codigo + " — " + texto, true);
    }
  }

  function textoRegistro() {
    var lineas = S.registro.slice();
    if (S.registroDescartadas > 0) {
      lineas.unshift("[AVISO] Registro truncado: se descartaron " + S.registroDescartadas +
        " entradas anteriores; sólo se conservan las últimas 400.");
    }
    return lineas.join("\n");
  }

  // Con el lienzo vacío se explica cómo empezar y, si quedó trabajo de la
  // sesión anterior, se ofrece recuperarlo: no se carga solo, porque en una
  // PC compartida del laboratorio el siguiente no tiene por qué verlo.
  function actualizarLienzoVacio() {
    if (!S.lienzoVacio) { return; }
    var hayEquipos = (S.topologia.dispositivos || []).length > 0;
    if (hayEquipos) { S.trabajoPrevio = null; }
    S.lienzoVacio.hidden = hayEquipos;
    if (hayEquipos) { return; }
    S.lienzoVacio.innerHTML = "<b>Lienzo vacío</b>Arrastrá un dispositivo desde la paleta, o abrí una red con " +
      "<i>Ejemplos…</i> o <i>Importar</i>.";
    if (S.trabajoPrevio) {
      var n = (S.trabajoPrevio.dispositivos || []).length;
      var caja = el("div", "recuperar", "Hay una red guardada de la sesión anterior" +
        (S.trabajoPrevio.nombre ? ", «" + escapar(S.trabajoPrevio.nombre) + "»" : "") +
        " (" + n + (n === 1 ? " equipo" : " equipos") + ").");
      var fila = el("div", "");
      var bRec = boton("Recuperar el trabajo anterior", "primario");
      bRec.addEventListener("click", function () {
        var previo = S.trabajoPrevio;
        S.trabajoPrevio = null;
        cargarTopologiaAjustada(previo);
        registrar("guardado", "Se recuperó el trabajo de la sesión anterior.");
        avisar("Se recuperó el trabajo de la sesión anterior.");
      });
      var bDes = boton("Descartar");
      bDes.addEventListener("click", function () {
        S.trabajoPrevio = null;
        try { localStorage.removeItem("simuladorRedes.topologia"); } catch (e) { /* sin almacenamiento: se sigue igual */ }
        actualizarLienzoVacio();
        anunciar("Se descartó el trabajo guardado.");
      });
      fila.appendChild(bRec); fila.appendChild(bDes);
      caja.appendChild(fila);
      S.lienzoVacio.appendChild(caja);
    }
  }

  function autoguardar() {
    function guardar() {
      // Un lienzo vacío no pisa lo guardado: sigue disponible para recuperarlo.
      if (!(S.topologia.dispositivos || []).length) { return; }
      try {
        localStorage.setItem("simuladorRedes.topologia", JSON.stringify(S.topologia));
      } catch (e) {
        if (!S.avisoGuardado) {
          S.avisoGuardado = true;
          registrar("guardado", "El navegador bloqueó el autoguardado; la aplicación sigue andando sin guardar.");
        }
      }
    }
    try {
      var previa = localStorage.getItem("simuladorRedes.topologia");
      if (previa && (!S.topologia || !(S.topologia.dispositivos || []).length)) {
        var imp = Escenarios.importar(previa);
        if (imp.ok && (imp.topologia.dispositivos || []).length) { S.trabajoPrevio = imp.topologia; }
      }
    } catch (e) { /* sin guardado previo: se sigue igual */ }
    setInterval(guardar, 30000);
    window.addEventListener("beforeunload", guardar);
  }

  function importarPorArchivo() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.addEventListener("change", function () {
      if (inp.files && inp.files[0]) { importarTextoDeArchivo(inp.files[0]); }
    });
    inp.click();
  }

  function importarTextoDeArchivo(archivo) {
    var lector = new FileReader();
    lector.onload = function () {
      var res;
      try { res = Escenarios.importar(String(lector.result)); }
      catch (e) { registrar("importar", "Archivo inválido: " + e.message); return; }
      if (!res.ok) {
        registrar("importar", "El archivo no pasó la validación: " + res.errores.map(function (x) { return x.mensaje; }).join(" | "));
        return;
      }
      empujarHistorial();
      cargarTopologiaAjustada(res.topologia);
      registrar("importar", "Topología importada: " + (res.topologia.nombre || "sin nombre") + ".");
    };
    lector.readAsText(archivo);
  }

  function descargarTexto(texto, nombreArchivo) {
    var blob = new Blob([texto], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function exportarActual() {
    try { descargarTexto(Escenarios.exportar(S.topologia), "topologia.json"); }
    catch (e) { registrar("exportar", "No se pudo exportar."); }
  }

  // Nombre de archivo a partir del nombre de la red: "Lab 1 — Un solo problema" → "lab-1-un-solo-problema".
  function nombreDeArchivo(texto) {
    var base = String(texto || "laboratorio").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return base || "laboratorio";
  }

  function exportarParaAlumnoActual() {
    var esc = S.topologia.escenario || {};
    var fallas = (esc.fallas || []).length;
    try {
      descargarTexto(Escenarios.exportarParaAlumno(S.topologia), nombreDeArchivo(S.topologia.nombre) + "-ALUMNO.json");
      var sectores = (esc.requerimientos || esc.sectores || []).length;
      var texto = "Se exportó la versión del alumno: " + fallas + (fallas === 1 ? " falla aplicada" : " fallas aplicadas") +
        " y " + (esc.objetivos || []).length + " objetivos, sin la lista de fallas" +
        (sectores ? "; desafío de " + sectores + " sectores, con la red sin direccionar." : ".");
      registrar("exportar", texto);
      avisar(texto);
    } catch (e) { registrar("exportar", "No se pudo exportar la versión del alumno: " + e.message); }
  }

  /* ---------------- API pública ---------------- */

  function actualizarBotonAlumno() {
    if (!S.botonAlumno) { return; }
    var escA = S.topologia.escenario;
    var hayLab = !!(escA && ((escA.fallas || []).length || (escA.objetivos || []).length ||
      (escA.requerimientos || escA.sectores || []).length));
    S.botonAlumno.hidden = S.modo !== "docente";
    S.botonAlumno.disabled = !hayLab;
    S.botonAlumno.title = hayLab ? "Baja la red con las fallas aplicadas y sin la lista de fallas (en un desafío, sin direccionar), para repartir"
      : "Esta red no tiene fallas, objetivos ni sectores: no es un laboratorio";
  }

  function renderTodo() {
    actualizarBotonAlumno();
    renderLienzo();
    renderPropiedades();
    renderInferior();
    refrescarCalculo();
    var botones = S.raiz.querySelectorAll("[data-modo]");
    for (var i = 0; i < botones.length; i++) {
      var esActivo = botones[i].getAttribute("data-modo") === S.modo;
      botones[i].classList.toggle("activo", esActivo);
      botones[i].setAttribute("aria-pressed", String(esActivo));
    }
  }

  // Lo que abre el usuario (un ejemplo, un archivo importado, el trabajo
  // recuperado) aparece entero en la vista. cargarTopologia sola no mueve la
  // vista: la usa el Autotest para devolver la red tal como estaba.
  function cargarTopologiaAjustada(topologia) {
    cargarTopologia(topologia);
    ajustarVista();
  }

  function cargarTopologia(topologia) {
    S.topologia = clonar(topologia);
    S.seleccionado = null; S.enlaceSel = null;
    S.deshacer = []; S.rehacer = [];
    reconstruirEstado();
    recontarNombres();
    renderTodo();
  }

  function topologiaActual() {
    return clonar(S.topologia);
  }

  function seleccionarEnlace(idEnlace) {
    S.moviendoExtremo = null;
    S.seleccionado = null;
    S.enlaceSel = idEnlace;
    renderLienzo();
    renderPropiedades();
  }

  function seleccionar(idDispositivo) {
    S.moviendoExtremo = null;
    if (idDispositivo && idDispositivo !== S.seleccionado && claveDe(buscarDisp(idDispositivo)) === "firewall") {
      S.pestañaProps = "filtrado";
    }
    S.seleccionado = idDispositivo;
    S.enlaceSel = null;
    renderLienzo();
    renderPropiedades();
    refrescarCalculo();
  }

  function setModo(modo) {
    S.modo = modo;
    // Desafío abre Simulación: ahí está "Verificar diseño VLSM".
    if (modo === "subredes") { S.pestañaInf = "calculo"; }
    else { S.pestañaInf = "simulacion"; }
    renderTodo();
    registrar("modo", "Modo " + modo + ". La topología cargada no cambió." +
      (modo === "docente" ? " No se muestran avisos de configuración." : ""));
  }

  return {
    iniciar: iniciar,
    cargarTopologia: cargarTopologia,
    topologiaActual: topologiaActual,
    seleccionar: seleccionar,
    animarPing: animarPing,
    animarDhcp: animarDhcp,
    // Suma tramas a la captura activa, como cualquier ping o conexión; lo usa el Autotest.
    capturarTramas: capturarTramas,
    setModo: setModo,
    registrar: registrar
  };
})();

</script>
<script>
/* capa5-autotest.js — Capa 5: ensamblado lógico, Autotest y arranque.
 *
 * Objeto global `Autotest` con `correr()` según el §2 de 05-capa5-ensamblado.
 * No reescribe ninguna capa anterior: sólo lee `Red`, `Motor`, `Escenarios`
 * y `UI`. JavaScript vanilla, sin DOM salvo para inspeccionar lo que la
 * capa 4 ya dibujó y para mostrar el informe.
 *
 * Convenciones:
 * - Español rioplatense en textos, comentarios y variables.
 * - Ninguna petición de red, ninguna referencia externa.
 * - Los criterios que mutan trabajan sobre copias profundas.
 * - Al terminar se restaura la topología y el modo del usuario.
 * - Las agujas de búsqueda (nombres de APIs de red y palabras de relleno)
 *   se arman por partes para que el propio código no las contenga en texto.
 */

var Autotest = (function () {
  "use strict";

  function clonar(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function ejemploPorId(id) {
    for (var i = 0; i < Escenarios.EJEMPLOS.length; i++) {
      if (Escenarios.EJEMPLOS[i].id === id) {
        return Escenarios.EJEMPLOS[i];
      }
    }
    return null;
  }

  function dispEn(topo, id) {
    var lista = topo.dispositivos || [];
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].id === id) {
        return lista[i];
      }
    }
    return null;
  }

  function ifaceEn(disp, idIf) {
    if (!disp || !disp.interfaces) {
      return null;
    }
    for (var i = 0; i < disp.interfaces.length; i++) {
      if (disp.interfaces[i].id === idIf) {
        return disp.interfaces[i];
      }
    }
    return null;
  }

  function enlaceEn(topo, id) {
    var lista = topo.enlaces || [];
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].id === id) {
        return lista[i];
      }
    }
    return null;
  }

  /* Cada caso de redes se cuenta en tres partes: qué se armó, qué tiene que
   * pasar y qué hizo el simulador. Varios casos son errores puestos a
   * propósito: ahí lo correcto es que el simulador los detecte, y el informe
   * lo aclara para que el verde no se lea como "la red está bien". */
  var CASOS = {
    2: {
      conError: false,
      situacion: "La red del Complejo turístico tal como viene: PC-Admin (10.45.7.66/27) hace ping al Servidor " +
        "(10.45.7.122/29), que está detrás de dos routers.",
      esperado: "El ping responde."
    },
    3: {
      conError: true,
      situacion: "PC-Admin en 10.45.7.94 con puerta de enlace 10.45.7.65. Con /27 su red va de 10.45.7.64 a .95 y la " +
        "puerta de enlace está adentro; si la máscara pasa a /28, la red es 10.45.7.80 – .95 y 10.45.7.65 queda afuera.",
      esperado: "Con /27 el ping al Servidor responde; con /28 falla con D09 (la puerta de enlace está fuera de tu red)."
    },
    4: {
      conError: true,
      situacion: "Se deshabilita la interfaz g0/0 de R1, la que tiene la dirección 10.45.7.65.",
      esperado: "R1 no puede usar esa dirección: D01 (interfaz deshabilitada)."
    },
    5: {
      conError: true,
      situacion: "Se borra de R2 la ruta hacia 10.45.7.64/27, la red de PC-Admin. La ida hacia el Servidor sigue teniendo camino.",
      esperado: "El ping llega al Servidor, pero R2 no sabe cómo devolver la respuesta: D12 (falla la vuelta), " +
        "no D11 (fallaría la ida)."
    },
    6: {
      conError: true,
      situacion: "PC-1 en 192.168.1.0/24 y PC-2 en 192.168.2.0/24, conectadas al mismo switch.",
      esperado: "No se comunican: D15. El switch no mira direcciones IP y no enruta; para pasar de una subred a otra " +
        "hace falta un router."
    },
    7: {
      conError: false,
      situacion: "Cálculo de la subred de 10.45.7.66/27, con puerta de enlace 10.45.7.65.",
      esperado: "Máscara 255.255.255.224, red 10.45.7.64, broadcast 10.45.7.95, hosts de 10.45.7.65 a 10.45.7.94 " +
        "(30 hosts), y la puerta de enlace dentro de la subred."
    },
    8: {
      conError: false,
      situacion: "R-DHCP reparte el rango 192.168.1.50 – .60; una PC conectada al switch pide dirección.",
      esperado: "La PC recibe una dirección del rango tras los cuatro mensajes: DISCOVER, OFFER, REQUEST y ACK."
    },
    17: {
      conError: false,
      situacion: "El mismo ping de PC-Admin al Servidor, mirado tramo por tramo: PC-Admin → R1 → R2 → Servidor, " +

  function fila(n, criterio, pasa, detalle) {
    var r = { n: n, criterio: criterio, pasa: !!pasa, detalle: detalle || "" };
    var caso = CASOS[n];
    if (caso) {
      r.conError = caso.conError;
      r.situacion = caso.situacion;
      r.esperado = caso.esperado;
    }
    return r;
  }

  // Recorrido de un ping con los nombres visibles, sin repeticiones seguidas.
  function recorridoPorNombre(topo, res) {
    var nombres = [];
    (res.saltos || []).forEach(function (s) {
      var d = dispEn(topo, s.dispositivo);
      var n = d ? (d.nombre || d.id) : s.dispositivo;
      if (nombres[nombres.length - 1] !== n) { nombres.push(n); }
    });
    return nombres.join(" → ");
  }

  function diagnosticoTexto(res) {
    var dg = res && res.diagnostico;
    return dg ? dg.codigo + " (" + dg.titulo + ")" : "sin diagnóstico";
  }

  function modoActualDom() {
    try {
      var activo = document.querySelector(".simbarra [data-modo].activo");
      if (activo) {
        return activo.getAttribute("data-modo");
      }
    } catch (e) {
      /* sin DOM: se sigue igual */
    }
    return "topologia";
  }

  /* Agujas armadas por partes: el fuente nunca trae los literales juntos. */
  function agujaRed() {
    var a = "fe" + "tch";
    var b = "XML" + "HttpRequest";
    var c = "im" + "port(";
    return { a: a, b: b, c: c };
  }

  function agujaRelleno() {
    var a = "TO" + "DO";
    var b = "lo" + "rem";
    var c = "FIX" + "ME";
    return [a, b, c];
  }

  function crit01() {
    var nombre = "El archivo no hace ninguna petición de red";
    try {
      var html = document.documentElement.outerHTML || "";
      var ag = agujaRed();
      var bajos = html.toLowerCase();
      var tieneFetch = html.indexOf(ag.a + "(") >= 0 || html.indexOf(ag.a + " (") >= 0;
      var tieneXhr = html.indexOf(ag.b) >= 0;
      var tieneImportDin = html.indexOf(ag.c) >= 0 || html.indexOf(ag.c.trim()) >= 0 && false;
      var imp = "im" + "port";
      var tieneImportFn = new RegExp("\\b" + imp + "\\s*\\(").test(html);
      var srcExt = /<(script|img|iframe)[^>]+\bsrc\s*=\s*["']\s*(https?:|\/\/)/i.test(html);
      var hrefExt = /<link[^>]+\bhref\s*=\s*["']\s*(https?:|\/\/)/i.test(html);
      var cssUrlExt = /url\s*\(\s*["']?\s*(https?:|\/\/)/i.test(html);
      var problemas = [];
      if (tieneFetch) {
        problemas.push("aparece llamada de red (" + ag.a + ")");
      }
      if (tieneXhr) {
        problemas.push("aparece " + ag.b);
      }
      if (tieneImportFn || tieneImportDin) {
        problemas.push("aparece carga dinámica de módulos");
      }
      if (srcExt) {
        problemas.push("hay etiqueta con src externo");
      }
      if (hrefExt) {
        problemas.push("hay etiqueta con href externo");
      }
      if (cssUrlExt) {
        problemas.push("hay url externa en estilos");
      }
      /* Los blobs locales (URL.createObjectURL) no son red: se admiten. */
      void bajos;
      if (problemas.length === 0) {
        return fila(1, nombre, true, "Sin llamadas de red ni referencias externas en el documento.");
      }
      return fila(1, nombre, false, "Se esperaba cero referencias externas y se encontró: " + problemas.join("; ") + ".");
    } catch (e) {
      return fila(1, nombre, false, "No se pudo inspeccionar el documento: " + e.message);
    }
  }

  // PC — switch — R-Borde — nube, para los casos de NAT.
  function redConInternet(nat) {
    function puerto(id, ip, prefijo) {
      return { id: id, nombre: id, medio: "ethernet", habilitada: true, modo: "estatico", ip: ip, prefijo: prefijo, mac: null };
    }
    function equipo(id, tipo, nombre, puertos, extra) {
      var d = { id: id, tipo: tipo, nombre: nombre, x: 0, y: 0, encendido: true, interfaces: puertos, gateway: null, dns: null, rutas: [], dhcp: null };
      for (var k in (extra || {})) { d[k] = extra[k]; }
      return d;
    }
    function cable(id, a, ia, b, ib) {
      return { id: id, tipo: "ethernet", estado: "up", a: { dispositivo: a, interfaz: ia }, b: { dispositivo: b, interfaz: ib } };
    }
    var salida = puerto("g0/1", "200.45.7.2", 30);
    if (nat) { salida.nat = true; }
    return {
      version: 1, nombre: "Salida a internet",
      dispositivos: [
        equipo("pc1", "pc", "PC-Casa", [puerto("eth0", "192.168.1.10", 24)], { gateway: "192.168.1.1" }),
        equipo("sw1", "switch-l2", "SW", [puerto("fa0/1", null, 24), puerto("fa0/2", null, 24)]),
        equipo("r1", "router", "R-Borde", [puerto("g0/0", "192.168.1.1", 24), salida],
          { rutas: [{ destino: "0.0.0.0", prefijo: 0, siguienteSalto: "200.45.7.1" }] }),
        equipo("nube", "internet", "Internet", [puerto("eth0", "200.45.7.1", 30)])
      ],
      enlaces: [cable("l1", "pc1", "eth0", "sw1", "fa0/1"), cable("l2", "r1", "g0/0", "sw1", "fa0/2"), cable("l3", "r1", "g0/1", "nube", "eth0")]
    };
  }

  function armarMiniDhcp() {
    function iface(id, medio, ip, prefijo, habilitada) {
      return { id: id, nombre: id, medio: medio, habilitada: !!habilitada, modo: "estatico", ip: ip, prefijo: prefijo };
    }
    function pcCon(id, x, y) {
      return {
        id: id, tipo: "pc", nombre: id, x: x, y: y, encendido: true,
        interfaces: [iface("eth0", "ethernet", null, 24, true), iface("wlan0", "wireless", null, 24, false)],
        gateway: null, dns: null, rutas: [], dhcp: null
      };
    }
    function swCon(id, x, y) {
      var lista = [];
      for (var i = 1; i <= 8; i++) {
        lista.push(iface("fa0/" + i, "ethernet", null, 24, true));
      }
      lista.push(iface("fib0", "fibra", null, 24, true));
      return { id: id, tipo: "switch-l2", nombre: id, x: x, y: y, encendido: true, interfaces: lista, gateway: null, dns: null, rutas: [], dhcp: null };
    }
    var router = {
      id: "r-dhcp", tipo: "router", nombre: "R-DHCP", x: 400, y: 200, encendido: true,
      interfaces: [
        iface("g0/0", "ethernet", "192.168.1.1", 24, true),
        iface("g0/1", "ethernet", null, 24, true),
        iface("fib0", "fibra", null, 24, true),
        iface("wlan0", "wireless", null, 24, false)
      ],
      gateway: null, dns: null, rutas: [],
      dhcp: { habilitado: true, desde: "192.168.1.50", hasta: "192.168.1.60", prefijo: 24, gateway: "192.168.1.1" }
    };
    return {
      version: 1,
      nombre: "mini dhcp",
      dispositivos: [router, pcCon("c1", 120, 200), swCon("sw1", 260, 200)],
      enlaces: [
        { id: "l1", a: { dispositivo: "r-dhcp", interfaz: "g0/0" }, b: { dispositivo: "sw1", interfaz: "fa0/1" }, tipo: "ethernet", estado: "up", velocidadMbps: 100, retardoMs: 1 },

      }
      var mundo = svg.querySelector("g");
      if (!mundo || mundo.children.length < 2) {
        return fila(15, nombre, false, "El SVG no tiene las capas de enlaces y nodos.");
      }
      var capaEn = mundo.children[0];
      var capaNo = mundo.children[1];
      var pos = {};
      (topo.dispositivos || []).forEach(function (d) {
        pos[d.id] = { x: d.x, y: d.y };
      });
      /* Puertos en coordenadas de mundo: translate del nodo + centro del rect. */
      var puertos = [];
      for (var ni = 0; ni < capaNo.children.length; ni++) {
        var nodo = capaNo.children[ni];
        var tr = nodo.getAttribute("transform") || "";
        var mt = tr.match(/translate\(\s*([0-9.\-]+)[,\s]+([0-9.\-]+)\s*\)/);
        var nx = mt ? parseFloat(mt[1]) : 0;
        var ny = mt ? parseFloat(mt[2]) : 0;
        var rects = nodo.querySelectorAll("rect.puerto");
        for (var ri = 0; ri < rects.length; ri++) {
          var px = parseFloat(rects[ri].getAttribute("x"));
          var py = parseFloat(rects[ri].getAttribute("y"));
          var pw = parseFloat(rects[ri].getAttribute("width") || "10");
          var ph = parseFloat(rects[ri].getAttribute("height") || "10");
          puertos.push({ x: nx + px + pw / 2, y: ny + py + ph / 2 });
        }
      }
      if (!puertos.length) {
        return fila(15, nombre, false, "No se encontraron rectángulos de puerto en el lienzo.");
      }
      function cercaDePuertos(x, y) {
        var mejor = Infinity;
        for (var i = 0; i < puertos.length; i++) {
          var dx = puertos[i].x - x;
          var dy = puertos[i].y - y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < mejor) {
            mejor = d;
          }
        }
        return mejor;
      }
      function cercaDeCentro(x, y) {
        var mejor = Infinity;
        Object.keys(pos).forEach(function (id) {
          var dx = pos[id].x - x;
          var dy = pos[id].y - y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < mejor) {
            mejor = d;
          }
        });
        return mejor;
      }
      var dibujos = capaEn.querySelectorAll("line,path");
      if (!dibujos.length) {
        return fila(15, nombre, false, "No se encontraron líneas de enlace en la capa de enlaces.");
      }
      var centros = 0;
      var lejos = 0;
      for (var di = 0; di < dibujos.length; di++) {

        var puntos = [];
        if (dib.tagName.toLowerCase() === "line") {
          puntos.push({ x: parseFloat(dib.getAttribute("x1")), y: parseFloat(dib.getAttribute("y1")) });
          puntos.push({ x: parseFloat(dib.getAttribute("x2")), y: parseFloat(dib.getAttribute("y2")) });
        } else {
          var dAt = dib.getAttribute("d") || "";
          var nums = dAt.match(/[0-9.\-]+/g) || [];
          if (nums.length >= 4) {
            puntos.push({ x: parseFloat(nums[0]), y: parseFloat(nums[1]) });
            puntos.push({ x: parseFloat(nums[nums.length - 2]), y: parseFloat(nums[nums.length - 1]) });
          }
        }
        for (var pi = 0; pi < puntos.length; pi++) {
          var aPuerto = cercaDePuertos(puntos[pi].x, puntos[pi].y);
          var aCentro = cercaDeCentro(puntos[pi].x, puntos[pi].y);
          if (aPuerto <= 14) {
            continue;
          }
          if (aCentro <= 6) {
            centros += 1;
          } else {
            lejos += 1;
          }
        }
      }
      void numeroDe;
      if (centros === 0 && lejos === 0) {
        return fila(15, nombre, true, "Los " + dibujos.length + " enlaces dibujados nacen y mueren a menos de 14 unidades de un puerto.");

  /* Foco y teclado (SRE-1026): el foco sobrevive a los redibujados de la
   * franja inferior, las pestañas responden a las flechas, la hoja del
   * celular deja el fondo inerte y ninguna regla le quita el anillo al cable. */
  function crit25() {
    var nombre = "El foco no se pierde al redibujar y las pestañas se recorren con flechas";
    var previo = modoActualDom();
    function botonCon(raiz, texto) {
      var bs = raiz.querySelectorAll("button");
      for (var i = 0; i < bs.length; i++) { if (bs[i].textContent.indexOf(texto) === 0) { return bs[i]; } }
      return null;
    }
    function tecla(n, key) {
      n.dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true }));
    }
    // Se mira la hoja de estilos y no el estilo computado: :focus-visible
    // depende de cómo el navegador decidió que llegó el foco.
    function reglaCss(selector) {
      var hoja = document.getElementById("sim-estilos");
      var reglas = hoja && hoja.sheet ? hoja.sheet.cssRules : [];
      for (var i = 0; i < reglas.length; i++) {
        if (reglas[i].selectorText === selector) { return reglas[i]; }
      }
      return null;
    }
    try {
      // En el diseño de celular la franja inferior está oculta: no hay foco que medir ahí.
      var franja = document.querySelector(".siminf");
      if (!franja || getComputedStyle(franja).display === "none") {
        return fila(25, nombre, true, "No aplica con el diseño de celular, donde la franja inferior está oculta. Correr el Autotest en una pantalla más grande.");
      }
      var prob = [];
      UI.setModo("topologia");
      UI.cargarTopologia(clonar(ejemploPorId("complejo").topologia));
      var id = dispositivoConIp();
      var origen = null;

      UI.seleccionar(id);
      var inf = document.querySelector(".siminf");

      // Pestañas: → desde Simulación lleva el foco y la selección a Captura.
      var tSim = document.getElementById("sim-tab-inf-simulacion");
      tSim.click();
      tSim = document.getElementById("sim-tab-inf-simulacion");
      tSim.focus();
      tecla(tSim, "ArrowRight");
      var act = document.activeElement;
      if (!act || act.id !== "sim-tab-inf-captura") { prob.push("→ no deja el foco en Captura"); }
      else if (!act.classList.contains("activo") || act.getAttribute("aria-selected") !== "true") { prob.push("→ no elige Captura"); }
      var panel = document.getElementById("sim-panel-inf");
      if (!panel || panel.getAttribute("role") !== "tabpanel") { prob.push("la franja no tiene tabpanel"); }
      tecla(document.activeElement, "Home");
      if (document.activeElement.id !== "sim-tab-inf-simulacion") { prob.push("Inicio no vuelve a Simulación"); }

      // Fin llega a la última pestaña del modo: en Docente, Laboratorio.
      UI.setModo("docente");
      var tPrim = document.querySelector(".siminf [role=tab]");
      tPrim.focus();
      tecla(tPrim, "End");
      if (document.activeElement.id !== "sim-tab-inf-laboratorio") { prob.push("Fin en modo Docente no llega a Laboratorio"); }
      UI.setModo("topologia");
      UI.seleccionar(id);

      // Captura en todos los cables y un ping al gateway del equipo.
      document.getElementById("sim-tab-inf-captura").click();
      var bIni = botonCon(inf, "Iniciar captura");
      if (bIni) { bIni.click(); } else { prob.push("no está «Iniciar captura»"); }
      document.getElementById("sim-tab-inf-simulacion").click();
      var destino = null;
      inf.querySelectorAll("label").forEach(function (l) { if (l.textContent === "Destino") { destino = document.getElementById(l.htmlFor); } });
      var bPing = inf.querySelector(".simctrl button.primario");
      if (!destino || !bPing || !origen) { prob.push("no se encontró el formulario del ping"); }
      else {
        destino.value = origen.gateway;
        bPing.click();
        // Alternar las tramas conserva el foco en el botón, aunque se redibuje.
        var bTr = inf.querySelector("[data-foco=tramas]");
        if (!bTr) { prob.push("no está el botón de tramas"); }
        else {
          bTr.focus();
          bTr.click();
          act = document.activeElement;
          if (!act || act.getAttribute("data-foco") !== "tramas" || act === bTr) { prob.push("alternar tramas pierde el foco"); }
        }
      }

      // Elegir un paquete con Space conserva el foco en la fila.
      document.getElementById("sim-tab-inf-captura").click();
      var filas = inf.querySelectorAll(".tablacap tbody tr");
      if (filas.length < 2) { prob.push("la captura tiene " + filas.length + " paquetes"); }
      else {
        var clave = filas[1].getAttribute("data-foco");
        filas[1].focus();
        tecla(filas[1], " ");
        act = document.activeElement;
        if (!act || act.getAttribute("data-foco") !== clave) { prob.push("elegir un paquete pierde el foco"); }
        else if (act.getAttribute("aria-selected") !== "true") { prob.push("la fila elegida no tiene aria-selected"); }
        // La fila elegida y otra con foco se distinguen: fondo distinto y
        // un anillo propio para el foco (también sobre la elegida).
        var filas2 = inf.querySelectorAll(".tablacap tbody tr");
        filas2[0].focus();
        if (filas2[0].classList.contains("sel") || !filas2[1].classList.contains("sel")) { prob.push("enfocar otra fila cambia la elegida"); }
        else if (getComputedStyle(filas2[0]).backgroundColor === getComputedStyle(filas2[1]).backgroundColor) {
          prob.push("la fila enfocada se ve igual que la elegida");
        }
        // Con var() en el atajo outline, las propiedades sueltas quedan vacías: se lee cssText.
        var rFoco = reglaCss(".tablacap tr:focus-visible"), rFocoSel = reglaCss(".tablacap tr.sel:focus-visible");
        if (!rFoco || rFoco.cssText.indexOf("solid") < 0 || !rFocoSel || rFocoSel.cssText.indexOf("outline-color") < 0) {
          prob.push("las filas de la captura no tienen anillo de foco propio");
        }
      }
      var bLim = botonCon(inf, "Limpiar");
      if (bLim) { bLim.click(); }
      var bDet = botonCon(inf, "Detener");
      if (bDet) { bDet.click(); }

      // Ninguna regla le quita el contorno al cable enfocado.
      var hoja = document.getElementById("sim-estilos");
      var reglas = hoja && hoja.sheet ? hoja.sheet.cssRules : [];
      for (var i = 0; i < reglas.length; i++) {
        var r = reglas[i];
        if (r.selectorText && /\.enlace:focus(?!-visible)/.test(r.selectorText) && r.style.outlineStyle === "none") {
          prob.push("una regla le quita el anillo de foco al cable");
        }
      }

      // El foco en un puerto muestra su tooltip, y al salir se oculta.
      var puerto = document.querySelector("svg .puerto");
      var tip = document.querySelector(".simraiz .tooltip");
      if (!puerto || !tip) { prob.push("no hay puertos o tooltip en el lienzo"); }
      else {
        // Si la ventana no tiene el foco (Autotest corrido desde la consola o
        // con la ventana atrás), el navegador mueve el foco sin avisar: los

        puerto.blur();
        if (sinVentana) { puerto.dispatchEvent(new FocusEvent("blur")); }
        if (tip.style.display !== "none") { prob.push("el tooltip del puerto no se oculta al salir"); }
      }

      var bConf = botonCon(document.querySelector(".simacciones"), "Configurar");
      var sec = document.querySelector(".simhoja");
      if (!bConf || !sec) { prob.push("no están la barra del celular o la hoja"); }
      else {
        // En escritorio el botón Configurar está oculto: el origen es una
        // pestaña visible, que es lo que la hoja tiene que devolver.
        var tOrigen = document.getElementById("sim-tab-inf-simulacion");
        tOrigen.focus();
        bConf.click();
        if (sec.getAttribute("aria-modal") !== "true") { prob.push("la hoja no es modal"); }
        if (!document.querySelector(".simcuerpo").inert) { prob.push("el fondo no queda inerte con la hoja abierta"); }
        if (document.activeElement && document.activeElement !== document.body) { document.activeElement.blur(); }
        sec.querySelector(".cabhoja button").click();
        if (document.querySelector(".simraiz [inert]")) { prob.push("queda fondo inerte al cerrar la hoja"); }
        if (document.activeElement !== tOrigen) { prob.push("al cerrar la hoja el foco no vuelve a lo que la abrió"); }
      }
      document.getElementById("sim-tab-inf-simulacion").click();

      if (prob.length === 0) {
        return fila(25, nombre, true, "Flechas, Inicio y Fin (también en Docente) en las pestañas; foco conservado al alternar tramas y al elegir un paquete; fila elegida y enfocada distinguibles; tooltip del puerto con foco; hoja modal que devuelve el foco; anillo del cable intacto.");
      }
      return fila(25, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(25, nombre, false, "Excepción: " + e.message);
    } finally {
      try { UI.setModo(previo); } catch (e2) { /* se sigue igual */ }
    }
  }

  /* Tema y layout (SRE-1027): el tema arranca con el del sistema y, al
   * alternarlo, cambia también lo de afuera de la raíz; el primer Tab lleva
   * al lienzo; hay un <main>; el nombre del botón de zoom contiene su texto. */
  function crit26() {
    var nombre = "El tema sigue al sistema y llega a la barra del navegador; se puede saltar al lienzo";
    var bTema = null;
    try {
      var prob = [];
      var raiz = document.querySelector(".simraiz");
      var html = document.documentElement;
      var meta = document.querySelector("meta[name=theme-color]");
      document.querySelectorAll(".simbarra button").forEach(function (b) {
        if (/^Tema (claro|oscuro)$/.test(b.textContent)) { bTema = b; }
      });
      var oscuroInicial = raiz.classList.contains("oscuro");
      function estado() {
        return [raiz.classList.contains("oscuro"), meta ? meta.getAttribute("content") : "", html.style.colorScheme, html.style.background].join("|");
      }
      // Contraste WCAG entre el texto y el fondo de un elemento (colores rgb opacos).
      function luminancia(rgb) {
        var c = rgb.match(/\d+(\.\d+)?/g).slice(0, 3).map(function (v) {
          v = Number(v) / 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      }
      function contraste(n) {
        var cs = getComputedStyle(n);
        var a = luminancia(cs.color), b = luminancia(cs.backgroundColor);
        return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
      }
      var primario = document.querySelector(".simraiz button.primario");
      function revisarContraste() {
        if (primario && contraste(primario) < 4.5) {
          prob.push("el texto del botón primario no llega a 4.5:1 en tema " + (raiz.classList.contains("oscuro") ? "oscuro" : "claro") +
            " (" + contraste(primario).toFixed(2) + ":1)");
        }
      }
      if (!primario) { prob.push("no hay un botón primario para medir el contraste"); }
      revisarContraste();
      // Sólo se compara con el sistema si nadie tocó el botón todavía.
      if (bTema && bTema.getAttribute("data-elegido") !== "1") {
        var sistemaOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (oscuroInicial !== sistemaOscuro) { prob.push("el tema inicial no sigue al sistema"); }
      }
      if (!bTema) { prob.push("no está el botón de tema"); }
      else {
        var antes = estado();
        bTema.click();
        var medio = estado();
        var oscuro = raiz.classList.contains("oscuro");
        if (oscuro === oscuroInicial) { prob.push("el botón no cambia el tema"); }
        if (!meta || meta.getAttribute("content") !== (oscuro ? "#0e1a2b" : "#13355e")) { prob.push("el theme-color no acompaña al tema"); }
        if (html.style.colorScheme !== (oscuro ? "dark" : "light")) { prob.push("el color-scheme de <html> no acompaña al tema"); }
        if (!html.style.background) { prob.push("<html> no tiene fondo"); }
        revisarContraste();
        bTema.click();
        if (estado() !== antes || medio === antes) { prob.push("alternar dos veces no vuelve al estado inicial"); }
      }
      var saltar = document.querySelector(".simraiz > a.saltar");
      if (!saltar || saltar !== document.querySelector(".simraiz a, .simraiz button, .simraiz [tabindex]")) {
        prob.push("«Saltar al lienzo» no es lo primero que se recorre");
      } else {
        saltar.click();
        if (document.activeElement !== document.querySelector("svg.lienzo")) { prob.push("«Saltar al lienzo» no deja el foco en el lienzo"); }
      }
      if (!document.querySelector("main.simcuerpo")) { prob.push("no hay un <main>"); }
      var bZoom = document.querySelector(".simtools button[data-h=porc]");
      if (!bZoom || (bZoom.getAttribute("aria-label") || "").indexOf(bZoom.textContent) < 0) {
        prob.push("el nombre del botón de zoom no contiene su texto");
      }
      if (prob.length === 0) {
        return fila(26, nombre, true, "Tema inicial del sistema; alternar cambia raíz, theme-color, color-scheme y fondo; botón primario con 4.5:1 o más en los dos temas; «Saltar al lienzo» primero; <main>; zoom «" + bZoom.getAttribute("aria-label") + "».");
      }
      return fila(26, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(26, nombre, false, "Excepción: " + e.message);
    }
  }

  /* Versionado (SRE-1033): el número es semver y se ve en la Ayuda; el
   * archivo exportado anota formato y generador; un formato del futuro se
   * rechaza diciendo qué hacer. */
  function crit27() {
    var nombre = "La versión se ve en la Ayuda y los archivos anotan con qué versión se hicieron";
    try {
      var prob = [];
      var v = Escenarios.VERSION_APP;
      if (!/^\d+\.\d+\.\d+$/.test(String(v))) { prob.push("la versión «" + v + "» no es MAYOR.MENOR.PARCHE"); }
      var franja = document.querySelector(".siminf");
      var ayuda = document.getElementById("sim-tab-inf-ayuda");
      if (franja && getComputedStyle(franja).display !== "none" && ayuda) {
        ayuda.click();
        var linea = document.querySelector(".siminf .tabs .version");
        if (!linea || linea.textContent.indexOf("OpenRedLab " + v) !== 0) { prob.push("la Ayuda no muestra «OpenRedLab " + v + "»"); }
        // La Ayuda entra justa: el número va en la fila de pestañas, no en el panel.
        else if (document.getElementById("sim-panel-inf").contains(linea)) { prob.push("la versión está dentro del panel y le suma alto"); }
        if (document.documentElement.scrollHeight > window.innerHeight + 1) { prob.push("la Ayuda deja scroll de página"); }
        document.getElementById("sim-tab-inf-simulacion").click();
      }
      var red = clonar(ejemploPorId("basica").topologia);
      var exp = JSON.parse(Escenarios.exportar(red));
      if (exp.version !== Escenarios.VERSION_FORMATO || exp.generador !== "OpenRedLab " + v) {
        prob.push("el archivo exportado no anota formato y generador");
      }
      var futuro = clonar(red);
      futuro.version = Escenarios.VERSION_FORMATO + 1;
      futuro.generador = "OpenRedLab 99.0.0";
      var imp = Escenarios.importar(JSON.stringify(futuro));
      if (imp.ok || !imp.errores.length || imp.errores[0].mensaje.indexOf("más nuevo") < 0) {
        prob.push("un archivo de un formato más nuevo no se rechaza con un mensaje que diga qué hacer");
      }
      if (prob.length === 0) {
        return fila(27, nombre, true, "OpenRedLab " + v + " en la Ayuda; exportar anota formato " + exp.version + " y «" + exp.generador + "»; formato " + futuro.version + " rechazado: «" + imp.errores[0].mensaje + "»");
      }
      return fila(27, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(27, nombre, false, "Excepción: " + e.message);
    }
  }

  /* Pulido (SRE-1028): la captura guarda los últimos 500 paquetes sin cortar la
   * numeración y lo avisa; los textos de ejemplo terminan en «…»; los títulos
   * se equilibran y el movimiento reducido apaga transiciones y animaciones. */
  function crit28() {
    var nombre = "La captura guarda los últimos 500 paquetes y avisa; textos de ejemplo y movimiento reducido";
    var previo = modoActualDom();
    try {
      var prob = [];
      var inf = document.querySelector(".siminf");
      if (!inf || getComputedStyle(inf).display === "none") {
        return fila(28, nombre, true, "No aplica con el diseño de celular, donde la franja inferior está oculta.");
      }
      function boton(raiz, texto) {
        var bs = raiz.querySelectorAll("button");
        for (var i = 0; i < bs.length; i++) { if (bs[i].textContent.indexOf(texto) === 0) { return bs[i]; } }
        return null;
      }
      function estado() { var s = inf.querySelector(".simctrl .tenue"); return s ? s.textContent : ""; }
      function verCaptura() {
        document.getElementById("sim-tab-inf-simulacion").click();
        document.getElementById("sim-tab-inf-captura").click();
      }
      UI.setModo("topologia");
      var topo = clonar(ejemploPorId("complejo").topologia);
      UI.cargarTopologia(topo);
      document.getElementById("sim-tab-inf-captura").click();
      boton(inf, "Limpiar").click();
      boton(inf, "Iniciar captura").click();
      // Las tramas de un ping real, repetidas hasta pasar el tope, entran por el
      // mismo camino que las de cualquier ping (UI.capturarTramas).
      var res = Motor.ping(Motor.crearEstado(topo), "pc-admin", "10.45.7.122");
      var tramas = res.tramas || [];
      if (!tramas.length) { return fila(28, nombre, false, "Falla: el ping de referencia no dio tramas."); }
      var lote = [];
      while (lote.length < 520) { lote = lote.concat(tramas); }
      UI.capturarTramas(lote);
      verCaptura();
      var filas = inf.querySelectorAll(".tablacap tbody tr");
      if (filas.length !== 500) { prob.push("la tabla tiene " + filas.length + " paquetes y el tope es 500"); }
      if (estado().indexOf("se muestran los últimos 500") < 0) { prob.push("no avisa que se muestran los últimos 500"); }
      var primero = filas.length ? Number(filas[0].cells[0].textContent) : 0;
      var ultimo = filas.length ? Number(filas[filas.length - 1].cells[0].textContent) : 0;
      if (filas.length && (ultimo !== lote.length || ultimo - primero !== 499)) { prob.push("la numeración no sigue (" + primero + " a " + ultimo + ")"); }
      // Elegir el más viejo y capturar más: se descarta y la elección se borra.
      if (filas.length) {
        filas[0].click();
        UI.capturarTramas(tramas);
        verCaptura();
        if (inf.querySelector(".tablacap tbody tr.sel")) { prob.push("queda elegido un paquete que ya se descartó"); }
      }
      boton(inf, "Limpiar").click();
      var bDet = boton(inf, "Detener");
      if (bDet) { bDet.click(); }
      if (estado().indexOf("últimos") >= 0) { prob.push("«Limpiar» no borra el aviso"); }

      // Textos de ejemplo visibles con «…».
      var sinPuntos = [];
      document.getElementById("sim-tab-inf-simulacion").click();
      document.querySelectorAll(".simraiz input[placeholder]").forEach(function (n) {
        if (n.placeholder && !/…$/.test(n.placeholder)) { sinPuntos.push(n.placeholder); }
      });
      if (sinPuntos.length) { prob.push("textos de ejemplo sin «…»: " + sinPuntos.join(", ")); }

      // Reglas de estilo.
      var hoja = document.getElementById("sim-estilos");
      var reglas = hoja && hoja.sheet ? Array.prototype.slice.call(hoja.sheet.cssRules) : [];
      var titulos = reglas.some(function (r) { return /\.simraiz h2/.test(r.selectorText || "") && /text-wrap/.test(r.cssText); });
      var reducido = reglas.some(function (r) {
        return r.media && /reduce/.test(r.media.mediaText) && /transition/.test(r.cssText) && /animation/.test(r.cssText);
      });
      if (!titulos) { prob.push("los títulos no tienen text-wrap"); }
      if (!reducido) { prob.push("el movimiento reducido no apaga transiciones y animaciones"); }

      if (prob.length === 0) {
        return fila(28, nombre, true, "Captura en 500 (del " + primero + " al " + ultimo + ") con aviso; el paquete descartado deja de estar elegido; textos de ejemplo con «…»; text-wrap y movimiento reducido.");
      }
      return fila(28, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(28, nombre, false, "Excepción: " + e.message);
    } finally {
      try { UI.setModo(previo); } catch (e2) { /* se sigue igual */ }
    }
  }

  // El cruce de internet en la interfaz (SRE-1031): las tramas dicen «por
  // internet», la captura marca el tramo y el detalle no inventa una trama.
  function crit30() {
    var nombre = "El cruce de internet se nombra en las tramas, la captura y el detalle por capas";
    var previo = modoActualDom();
    try {
      var prob = [];
      var inf = document.querySelector(".siminf");
      if (!inf || getComputedStyle(inf).display === "none") {
        return fila(30, nombre, true, "No aplica con el diseño de celular, donde la franja inferior está oculta.");
      }
      function boton(raiz, texto) {
        var bs = raiz.querySelectorAll("button");
        for (var i = 0; i < bs.length; i++) { if (bs[i].textContent.indexOf(texto) === 0) { return bs[i]; } }
        return null;
      }
      UI.setModo("topologia");
      UI.cargarTopologia(clonar(ejemploPorId("dos-sitios").topologia));
      // El ping desde la franja, como lo haría el usuario.
      document.getElementById("sim-tab-inf-simulacion").click();
      var selO = Array.prototype.filter.call(inf.querySelectorAll("select"), function (x) {
        return Array.prototype.some.call(x.options, function (o) { return o.value === "pc-casa"; });
      })[0];
      if (!selO) { return fila(30, nombre, false, "Falla: no está el selector de origen."); }
      selO.value = "pc-casa";
      selO.dispatchEvent(new Event("change", { bubbles: true }));
      var selD = inf.querySelector("input[inputmode=url]");
      selD.value = "203.0.113.10";
      selD.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      var bTramas = boton(inf, "Cómo viaja el paquete");
      if (!bTramas) {
        prob.push("el ping no mostró el recorrido");
      } else {
        bTramas.click();
        var lineas = Array.prototype.map.call(inf.querySelectorAll(".trama"), function (x) { return x.textContent; });
        if (!lineas.some(function (x) { return x.indexOf("Internet (casa) → Internet (oficina)") >= 0 && x.indexOf("por internet") >= 0; })) {
          prob.push("ninguna trama dice «Internet (casa) → Internet (oficina) · por internet»");
        }
      }
      // La captura de todos los cables marca el tramo y el detalle.
      document.getElementById("sim-tab-inf-captura").click();
      boton(inf, "Limpiar").click();
      boton(inf, "Iniciar captura").click();
      var res = Motor.ping(Motor.crearEstado(clonar(ejemploPorId("dos-sitios").topologia)), "pc-casa", "203.0.113.10");
      UI.capturarTramas(res.tramas || []);
      document.getElementById("sim-tab-inf-simulacion").click();
      document.getElementById("sim-tab-inf-captura").click();
      var fila30 = Array.prototype.filter.call(inf.querySelectorAll(".tablacap tbody tr"), function (tr) {
        return tr.textContent.indexOf("(cruza internet)") >= 0;
      })[0];
      if (!fila30) {
        prob.push("la captura no marca el tramo «(cruza internet)»");
      } else {
        fila30.click();
        if (inf.textContent.indexOf("Cruce de internet") < 0) { prob.push("el detalle no dice «Cruce de internet»"); }
      }
      boton(inf, "Limpiar").click();
      var bDet = boton(inf, "Detener");
      if (bDet) { bDet.click(); }
      if (prob.length === 0) {
        return fila(30, nombre, true, "La trama del cruce dice «por internet»; la captura marca «(cruza internet)» y el detalle, «Cruce de internet».");
      }
      return fila(30, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(30, nombre, false, "Excepción: " + e.message);
    } finally {
      try { UI.setModo(previo); } catch (e2) { /* se sigue igual */ }
    }
  }

  // La pestaña NAT del router (SRE-1021): muestra los puertos con NAT y las
  // redirecciones, y la fila de pestañas no tiene scroll.
  function crit32() {
    var nombre = "La pestaña NAT del router muestra el NAT de origen y las redirecciones, sin scroll en la fila de pestañas";
    var previo = modoActualDom();
    try {
      var prob = [];
      UI.setModo("topologia");
      UI.cargarTopologia(clonar(ejemploPorId("servidor-publicado").topologia));
      UI.seleccionar("r-oficina");
      var tab = document.getElementById("sim-tab-prop-nat");
      if (!tab) { return fila(32, nombre, false, "Falla: el router no tiene la pestaña NAT."); }
      tab.click();
      var panel = document.querySelector("[role=tabpanel][aria-labelledby='sim-tab-prop-nat']") || tab.closest(".simprop, .props, aside") || document.body;
      var texto = panel.textContent;
      if (texto.indexOf("Hacen NAT: g0/1") < 0) { prob.push("no dice qué puerto hace NAT"); }
      if (texto.indexOf("TCP 80 → 192.168.50.10:80") < 0) { prob.push("no lista la redirección del TCP 80"); }
      var fila32 = tab.parentNode;
      if (fila32.scrollWidth > fila32.clientWidth + 1) { prob.push("la fila de pestañas tiene scroll (" + fila32.scrollWidth + " > " + fila32.clientWidth + ")"); }
      UI.seleccionar("pc-casa");
      if (document.getElementById("sim-tab-prop-nat")) { prob.push("una PC también tiene la pestaña NAT"); }
      if (prob.length === 0) { return fila(32, nombre, true, "Pestaña NAT con «Hacen NAT: g0/1» y las dos redirecciones; sin scroll; las PC no la tienen."); }
      return fila(32, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(32, nombre, false, "Excepción: " + e.message);
    } finally {
      try { UI.setModo(previo); } catch (e2) { /* se sigue igual */ }
    }
  }

  var CRITERIOS_TECNICOS = [crit01, crit09, crit10, crit11, crit13, crit14, crit15, crit16, crit24, crit25, crit26, crit27, crit28, crit30, crit32];

  function correr(opciones) {
    var tecnico = !!(opciones && opciones.tecnico);
    if (typeof Red === "undefined" || typeof Motor === "undefined" ||
        typeof Escenarios === "undefined" || typeof UI === "undefined") {
      try {
        document.getElementById("app").innerHTML =
          "<p style='font-family:system-ui;padding:20px'>Falta una capa: el ensamblado quedó incompleto " +
          "(revisá que los cinco bloques script estén pegados en orden). El autotest no puede correr.</p>";
      } catch (e) {
        /* se sigue igual */
      }
      return { total: 0, pasadas: 0, resultados: [], detalleCapas: "capas faltantes", fallos: 0 };
    }
    var respaldoTopo = null;
    var respaldoModo = "topologia";
    var teniaUI = true;
    try {
      respaldoModo = modoActualDom();
    } catch (e) {
      respaldoModo = "topologia";
    }
    try {
      if (teniaUI) {
        respaldoTopo = UI.topologiaActual();
      }
    } catch (e) {
      respaldoTopo = null;
    }
    /* Las animaciones se pausan envolviendo los dibujos: se restauran al salir. */
    var originalPing = UI ? UI.animarPing : null;
    var originalDhcp = UI ? UI.animarDhcp : null;
    try {
      if (UI) {
        UI.animarPing = function () { /* autotest sin animaciones */ };
        UI.animarDhcp = function () { /* autotest sin animaciones */ };
      }
    } catch (e) {
      /* si no se puede envolver, se sigue igual */
    }

    var resultados = [];
    var pasadasCapas = 0;
    var totalCapas = 0;
    var detalleCapas = "";
    if (tecnico) {
      try {
        var r1 = Red.autopruebas();
        var r2 = Motor.autopruebas();
        var r3 = Escenarios.autopruebas();
        totalCapas = r1.total + r2.total + r3.total;
        pasadasCapas = r1.pasadas + r2.pasadas + r3.pasadas;
        var fallosCapas = r1.fallos.concat(r2.fallos).concat(r3.fallos).slice(0, 8);
        detalleCapas = "Capas 1–3: " + pasadasCapas + "/" + totalCapas + " pruebas internas." +
          (fallosCapas.length ? " Primeros fallos: " + fallosCapas.map(function (f) { return f.nombre; }).join(" | ") + "." : " Sin fallos internos.");
      } catch (e) {
        detalleCapas = "No se pudieron correr las autopruebas internas: " + e.message;
      }
    }

    try {
      (tecnico ? CRITERIOS_DIDACTICOS.concat(CRITERIOS_TECNICOS) : CRITERIOS_DIDACTICOS).forEach(function (crit) {
        resultados.push(crit());
      });
    } finally {
      if (!tecnico) {
        /* Sin los criterios técnicos, los números del informe van corridos. */
        resultados.forEach(function (r, i) { r.n = i + 1; });
      }
      try {
        if (UI) {
          if (originalPing) {
            UI.animarPing = originalPing;
          }
          if (originalDhcp) {
            UI.animarDhcp = originalDhcp;
          }
        }
      } catch (e) {
        /* se sigue igual */
      }
      try {
        if (teniaUI && respaldoTopo) {
          UI.cargarTopologia(respaldoTopo);
          UI.setModo(respaldoModo);
        }
      } catch (e) {
        /* no se pierde el trabajo: ya se trabajó sobre copias */
      }
    }

    var pasadas = 0;
    resultados.forEach(function (r) {
      if (r.pasa) {
        pasadas += 1;
      }
    });
    /* Fallos primero para leer rápido qué arreglar. */
    var ordenados = resultados.slice().sort(function (a, b) {
      if (a.pasa === b.pasa) {
        return a.n - b.n;
      }
      return a.pasa ? 1 : -1;
    });
    var salida = {
      tecnico: tecnico,
      total: totalCapas + resultados.length,
      pasadas: pasadasCapas + pasadas,
      resultados: ordenados,
      detalleCapas: detalleCapas,
      fallos: totalCapas + resultados.length - (pasadasCapas + pasadas)
    };
    try {
      if (UI && UI.registrar) {
        UI.registrar("autotest", "Autotest " + salida.pasadas + "/" + salida.total + ". " + detalleCapas);
      }
    } catch (e) {
      /* se sigue igual */
    }
    mostrarInforme(salida);
    return salida;
  }

  function cablearBoton() {
    try {
      var barra = document.querySelector(".siminf .tabs");
      if (!barra || document.querySelector("[data-boton-autotest5]")) {
        return;
      }
      var b = document.createElement("button");
      b.setAttribute("data-boton-autotest5", "1");
      b.textContent = "Autotest";
      b.title = "Comprueba que el simulador resuelve bien casos de la materia (máscaras, rutas, DHCP, VLSM) sin perder el trabajo cargado";
      b.addEventListener("click", function () {
        correr();
      });
      barra.appendChild(b);
    } catch (e) {
      /* el objeto Autotest queda igual disponible por consola */
    }
  }

  function arrancar() {
    if (typeof Red === "undefined" || typeof Motor === "undefined" ||
        typeof Escenarios === "undefined" || typeof UI === "undefined") {
      document.getElementById("app").innerHTML =
        "<p style='font-family:system-ui;padding:20px'>Falta una capa: el ensamblado quedó incompleto " +
        "(revisá que los cinco bloques script estén pegados en orden).</p>";
      return;
    }
    /* Se arranca con el lienzo vacío: los ejemplos están en «Ejemplos…» y
     * el trabajo de la sesión anterior se ofrece desde el lienzo. */
    UI.iniciar(document.getElementById("app"), {
      version: 1, nombre: "Red nueva", dispositivos: [], enlaces: [], escenario: null
    });
    cablearBoton();
    /* La capa 4 reconstruye la franja inferior en cada render: el observador
     * repone el botón si un repintado lo barre. No toca ninguna capa. */
    try {
      var raiz = document.getElementById("app");
      if (raiz && typeof MutationObserver !== "undefined") {
        var obs = new MutationObserver(function () {
          if (!document.querySelector("[data-boton-autotest5]")) {
            cablearBoton();
          }
        });
        obs.observe(raiz, { childList: true, subtree: true });
      }
    } catch (e) {
      /* sin observador el botón igual queda tras el arranque */
    }
  }

  return {
    correr: correr,
    arrancar: arrancar
  };
})();

if (typeof window !== "undefined") {
  window.Autotest = Autotest;
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      Autotest.arrancar();
    });
  } else {
    Autotest.arrancar();
  }
}

</script>
