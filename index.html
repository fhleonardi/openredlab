    if (S.pestañaInf === "simulacion") { panelSimulacion(cuerpo); }
    else if (S.pestañaInf === "dhcp") { panelDhcpInf(cuerpo); }
    else if (S.pestañaInf === "calculo") { panelCalculo(cuerpo); }
    else { panelAyuda(cuerpo); }
  }

  // Modo presentación: la franja queda en una línea de estado para que la
  // topología entre entera en pantalla.
  function renderEstadoPresentacion(c) {
    var fila = el("div", "estadopres");
    var bExp = boton("Expandir simulación");
    bExp.addEventListener("click", function () { S.presExpandida = true; renderInferior(); });
    fila.appendChild(bExp);
    fila.appendChild(el("span", "", escapar(resumenUltimoPing())));
    fila.appendChild(el("span", "espacio"));
    fila.appendChild(el("span", "", "F para salir · flechas sobre el lienzo para desplazarlo"));
    c.appendChild(fila);
  }

  function resumenUltimoPing() {
    var u = S.ultimo;
    if (!u) { return "Todavía no se hizo ningún ping."; }
    var base = "Último ping: " + nombreDe(u.origen) + " → " + u.destino + " · ";
    if (u.res.exito) {
      var r = u.res.respuestas[0] || { ms: 1 };
      return base + "éxito en " + r.ms + " ms · " + cantidadSaltos(u.res) + " saltos";
    }
    var dg = u.res.diagnostico;
    return base + "falla" + (dg ? " " + dg.codigo + " · " + dg.titulo : "");
  }

  function nombreDe(id) {
    var d = buscarDisp(id);
    return d ? (d.nombre || d.id) : id;
  }

  // Recorrido del paquete por nombre de equipo, sin repeticiones seguidas.
  function rutaNombres(res) {
    var nombres = [];
    (res.saltos || []).forEach(function (s) {
      var n = nombreDe(s.dispositivo);
      if (nombres[nombres.length - 1] !== n) { nombres.push(n); }
    });
    return nombres;
  }

  function cantidadSaltos(res) {
    return Math.max(0, rutaNombres(res).length - 1);
  }

  function opcionesEquipos(sel, excluirSwitches) {
    (S.topologia.dispositivos || []).forEach(function (d) {
      if (excluirSwitches && d.tipo === "switch-l2") { return; }
      var op = document.createElement("option");
      op.value = d.id; op.textContent = (d.nombre || d.id) + " (" + d.id + ")";
      sel.appendChild(op);
    });
  }

  function panelSimulacion(c) {
    c.classList.add("sim");
    var ctrl = el("div", "simctrl");
    var selO = document.createElement("select");
    opcionesEquipos(selO);
    if (S.origenElegido && buscarDisp(S.origenElegido)) { selO.value = S.origenElegido; }
    else if (S.seleccionado) { selO.value = S.seleccionado; }
    selO.addEventListener("change", function () { S.origenElegido = selO.value; });
    var selD = document.createElement("input");
    selD.type = "text";
    campoDireccion(selD, "destino");
    selD.placeholder = "p. ej. 10.45.7.122…";
    selD.value = S.ultimoDestino || "";
    var bPing = boton("Ping", "primario");
    ctrl.appendChild(etiqueta("Origen", selO)); ctrl.appendChild(selO);
    ctrl.appendChild(el("span", "flecha", "→")).setAttribute("aria-hidden", "true");
    ctrl.appendChild(etiqueta("Destino", selD)); ctrl.appendChild(selD);
    ctrl.appendChild(bPing);
    ctrl.appendChild(el("span", "espacio"));
    // Los botones están siempre en el mismo lugar; si no aplican, quedan
    // deshabilitados en lugar de desaparecer.
    var esc = S.topologia.escenario;
    var bVer = boton("Verificar");
    bVer.disabled = !(esc && esc.objetivos && esc.objetivos.length);
    if (bVer.disabled) { bVer.title = "Esta topología no trae objetivos para verificar"; }
    var hayResultado = !!(S.ultimo || S.ultimaVerif || S.ultimoAutotest);
    var bCopiar = boton("Copiar registro");
    var bExp = boton("Exportar registro");
    bCopiar.disabled = !hayResultado;
    bExp.disabled = !hayResultado;
    var bAuto = boton("Autotest");
    [bVer, bCopiar, bExp, bAuto].forEach(function (b) { ctrl.appendChild(b); });
    c.appendChild(ctrl);
    c.appendChild(renderResultado());

    function hacerPing() {
      S.ultimoDestino = selD.value;
      S.origenElegido = selO.value;
      if (!S.estado) { reconstruirEstado(); }
      var res;
      try { res = Motor.ping(S.estado, selO.value, selD.value.trim()); }
      catch (e) { registrar("error", "El ping falló por un error interno: " + e.message); return; }
      pintarPing(selO.value, selD.value.trim(), res);
      animarPing(res);
    }
    bPing.addEventListener("click", hacerPing);
    selD.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); hacerPing(); }
    });
    bCopiar.addEventListener("click", function () {
      var texto = S.registro.join("\n");
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(function () {
            registrar("registro", "Registro copiado al portapapeles.");
            anunciar("Registro copiado al portapapeles.");
          }).catch(function () { mostrarTextoCopiable(c, texto); });
        } else { throw new Error("sin portapapeles"); }
      } catch (e) {
        mostrarTextoCopiable(c, texto);
      }
    });
    bExp.addEventListener("click", function () {
      try {
        var blob = new Blob([S.registro.join("\n")], { type: "text/plain" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "registro-simulador.txt";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      } catch (e) { registrar("registro", "No se pudo exportar el registro."); }
    });
    bVer.addEventListener("click", verificarActual);
    bAuto.addEventListener("click", function () {
      var r1 = Red.autopruebas(), r2 = Motor.autopruebas(), r3 = Escenarios.autopruebas();
      var fallos = r1.fallos.concat(r2.fallos).concat(r3.fallos);
      S.ultimoAutotest = {
        total: r1.total + r2.total + r3.total,
        pasadas: r1.pasadas + r2.pasadas + r3.pasadas,
        fallos: fallos
      };
      consolaAgregar("Autotest: " + S.ultimoAutotest.pasadas + "/" + S.ultimoAutotest.total + " pruebas pasadas.", fallos.length > 0);
      fallos.slice(0, 10).forEach(function (f) { consolaAgregar("- " + f.nombre, true); });
      S.panelRes = "autotest";
      renderInferior();
      anunciar("Autotest: " + S.ultimoAutotest.pasadas + " de " + S.ultimoAutotest.total + " pruebas pasadas.");
    });
    if (S.enfocarPing) {
      S.enfocarPing = false;
      try { bPing.focus(); } catch (e) { /* sin foco: se sigue igual */ }
    }
  }

  // Si el portapapeles no está disponible, el texto queda seleccionado en
  // pantalla para copiarlo a mano.
  function mostrarTextoCopiable(c, texto) {
    var ta = document.createElement("textarea");
    ta.value = texto; ta.rows = 6; ta.style.width = "100%";
    ta.setAttribute("aria-label", "Registro para copiar");
    c.appendChild(ta); ta.select();
    registrar("registro", "El portapapeles falló: el texto quedó seleccionado abajo.");
  }

  /* ---------------- Resultado: reposo, ping, verificación ---------------- */

  function renderResultado() {
    var cont = el("div", "simres");
    if (S.panelRes === "verificacion" && S.ultimaVerif) { return renderVerificacion(cont); }
    if (S.panelRes === "autotest" && S.ultimoAutotest) { return renderAutotest(cont); }
    if (!S.ultimo) {
      cont.appendChild(el("div", "vacio",
        "<b>Elegí un origen y un destino, y apretá Ping</b>" +
        "Vas a ver el recorrido paso a paso: cada cosa que el sistema operativo verifica antes de mandar el paquete. " +
        "Si algo falla, acá se indica cuál de esos pasos se rompió y por qué.<br>" +
        "Antes de configurar una IP, mirá la pestaña <b style='display:inline;font-size:inherit'>Cálculo de subred</b>."));
      return cont;
    }
    var res = S.ultimo.res;
    cont.appendChild(renderRecorrido(res));
    var lado = el("div", "lado");
    if (res.exito) {
      var r = res.respuestas[0] || { ms: 1, ttl: 64 };
      var ruta = rutaNombres(res);
      lado.appendChild(el("div", "banda-ok",
        "<b>✓ El eco volvió en " + r.ms + " ms.</b>" +
        "<div class='ruta'>" + escapar(ruta.join(" → ")) + " · " + cantidadSaltos(res) + " saltos · TTL " + r.ttl + "</div>"));
      lado.appendChild(renderConsola());
    } else {
      lado.appendChild(renderDiagnostico(res.diagnostico));
      // Con un diagnóstico a la vista, la consola se pliega a una línea.
      lado.appendChild(renderConsolaPlegable());
    }
    cont.appendChild(lado);
    return cont;
  }

  function renderDiagnostico(dg) {
    if (!dg) { return el("div", "diagnostico", "<span class='tit'>El ping falló sin diagnóstico.</span>"); }
    var caja = el("div", "diagnostico",
      "<span class='cod'>" + escapar(dg.codigo) + "</span><span class='tit'>" + escapar(dg.titulo) + "</span>" +
      "<div>" + escapar(dg.explicacion) + "</div>" +
      "<div class='rev'><b>Sugerencia:</b> " + escapar(dg.sugerencia) + "</div>");
    var origen = S.ultimo && S.ultimo.origen;
    if (origen && buscarDisp(origen) && dg.codigo !== "ENTRADA") {
      var bIr = boton("Ir a configurar " + nombreDe(origen), "irconfig");
      bIr.addEventListener("click", function () {
        seleccionar(origen);
        if (esCelular()) { abrirHoja("configurar"); return; }
        var primero = S.prop.querySelector("input,select");
        if (primero) { try { primero.focus(); } catch (e) { /* se sigue igual */ } }
      });
      caja.appendChild(bIr);
    }
    return caja;
  }

  function resumenPaso(p) {
    var lineas = String(p.detalle || "").split("\n").filter(function (l) { return l.trim() !== ""; });
    return lineas.length ? lineas[lineas.length - 1].trim() : "";
  }

  var PASOS_CLAVE = /^(Comparar redes|Buscar ruta|Verificar que el destino)/;

  function renderRecorrido(res) {
    var caja = el("div", "recorrido");
    var pasos = res.pasos || [];
    var fallo = -1;
    pasos.forEach(function (p, i) { if (!p.ok && fallo < 0) { fallo = i; } });
    var cab = el("div", "cab", "<span>Recorrido paso a paso</span>");
    if (res.exito) {
      cab.appendChild(el("span", "ok", pasos.length + " de " + pasos.length + " verificaciones correctas"));
    } else if (fallo >= 0) {
      cab.appendChild(el("span", "mal", "se detuvo en el paso " + pasos[fallo].n));
    }
    caja.appendChild(cab);
    var lista = el("div", "pasos");
    var visibles = [];
    if (!pasos.length) {
      lista.appendChild(el("p", "", res.diagnostico && res.diagnostico.codigo === "ENTRADA"
        ? "No se recorrió ningún paso: la dirección de destino no es válida."
        : "No se recorrió ningún paso."));
    } else if (S.verTodos) {
      visibles = pasos;
    } else if (res.exito) {
      visibles = pasos.filter(function (p) { return PASOS_CLAVE.test(p.titulo); });
    } else {
      visibles = pasos.slice(Math.max(0, fallo - 1), fallo + 1);
    }
    visibles.forEach(function (p) {
      if (p.ok) {
        var resumen = resumenPaso(p);
        lista.appendChild(el("div", "linpaso",
          "<span class='marca' aria-hidden='true'>✓</span><b>" + p.n + ".</b> " + escapar(p.titulo) +
          (resumen ? " — " + escapar(resumen) : "")));
      } else {
        var f = el("div", "pasofallo",
          "<span class='marca' aria-hidden='true'>✗</span><b>" + p.n + ". " + escapar(p.titulo) + "</b>");
        var pre = document.createElement("pre");
        // En el resumen van las dos primeras líneas del detalle (la cuenta
        // que falló); el detalle completo, con los binarios, en "Ver los pasos".
        var det = String(p.detalle || "").split("\n");
        pre.textContent = (S.verTodos ? det : det.slice(0, 2)).join("\n");
        f.appendChild(pre);
        lista.appendChild(f);
      }
    });
    caja.appendChild(lista);
    var pie = el("div", "pie");
    if (!res.exito && fallo >= 0 && !S.verTodos) {
      pie.appendChild(el("span", "", "los pasos siguientes no se llegaron a verificar"));
    }
    if (pasos.length > visibles.length || S.verTodos) {
      var bTodos = boton(S.verTodos ? "Ver resumen" : "Ver los " + pasos.length + " pasos");
      bTodos.addEventListener("click", function () { S.verTodos = !S.verTodos; renderInferior(); });
      pie.appendChild(bTodos);
    }
    if (pie.childNodes.length) { caja.appendChild(pie); }
    return caja;
  }

  function renderVerificacion(cont) {
    var v = S.ultimaVerif;
    var caja = el("div", "recorrido");
    var cab = el("div", "cab", "<span>Objetivos del escenario</span>");
    var lista = el("div", "pasos");
    if (v.error) {
      lista.appendChild(el("p", "", escapar(v.error)));
    } else {
      var cumplidos = v.res.filter(function (r) { return r.cumple; }).length;
      cab.appendChild(el("span", cumplidos === v.res.length ? "ok" : "mal", cumplidos + " de " + v.res.length + " cumplidos"));
      v.res.forEach(function (r) {
        var o = r.objetivo;
        lista.appendChild(el("div", r.cumple ? "linpaso" : "pasofallo",
          "<span class='marca' aria-hidden='true'>" + (r.cumple ? "✓" : "✗") + "</span><b>" +
          escapar(nombreDe(o.origen) + " → " + o.destino) + "</b> (se espera " + escapar(o.esperado || "exito") + ")" +
          (r.cumple ? " — cumple" : " — no cumple" + (r.codigo ? ": " + escapar(r.codigo) : ""))));
      });
    }
    caja.insertBefore(cab, caja.firstChild);
    caja.appendChild(lista);
    cont.appendChild(caja);
    var lado = el("div", "lado");
    lado.appendChild(renderConsola());
    cont.appendChild(lado);
    return cont;
  }

  function renderAutotest(cont) {
    var a = S.ultimoAutotest;
    var caja = el("div", "recorrido");
    var cab = el("div", "cab", "<span>Autotest de las capas 1 a 3</span>");
    cab.appendChild(el("span", a.fallos.length ? "mal" : "ok", a.pasadas + " de " + a.total + " pruebas pasadas"));
    caja.appendChild(cab);
    var lista = el("div", "pasos");
    if (!a.fallos.length) {
      lista.appendChild(el("div", "linpaso", "<span class='marca' aria-hidden='true'>✓</span>Todas las pruebas pasaron."));
    }
    a.fallos.forEach(function (f) {
      lista.appendChild(el("div", "pasofallo", "<span class='marca' aria-hidden='true'>✗</span>" + escapar(f.nombre)));
    });
    caja.appendChild(lista);
    cont.appendChild(caja);
    var lado = el("div", "lado");
    lado.appendChild(renderConsola());
    cont.appendChild(lado);
    return cont;
  }

  /* ---------------- Consola ---------------- */

  function consolaAgregar(texto, error) {
    S.lineasConsola.push({ texto: texto, error: !!error });
    if (S.lineasConsola.length > 200) { S.lineasConsola.shift(); }
    refrescarConsola();
  }

  function refrescarConsola() {
    var cons = S.consola;
    if (!cons || !cons.isConnected) { return; }
    cons.innerHTML = S.lineasConsola.length
      ? S.lineasConsola.map(function (l) {
        return l.error ? "<span class='error'>" + escapar(l.texto) + "</span>" : escapar(l.texto);
      }).join("\n")
      : "La consola muestra el ping y el diagnóstico.";
    cons.scrollTop = cons.scrollHeight;
  }

  function renderConsola() {
    var cons = el("pre", "consola");
    cons.setAttribute("aria-label", "Consola");
    S.consola = cons;
    setTimeout(refrescarConsola, 0);
    return cons;
  }

  function renderConsolaPlegable() {
    var cont = el("div", "");
    cont.style.display = "flex";
    cont.style.flexDirection = "column";
    cont.style.minHeight = "0";
    cont.style.flex = S.consolaAbierta ? "1" : "0 0 auto";
    var b = boton("Consola · " + S.lineasConsola.length + " líneas " + (S.consolaAbierta ? "▾" : "▸"), "consolabtn");
    b.setAttribute("aria-expanded", String(!!S.consolaAbierta));
    b.addEventListener("click", function () { S.consolaAbierta = !S.consolaAbierta; renderInferior(); });
    cont.appendChild(b);
    if (S.consolaAbierta) { cont.appendChild(renderConsola()); }
    else { S.consola = null; }
    return cont;
  }

  function pintarPing(origen, destino, res) {
    S.ultimo = { origen: origen, destino: destino, res: res };
    S.panelRes = "ping";
    S.verTodos = false;
    S.consolaAbierta = false;
    if (res.exito) {
      var r = res.respuestas[0] || { ttl: 64, ms: 1 };
      consolaAgregar("Respuesta desde " + destino + ": bytes=32 tiempo=" + r.ms + "ms TTL=" + r.ttl);
      consolaAgregar("Estadísticas: 1 enviados, 1 recibidos, 0 perdidos.");
      anunciar("Ping a " + destino + ": el eco volvió en " + r.ms + " milisegundos.");
    } else {
      consolaAgregar("El ping de " + origen + " a " + destino + " falló.", true);
      if (res.diagnostico) {
        consolaAgregar(res.diagnostico.codigo + " · " + res.diagnostico.titulo, true);
      }
      anunciar("Ping a " + destino + " falló" + (res.diagnostico ? ": " + res.diagnostico.codigo + ", " + res.diagnostico.titulo : "") + ".");
    }
    registrar("resultado",
      "Ping " + origen + " → " + destino + ": " + (res.exito ? "éxito." : ("falla " + (res.diagnostico ? res.diagnostico.codigo : "") + ".")));
    S.enfocarPing = true;
    renderInferior();
    renderLienzo(); renderPropiedades();
  }

  function verificarActual() {
    var esc = S.topologia.escenario;
    if (!esc || !esc.objetivos) {
      S.ultimaVerif = { error: "Esta topología no trae objetivos. Cargá el ejemplo docente para practicar." };
    } else {
      if (!S.estado) { reconstruirEstado(); }
      try { S.ultimaVerif = { res: Escenarios.verificarObjetivos(S.estado, esc.objetivos) }; }
      catch (e) { S.ultimaVerif = { error: "No se pudo verificar: " + e.message }; }
    }
    S.panelRes = "verificacion";
    renderInferior();
    if (S.ultimaVerif.res) {
      var ok = S.ultimaVerif.res.filter(function (r) { return r.cumple; }).length;
      anunciar("Verificación: " + ok + " de " + S.ultimaVerif.res.length + " objetivos cumplidos.");
    } else {
      anunciar(S.ultimaVerif.error);
    }
  }

  /* Cálculo de subred atado al seleccionado, con binario en dos colores. */
  function panelCalculo(c) {
    c.appendChild(el("div", "", "<b>Cálculo de subred</b> <span style='font-size:12px'>— atado al dispositivo seleccionado, se actualiza mientras se escribe.</span>"));
    var caja = el("div", "calc");
    c.appendChild(caja);
    S.cajaCalculo = caja;
    refrescarCalculo();
  }

  function binarioColoreado(binario, corte) {
    var plano = String(binario || "").replace(/\./g, "");
    var conPuntos = "";
    for (var i = 0; i < 32; i++) {
      conPuntos += plano[i] || "0";
      if (i === 7 || i === 15 || i === 23) { conPuntos += "."; }
    }
    var corteAjust = corte;
    var html = "";
    for (var j = 0; j < conPuntos.length; j++) {
      var ch = conPuntos[j];
      if (ch === ".") { html += "."; continue; }
      var bit = j - (j > 26 ? 3 : (j > 17 ? 2 : (j > 8 ? 1 : 0)));
      var clase = bit < (S.corteBits !== undefined ? S.corteBits : 24) ? "red" : "host";
      var marca = (j === corteAjust) ? " corte" : "";
      html += "<span class='" + clase + marca + "'>" + ch + "</span>";
    }
    return html;
  }

  function refrescarCalculo() {
    var caja = S.cajaCalculo;
    if (!caja) { return; }
    var d = S.seleccionado ? buscarDisp(S.seleccionado) : null;
    if (!d) { caja.innerHTML = "<p>Seleccioná un dispositivo para ver su cálculo.</p>"; return; }
    var prim = primeraIp(d) || (d.interfaces || [])[0];
    if (!prim) { caja.innerHTML = "<p>El dispositivo no tiene interfaces.</p>"; return; }
    var ip = prim.ip || "";
    var pref = prim.prefijo;
    var gw = d.gateway || "";
    var det = null;
    try { det = (ip && Red.esIpValida(ip)) ? Red.desglose(ip, pref, gw) : null; } catch (e) { det = null; }
    if (!det) {
      caja.innerHTML = "<p><b>" + escapar(d.nombre || d.id) + "</b>: escribí una IP válida en Configuración para ver el desglose. Prefijo actual: /" + escapar(String(pref)) + ".</p>";
      return;
    }
    S.corteBits = det.bitsRed;
    var html = "<p><b>Cálculo de subred — " + escapar(d.nombre || d.id) + "</b></p>";
    html += "<div class='grid'>";
    html += "<span>IP</span><span class='binario'>" + escapar(det.ip) + " &nbsp; Prefijo /" + det.prefijo + "</span>";
    html += "<span>Máscara</span><span class='binario'>" + escapar(det.mascaraDecimal) + "</span>";
    html += "</div>";
    html += "<p class='binario'>IP&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + binarioColoreado(det.ipBinario, det.cortePosicion) + "<br>";
    html += "<span style='font-size:11px'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" +
      "bits de red".padEnd(det.bitsRed, "─") + "│" + "bits de host".padStart(det.bitsHost, "─") + "</span><br>";
    html += "Máscara&nbsp;&nbsp;" + binarioColoreado(det.mascaraBinaria, det.cortePosicion) + "</p>";
    html += "<div class='grid'>";
    html += "<span>Dirección de red</span><span>" + escapar(det.direccionDeRed) + "</span>";
    html += "<span>Broadcast</span><span>" + escapar(det.broadcast) + "</span>";
    html += "<span>Rango de hosts</span><span>" + escapar(det.rangoTexto || "—") + "</span>";
    html += "<span>Cantidad de hosts</span><span>" + escapar(String(det.cantidadHosts)) + "</span>";
    html += "</div>";
    if (det.advertencia) { html += "<div class='advertencia'>" + escapar(det.advertencia) + "</div>"; }
    html += "<p><b>¿Tu gateway está en tu subred?</b><br>";
    if (det.gateway) {
      html += "IP&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" + escapar(det.ip) + " AND máscara → " + escapar(det.gateway.andIp || "?") + "<br>";
      html += "Gateway " + escapar(det.gateway.ip) + " AND máscara → " + escapar(det.gateway.andGateway || "?") + "<br>";
      html += escapar(det.gateway.veredicto) + "</p>";
    } else { html += "Sin gateway configurado.</p>"; }
    caja.innerHTML = html;
  }

  function panelDhcpInf(c) {
    c.innerHTML = "";
    c.appendChild(el("p", "", "<b>DHCP</b> <span style='font-size:12px'>— la animación DORA ocurre sobre la topología del lienzo.</span>"));
    var selC = document.createElement("select");
    (S.topologia.dispositivos || []).forEach(function (d) {
      var op = document.createElement("option");
      op.value = d.id; op.textContent = (d.nombre || d.id);
      selC.appendChild(op);
    });
    if (S.seleccionado) { selC.value = S.seleccionado; }
    var selI = document.createElement("select");
    function cargarIfaces() {
      selI.innerHTML = "";
      var d = buscarDisp(selC.value);
      ((d && d.interfaces) || []).forEach(function (f) {
        var op = document.createElement("option");
        op.value = f.id; op.textContent = f.id;
        selI.appendChild(op);
      });
    }
    cargarIfaces();
    selC.addEventListener("change", cargarIfaces);
    var b = boton("Solicitar dirección (DORA)", "primario");
    var out = el("div", "");
    out.setAttribute("aria-live", "polite");
    var fila = el("div", "simctrl");
    fila.appendChild(etiqueta("Equipo", selC)); fila.appendChild(selC);
    fila.appendChild(etiqueta("Interfaz", selI)); fila.appendChild(selI);
    fila.appendChild(b);
    c.appendChild(fila); c.appendChild(out);
    b.addEventListener("click", function () {
      if (!S.estado) { reconstruirEstado(); }
      var res;
      try { res = Motor.dhcpSolicitar(S.estado, selC.value, selI.value); }
      catch (e) { out.textContent = "Error: " + e.message; return; }
      S.topologia = clonar(S.estado.topologia);
      reconstruirEstado();
      var orden = { discover: 0, offer: 1, request: 2, ack: 3 };
      var msgs = (res.mensajes || []).slice().sort(function (a, b2) { return (orden[a.tipo] || 0) - (orden[b2.tipo] || 0); });
      out.innerHTML = msgs.map(function (m) {
        return "<div class='paso ok'><b>" + escapar(m.tipo) + "</b> " + escapar(m.origen) + " → " + escapar(m.destino) + "</div>";
      }).join("") + (res.exito
        ? "<p>Dirección otorgada: <b>" + escapar(res.ip + "/" + res.prefijo) + "</b> gateway " + escapar(res.gateway || "—") + ".</p>"
        : "<div class='diagnostico'><b>" + escapar(res.diagnostico ? res.diagnostico.codigo : "D16") + "</b> " +
          escapar(res.diagnostico ? res.diagnostico.explicacion : "") + "</div>");
      renderTodo();
      animarDhcp(res);
    });
  }

  function panelAyuda(c) {
    c.innerHTML = "<b>Ayuda</b>" +
      "<p><b>Ideas clave:</b> el sistema operativo decide con IP AND máscara; el gateway debe estar en tu subred; " +
      "el switch no mira IP y no enruta; la vuelta del ping también necesita camino; el prefijo es la fuente de verdad.</p>" +
      "<p><b>Simplificaciones declaradas:</b> sin STP ni bucles reales, sin enrutamiento dinámico (OSPF, BGP, RIP), " +
      "sin VLAN ni switch L3, sin NAT, sin HTTP, sin fragmentación, sin IPv6, sin TCP real, sin cifrado ni TLS, " +
      "sin QoS real, sin 802.1X y sin radiofrecuencia: el wireless es una abstracción por distancia.</p>" +
      "<p><b>Atajos:</b> Ctrl+Z deshacer, Ctrl+Y rehacer, Supr borra, Esc cancela, F presenta. " +
      "Paneo: arrastrar el fondo, o flechas con el foco en el lienzo. Con el foco en un equipo, las flechas lo mueven. " +
      "Desde el teclado, Enter sobre un dispositivo de la paleta lo agrega en el centro de la vista.</p>";
    var escD = S.topologia.escenario;
    if (S.modo === "desafio" || (escD && (escD.modo === "desafio" || escD.sectores || escD.requerimientos))) {
      var b = boton("Verificar diseño VLSM", "primario");
      var out = el("div", "");
      out.setAttribute("aria-live", "polite");
      c.appendChild(b); c.appendChild(out);
      b.addEventListener("click", function () {
        var inf;
        try { inf = Escenarios.verificarDesafio(S.topologia, S.topologia.escenario || {}); }
        catch (e) { out.textContent = "Error: " + e.message; return; }
        out.innerHTML = "<p>Errores: " + inf.resumen.errores + ", advertencias: " + inf.resumen.advertencias + ".</p>" +
          inf.porSector.map(function (s) {
            return "<div class='paso " + (s.ok ? "ok" : "mal") + "'><b>" + escapar(s.sector) + "</b> " + (s.ok ? "✓" : "✗") +
              "<br>" + s.hallazgos.map(function (h) { return escapar(h.nivel + ": " + h.mensaje); }).join("<br>") + "</div>";
          }).join("");
      });
    }
  }

  /* ---------------- Animaciones sobre el lienzo ---------------- */

  function msVelocidad() {
    if (S.velocidad === "lenta") { return 900; }
    if (S.velocidad === "rapida") { return 250; }
    return 500;
  }

  function puntoEn(d) {
    return { x: d ? d.x : 0, y: d ? d.y : 0 };
  }

  function limpiarAnim() {
    while (S.capaAnim.firstChild) { S.capaAnim.removeChild(S.capaAnim.firstChild); }
  }

  function animarPing(resultado) {
    var miToken = ++S.animToken;
    limpiarAnim();
    if (!resultado || !resultado.saltos || !resultado.saltos.length) { return; }
    var svgNS = "http://www.w3.org/2000/svg";
    var puntos = resultado.saltos.map(function (s) {
      var d = buscarDisp(s.dispositivo);
      return puntoEn(d);
    });
    if (puntos.length < 2 && !resultado.exito) {
      var solo = document.createElementNS(svgNS, "circle");
      solo.setAttribute("cx", puntos[0].x); solo.setAttribute("cy", puntos[0].y - 30);
      solo.setAttribute("r", 8); solo.setAttribute("fill", "#b42318");
      S.capaAnim.appendChild(solo);
      return;
    }
    var marca = document.createElementNS(svgNS, "circle");
    marca.setAttribute("r", 7); marca.setAttribute("fill", resultado.exito ? "#1a7f37" : "#b42318");
    marca.setAttribute("stroke", "#fff"); marca.setAttribute("stroke-width", 2);
    S.capaAnim.appendChild(marca);
    if (movimientoReducido()) {
      var fin = puntos[puntos.length - 1];
      marca.setAttribute("cx", fin.x); marca.setAttribute("cy", fin.y - 30);
      if (!resultado.exito) {
        var cruzFija = document.createElementNS(svgNS, "text");
        cruzFija.setAttribute("x", fin.x + 10); cruzFija.setAttribute("y", fin.y - 24);
        cruzFija.setAttribute("font-size", "18"); cruzFija.setAttribute("fill", "#b42318");
        cruzFija.textContent = "✗";
        S.capaAnim.appendChild(cruzFija);
      }
      return;
    }
    var tramo = 0;
    var t0 = null;
    var dur = msVelocidad();
    function cuadro(t) {
      if (miToken !== S.animToken) { return; }
      if (t0 === null) { t0 = t; }
      var avance = (t - t0) / dur;
      if (avance >= 1) {
        tramo += 1; t0 = t;
        if (tramo >= puntos.length - 1) {
          marca.setAttribute("cx", puntos[puntos.length - 1].x);
          marca.setAttribute("cy", puntos[puntos.length - 1].y - 30);
          if (!resultado.exito) {
            var cruz = document.createElementNS(svgNS, "text");
            cruz.setAttribute("x", puntos[puntos.length - 1].x + 10);
            cruz.setAttribute("y", puntos[puntos.length - 1].y - 24);
            cruz.setAttribute("font-size", "18"); cruz.setAttribute("fill", "#b42318");
            cruz.textContent = "✗";
            S.capaAnim.appendChild(cruz);
          }
          return;
        }
        avance = 0;
      }
      var a = puntos[tramo], b = puntos[tramo + 1];
      marca.setAttribute("cx", a.x + (b.x - a.x) * avance);
      marca.setAttribute("cy", (a.y + (b.y - a.y) * avance) - 30);
      requestAnimationFrame(cuadro);
    }
    requestAnimationFrame(cuadro);
    registrar("animacion", "Animación del ping sobre " + resultado.saltos.length + " saltos (" + S.velocidad + ", cancelable con Esc o nuevo ping).");
  }

  function animarDhcp(resultado) {
    var miToken = ++S.animToken;
    limpiarAnim();
    var svgNS = "http://www.w3.org/2000/svg";
    var msgs = (resultado && resultado.mensajes) || [];
    if (!msgs.length) { return; }
    var i = 0;
    function siguiente() {
      if (miToken !== S.animToken) { return; }
      if (i >= msgs.length) { return; }
      limpiarAnim();
      var m = msgs[i];
      var o = buscarDisp(m.origen);
      var dt = (m.destino === "broadcast") ? null : buscarDisp(m.destino);
      if (m.destino === "broadcast" && o) {
        (S.topologia.dispositivos || []).forEach(function (d) {
          if (d.id === o.id) { return; }
          var l = document.createElementNS(svgNS, "line");
          l.setAttribute("x1", o.x); l.setAttribute("y1", o.y - 30);
          l.setAttribute("x2", d.x); l.setAttribute("y2", d.y - 30);
          l.setAttribute("stroke", "#0b5fa5"); l.setAttribute("stroke-width", 2);
          l.setAttribute("stroke-dasharray", "5 4");
          S.capaAnim.appendChild(l);
        });
        var t = document.createElementNS(svgNS, "text");
        t.setAttribute("x", o.x + 12); t.setAttribute("y", o.y - 36);
        t.setAttribute("font-size", "14"); t.textContent = m.tipo + " (difusión: así se ve un broadcast)";
        S.capaAnim.appendChild(t);
      } else if (o && dt) {
        var l2 = document.createElementNS(svgNS, "line");
        l2.setAttribute("x1", o.x); l2.setAttribute("y1", o.y - 30);
        l2.setAttribute("x2", dt.x); l2.setAttribute("y2", dt.y - 30);
        l2.setAttribute("stroke", "#1a7f37"); l2.setAttribute("stroke-width", 3);
        S.capaAnim.appendChild(l2);
        var t2 = document.createElementNS(svgNS, "text");
        t2.setAttribute("x", (o.x + dt.x) / 2 + 8); t2.setAttribute("y", (o.y + dt.y) / 2 - 34);
        t2.setAttribute("font-size", "14"); t2.textContent = m.tipo;
        S.capaAnim.appendChild(t2);
      }
      registrar("dhcp", "DORA sobre el lienzo: " + m.tipo + " " + m.origen + " → " + m.destino + ".");
      i += 1;
      setTimeout(siguiente, msVelocidad());
    }
    // Con movimiento reducido se muestra sólo el último mensaje (el ACK o el
    // último que se llegó a enviar), sin la secuencia animada.
    if (movimientoReducido()) { i = msgs.length - 1; }
    siguiente();
  }

  function solicitarDhcp(idDisp, idIf) {
    if (!S.estado) { reconstruirEstado(); }
    var res;
    try { res = Motor.dhcpSolicitar(S.estado, idDisp, idIf); }
    catch (e) { registrar("D16", "DHCP falló: " + e.message); return res; }
    S.topologia = clonar(S.estado.topologia);
    reconstruirEstado(); renderTodo();
    animarDhcp(res);
    return res;
  }

  /* ---------------- Registro, persistencia, importar/exportar ---------------- */

  function registrar(codigo, texto) {
    var linea = "[" + momentoAbs() + " " + momentoRel() + "] " + codigo + " — " + texto;
    S.registro.push(linea);
    if (S.registro.length > 400) { S.registro.shift(); }
    if (typeof codigo === "string" && /^D\d/.test(codigo)) {
      consolaAgregar(codigo + " — " + texto, true);
    }
  }

  function autoguardar() {
    function guardar() {
      try {
        localStorage.setItem("simuladorRedes.topologia", JSON.stringify(S.topologia));
      } catch (e) {
        if (!S.avisoGuardado) {
          S.avisoGuardado = true;
          registrar("guardado", "El navegador bloqueó el autoguardado; la aplicación sigue andando sin guardar.");
        }
      }
    }
    try {
      var previa = localStorage.getItem("simuladorRedes.topologia");
      if (previa && (!S.topologia || !(S.topologia.dispositivos || []).length)) {
        var imp = Escenarios.importar(previa);
        if (imp.ok) { S.topologia = imp.topologia; reconstruirEstado(); }
      }
    } catch (e) { /* sin guardado previo: se sigue igual */ }
    setInterval(guardar, 30000);
    window.addEventListener("beforeunload", guardar);
  }

  function importarPorArchivo() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.addEventListener("change", function () {
      if (inp.files && inp.files[0]) { importarTextoDeArchivo(inp.files[0]); }
    });
    inp.click();
  }

  function importarTextoDeArchivo(archivo) {
    var lector = new FileReader();
    lector.onload = function () {
      var res;
      try { res = Escenarios.importar(String(lector.result)); }
      catch (e) { registrar("importar", "Archivo inválido: " + e.message); return; }
      if (!res.ok) {
        registrar("importar", "El archivo no pasó la validación: " + res.errores.map(function (x) { return x.mensaje; }).join(" | "));
        return;
      }
      empujarHistorial();
      cargarTopologia(res.topologia);
      registrar("importar", "Topología importada: " + (res.topologia.nombre || "sin nombre") + ".");
    };
    lector.readAsText(archivo);
  }

  function exportarActual() {
    try {
      var blob = new Blob([Escenarios.exportar(S.topologia)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "topologia.json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { registrar("exportar", "No se pudo exportar."); }
  }

  /* ---------------- API pública ---------------- */

  function renderTodo() {
    renderLienzo();
    renderPropiedades();
    renderInferior();
    refrescarCalculo();
    var botones = S.raiz.querySelectorAll("[data-modo]");
    for (var i = 0; i < botones.length; i++) {
      var esActivo = botones[i].getAttribute("data-modo") === S.modo;
      botones[i].classList.toggle("activo", esActivo);
      botones[i].setAttribute("aria-pressed", String(esActivo));
    }
  }

  function cargarTopologia(topologia) {
    S.topologia = clonar(topologia);
    S.seleccionado = null; S.enlaceSel = null;
    S.deshacer = []; S.rehacer = [];
    reconstruirEstado();
    recontarNombres();
    renderTodo();
  }

  function topologiaActual() {
    return clonar(S.topologia);
  }

  function seleccionarEnlace(idEnlace) {
    S.seleccionado = null;
    S.enlaceSel = idEnlace;
    renderLienzo();
    renderPropiedades();
  }

  function seleccionar(idDispositivo) {
    S.seleccionado = idDispositivo;
    S.enlaceSel = null;
    renderLienzo();
    renderPropiedades();
    refrescarCalculo();
  }

  function setModo(modo) {
    S.modo = modo;
    if (modo === "subredes") { S.pestañaInf = "calculo"; }
    else if (modo === "desafio") { S.pestañaInf = "ayuda"; }
    else { S.pestañaInf = "simulacion"; }
    renderTodo();
    registrar("modo", "Modo " + modo + ". La topología cargada no cambió." +
      (modo === "docente" ? " Advertencias preventivas apagadas." : ""));
  }

  return {
    iniciar: iniciar,
    cargarTopologia: cargarTopologia,
    topologiaActual: topologiaActual,
    seleccionar: seleccionar,
    animarPing: animarPing,
    animarDhcp: animarDhcp,
    setModo: setModo,
    registrar: registrar
  };
})();

</script>
<script>
/* capa5-autotest.js — Capa 5: ensamblado lógico, Autotest y arranque.
 *
 * Objeto global `Autotest` con `correr()` según el §2 de 05-capa5-ensamblado.
 * No reescribe ninguna capa anterior: sólo lee `Red`, `Motor`, `Escenarios`
 * y `UI`. JavaScript vanilla, sin DOM salvo para inspeccionar lo que la
 * capa 4 ya dibujó y para mostrar el informe.
 *
 * Convenciones:
 * - Español rioplatense en textos, comentarios y variables.
 * - Ninguna petición de red, ninguna referencia externa.
 * - Los criterios que mutan trabajan sobre copias profundas.
 * - Al terminar se restaura la topología y el modo del usuario.
 * - Las agujas de búsqueda (nombres de APIs de red y palabras de relleno)
 *   se arman por partes para que el propio código no las contenga en texto.
 */

var Autotest = (function () {
  "use strict";

  function clonar(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function ejemploPorId(id) {
    for (var i = 0; i < Escenarios.EJEMPLOS.length; i++) {
      if (Escenarios.EJEMPLOS[i].id === id) {
        return Escenarios.EJEMPLOS[i];
      }
    }
    return null;
  }

  function dispEn(topo, id) {
    var lista = topo.dispositivos || [];
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].id === id) {
        return lista[i];
      }
    }
    return null;
  }

  function ifaceEn(disp, idIf) {
    if (!disp || !disp.interfaces) {
      return null;
    }
    for (var i = 0; i < disp.interfaces.length; i++) {
      if (disp.interfaces[i].id === idIf) {
        return disp.interfaces[i];
      }
    }
    return null;
  }

  function enlaceEn(topo, id) {
    var lista = topo.enlaces || [];
    for (var i = 0; i < lista.length; i++) {
      if (lista[i].id === id) {
        return lista[i];
      }
    }
    return null;
  }

  function fila(n, criterio, pasa, detalle) {
    return { n: n, criterio: criterio, pasa: !!pasa, detalle: detalle || "" };
  }

  function modoActualDom() {
    try {
      var activo = document.querySelector(".simbarra [data-modo].activo");
      if (activo) {
        return activo.getAttribute("data-modo");
      }
    } catch (e) {
      /* sin DOM: se sigue igual */
    }
    return "topologia";
  }

  /* Agujas armadas por partes: el fuente nunca trae los literales juntos. */
  function agujaRed() {
    var a = "fe" + "tch";
    var b = "XML" + "HttpRequest";
    var c = "im" + "port(";
    return { a: a, b: b, c: c };
  }

  function agujaRelleno() {
    var a = "TO" + "DO";
    var b = "lo" + "rem";
    var c = "FIX" + "ME";
    return [a, b, c];
  }

  function crit01() {
    var nombre = "El archivo no hace ninguna petición de red";
    try {
      var html = document.documentElement.outerHTML || "";
      var ag = agujaRed();
      var bajos = html.toLowerCase();
      var tieneFetch = html.indexOf(ag.a + "(") >= 0 || html.indexOf(ag.a + " (") >= 0;
      var tieneXhr = html.indexOf(ag.b) >= 0;
      var tieneImportDin = html.indexOf(ag.c) >= 0 || html.indexOf(ag.c.trim()) >= 0 && false;
      var imp = "im" + "port";
      var tieneImportFn = new RegExp("\\b" + imp + "\\s*\\(").test(html);
      var srcExt = /<(script|img|iframe)[^>]+\bsrc\s*=\s*["']\s*(https?:|\/\/)/i.test(html);
      var hrefExt = /<link[^>]+\bhref\s*=\s*["']\s*(https?:|\/\/)/i.test(html);
      var cssUrlExt = /url\s*\(\s*["']?\s*(https?:|\/\/)/i.test(html);
      var problemas = [];
      if (tieneFetch) {
        problemas.push("aparece llamada de red (" + ag.a + ")");
      }
      if (tieneXhr) {
        problemas.push("aparece " + ag.b);
      }
      if (tieneImportFn || tieneImportDin) {
        problemas.push("aparece carga dinámica de módulos");
      }
      if (srcExt) {
        problemas.push("hay etiqueta con src externo");
      }
      if (hrefExt) {
        problemas.push("hay etiqueta con href externo");
      }
      if (cssUrlExt) {
        problemas.push("hay url externa en estilos");
      }
      /* Los blobs locales (URL.createObjectURL) no son red: se admiten. */
      void bajos;
      if (problemas.length === 0) {
        return fila(1, nombre, true, "Sin llamadas de red ni referencias externas en el documento.");
      }
      return fila(1, nombre, false, "Se esperaba cero referencias externas y se encontró: " + problemas.join("; ") + ".");
    } catch (e) {
      return fila(1, nombre, false, "No se pudo inspeccionar el documento: " + e.message);
    }
  }

  function crit02() {
    var nombre = "La topología complejo permite un ping exitoso de punta a punta";
    try {
      var ej = ejemploPorId("complejo");
      if (!ej) {
        return fila(2, nombre, false, "No se encontró el ejemplo de id complejo en Escenarios.EJEMPLOS.");
      }
      var estado = Motor.crearEstado(clonar(ej.topologia));
      var res = Motor.ping(estado, "pc-admin", "10.45.7.122");
      if (res.exito) {
        return fila(2, nombre, true, "Ping de pc-admin a 10.45.7.122 con exito true y " + res.saltos.length + " saltos.");
      }
      var cod = res.diagnostico ? res.diagnostico.codigo : "sin diagnóstico";
      return fila(2, nombre, false, "Se esperaba exito true y se obtuvo falla con código " + cod + ".");
    } catch (e) {
      return fila(2, nombre, false, "Excepción: " + e.message);
    }
  }

  function crit03() {
    var nombre = "Cambiar la máscara de un PC de /27 a /28 rompe el ping al gateway con D09";
    try {
      var ej = ejemploPorId("complejo");
      var topo = clonar(ej.topologia);
      var pc = dispEn(topo, "pc-admin");
      var eth = ifaceEn(pc, "eth0");
      /* La IP 10.45.7.66/28 seguiría compartiendo red 10.45.7.64 con el
       * gateway 10.45.7.65, así que con aritmética correcta no hay D09.
       * Se usa la última IP válida del /27 (10.45.7.94): con /27 anda y
       * con /28 el gateway queda en otro bloque (64 contra 80). */
      eth.ip = "10.45.7.94";
      eth.prefijo = 27;

  function armarMiniDhcp() {
    function iface(id, medio, ip, prefijo, habilitada) {
      return { id: id, nombre: id, medio: medio, habilitada: !!habilitada, modo: "estatico", ip: ip, prefijo: prefijo };
    }
    function pcCon(id, x, y) {
      return {
        id: id, tipo: "pc", nombre: id, x: x, y: y, encendido: true,
        interfaces: [iface("eth0", "ethernet", null, 24, true), iface("wlan0", "wireless", null, 24, false)],
        gateway: null, dns: null, rutas: [], dhcp: null
      };
    }
    function swCon(id, x, y) {
      var lista = [];
      for (var i = 1; i <= 8; i++) {
        lista.push(iface("fa0/" + i, "ethernet", null, 24, true));
      }
      lista.push(iface("fib0", "fibra", null, 24, true));
      return { id: id, tipo: "switch-l2", nombre: id, x: x, y: y, encendido: true, interfaces: lista, gateway: null, dns: null, rutas: [], dhcp: null };
    }
    var router = {
      id: "r-dhcp", tipo: "router", nombre: "R-DHCP", x: 400, y: 200, encendido: true,
      interfaces: [
        iface("g0/0", "ethernet", "192.168.1.1", 24, true),
        iface("g0/1", "ethernet", null, 24, true),
        iface("fib0", "fibra", null, 24, true),
        iface("wlan0", "wireless", null, 24, false)
      ],
      gateway: null, dns: null, rutas: [],
      dhcp: { habilitado: true, desde: "192.168.1.50", hasta: "192.168.1.60", prefijo: 24, gateway: "192.168.1.1" }
    };
    return {
      version: 1,
      nombre: "mini dhcp",
      dispositivos: [router, pcCon("c1", 120, 200), swCon("sw1", 260, 200)],
      enlaces: [
        { id: "l1", a: { dispositivo: "r-dhcp", interfaz: "g0/0" }, b: { dispositivo: "sw1", interfaz: "fa0/1" }, tipo: "ethernet", estado: "up", velocidadMbps: 100, retardoMs: 1 },
        { id: "l2", a: { dispositivo: "c1", interfaz: "eth0" }, b: { dispositivo: "sw1", interfaz: "fa0/2" }, tipo: "ethernet", estado: "up", velocidadMbps: 100, retardoMs: 1 }

      if (!svg) {

      var mundo = svg.querySelector("g");
      if (!mundo || mundo.children.length < 2) {
        return fila(15, nombre, false, "El SVG no tiene las capas de enlaces y nodos.");
      }
      var capaEn = mundo.children[0];
      var capaNo = mundo.children[1];
      var pos = {};
      (topo.dispositivos || []).forEach(function (d) {
        pos[d.id] = { x: d.x, y: d.y };
      });
      /* Puertos en coordenadas de mundo: translate del nodo + centro del rect. */
      var puertos = [];
      for (var ni = 0; ni < capaNo.children.length; ni++) {
        var nodo = capaNo.children[ni];
        var tr = nodo.getAttribute("transform") || "";
        var mt = tr.match(/translate\(\s*([0-9.\-]+)[,\s]+([0-9.\-]+)\s*\)/);
        var nx = mt ? parseFloat(mt[1]) : 0;
        var ny = mt ? parseFloat(mt[2]) : 0;
        var rects = nodo.querySelectorAll("rect.puerto");
        for (var ri = 0; ri < rects.length; ri++) {
          var px = parseFloat(rects[ri].getAttribute("x"));
          var py = parseFloat(rects[ri].getAttribute("y"));
          var pw = parseFloat(rects[ri].getAttribute("width") || "10");
          var ph = parseFloat(rects[ri].getAttribute("height") || "10");
          puertos.push({ x: nx + px + pw / 2, y: ny + py + ph / 2 });
        }
      }
      if (!puertos.length) {
        return fila(15, nombre, false, "No se encontraron rectángulos de puerto en el lienzo.");
      }
      function cercaDePuertos(x, y) {
        var mejor = Infinity;
        for (var i = 0; i < puertos.length; i++) {
          var dx = puertos[i].x - x;
          var dy = puertos[i].y - y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < mejor) {
            mejor = d;
          }
        }
        return mejor;
      }
      function cercaDeCentro(x, y) {
        var mejor = Infinity;
        Object.keys(pos).forEach(function (id) {
          var dx = pos[id].x - x;
          var dy = pos[id].y - y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < mejor) {
            mejor = d;
          }
        });
        return mejor;
      }
      var dibujos = capaEn.querySelectorAll("line,path");
      if (!dibujos.length) {
        return fila(15, nombre, false, "No se encontraron líneas de enlace en la capa de enlaces.");
      }
      var centros = 0;
      var lejos = 0;
      for (var di = 0; di < dibujos.length; di++) {
        var dib = dibujos[di];
        var puntos = [];
        if (dib.tagName.toLowerCase() === "line") {
          puntos.push({ x: parseFloat(dib.getAttribute("x1")), y: parseFloat(dib.getAttribute("y1")) });
          puntos.push({ x: parseFloat(dib.getAttribute("x2")), y: parseFloat(dib.getAttribute("y2")) });
        } else {
          var dAt = dib.getAttribute("d") || "";
          var nums = dAt.match(/[0-9.\-]+/g) || [];
          if (nums.length >= 4) {
            puntos.push({ x: parseFloat(nums[0]), y: parseFloat(nums[1]) });
            puntos.push({ x: parseFloat(nums[nums.length - 2]), y: parseFloat(nums[nums.length - 1]) });
          }
        }
        for (var pi = 0; pi < puntos.length; pi++) {
          var aPuerto = cercaDePuertos(puntos[pi].x, puntos[pi].y);
          var aCentro = cercaDeCentro(puntos[pi].x, puntos[pi].y);
          if (aPuerto <= 14) {
            continue;
          }
          if (aCentro <= 6) {
            centros += 1;
          } else {
            lejos += 1;
          }
        }
      }
      void numeroDe;
      if (centros === 0 && lejos === 0) {
        return fila(15, nombre, true, "Los " + dibujos.length + " enlaces dibujados nacen y mueren a menos de 14 unidades de un puerto.");
      }
      return fila(15, nombre, false, "Defecto de la capa 4 sin parchar por contrato: " + centros +
        " extremos caen en el centro del ícono y " + lejos + " lejos de todo puerto; los cables se dibujan de centro a centro.");
    } catch (e) {
      return fila(15, nombre, false, "Excepción: " + e.message);
    }
  }

  function crit16() {
    var nombre = "No queda ningún texto de relleno pendiente y la interfaz está en español";
    try {
      var clon = document.documentElement.cloneNode(true);
      var Basura = clon.querySelectorAll("script,style");
      for (var i = 0; i < Basura.length; i++) {
        Basura[i].remove();
      }
      var visible = (clon.textContent || "") + " " + (document.documentElement.getAttribute("lang") || "");
      var agujas = agujaRelleno();
      var halladas = [];
      /* La primera aguja se busca exacta (mayúsculas); las otras sin importar caso. */
      if (visible.indexOf(agujas[0]) >= 0) {
        halladas.push(agujas[0]);
      }
      var baja = visible.toLowerCase();
      if (baja.indexOf(agujas[1].toLowerCase()) >= 0) {
        halladas.push(agujas[1]);
      }
      if (visible.indexOf(agujas[2]) >= 0) {
        halladas.push(agujas[2]);
      }
      var prob = [];
      if (halladas.length) {
        prob.push("aparece texto de relleno: " + halladas.join(", "));
      }
      var lang = (document.documentElement.getAttribute("lang") || "").toLowerCase();
      if (lang.indexOf("es") !== 0) {
        prob.push("el documento no declara lang es (trae '" + lang + "')");
      }
      var cuerpo = (document.body.textContent || "").toLowerCase();
      var claves = ["simulación", "topología", "puerta de enlace"];
      var alguna = claves.some(function (k) { return cuerpo.indexOf(k) >= 0; });
      if (!alguna) {
        prob.push("no se encontraron rótulos de cátedra en español (Simulación, Topología, puerta de enlace)");
      }
      if (prob.length === 0) {
        return fila(16, nombre, true, "Sin relleno visible y con interfaz en español (lang " + lang + ").");
      }
      return fila(16, nombre, false, "Falla: " + prob.join("; ") + ".");
    } catch (e) {
      return fila(16, nombre, false, "Excepción: " + e.message);
    }
  }

  function mostrarInforme(salida) {
    try {
      var previos = document.querySelectorAll("[data-autotest-informe]");
      for (var i = 0; i < previos.length; i++) {
        previos[i].remove();
      }
      var caja = document.createElement("div");
      caja.setAttribute("data-autotest-informe", "1");
      caja.style.position = "fixed";
      caja.style.right = "12px";
      caja.style.bottom = "12px";
      caja.style.width = "min(520px, 92vw)";
      caja.style.maxHeight = "70vh";
      caja.style.overflow = "auto";
      caja.style.background = "#fff";
      caja.style.color = "#182430";
      caja.style.border = "2px solid #0b5fa5";
      caja.style.borderRadius = "10px";
      caja.style.padding = "12px 14px";
      caja.style.zIndex = "9999";
      caja.style.fontFamily = "system-ui, Arial, sans-serif";
      caja.style.fontSize = "13px";
      var titulo = document.createElement("div");
      titulo.innerHTML = "<b>Autotest: " + salida.pasadas + "/" + salida.total + " criterios</b> " +
        "<span>(" + salida.fallos + " fallos primero)</span>";
      caja.appendChild(titulo);
      var lista = document.createElement("div");
      salida.resultados.forEach(function (r) {
        var div = document.createElement("div");
        div.style.border = "1px solid #c9d3dc";
        div.style.borderLeft = r.pasa ? "6px solid #1a7f37" : "6px solid #b42318";
        div.style.borderRadius = "6px";
        div.style.padding = "4px 8px";
        div.style.margin = "6px 0";
        var safeC = String(r.criterio).replace(/&/g, "&amp;").replace(/</g, "&lt;");
        var safeD = String(r.detalle || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
        div.innerHTML = "<b>" + r.n + ". " + safeC + "</b> " + (r.pasa ? "pasa" : "falla") + "<br>" + safeD;
        lista.appendChild(div);
      });
      caja.appendChild(lista);
      var cerrar = document.createElement("button");
      cerrar.textContent = "Cerrar informe";
      cerrar.style.padding = "4px 10px";
      cerrar.addEventListener("click", function () {
        caja.remove();
      });
      caja.appendChild(cerrar);
      document.body.appendChild(caja);
    } catch (e) {
      /* el informe por consola queda igual */
    }
  }

  function correr() {
    if (typeof Red === "undefined" || typeof Motor === "undefined" ||
        typeof Escenarios === "undefined" || typeof UI === "undefined") {
      try {
        document.getElementById("app").innerHTML =
          "<p style='font-family:system-ui;padding:20px'>Falta una capa: el ensamblado quedó incompleto " +
          "(revisá que los cinco bloques script estén pegados en orden). El autotest no puede correr.</p>";
      } catch (e) {
        /* se sigue igual */
      }
      return { total: 0, pasadas: 0, resultados: [], detalleCapas: "capas faltantes", fallos: 0 };
    }
    var respaldoTopo = null;
    var respaldoModo = "topologia";
    var teniaUI = true;
    try {
      respaldoModo = modoActualDom();
    } catch (e) {
      respaldoModo = "topologia";
    }
    try {
      if (teniaUI) {
        respaldoTopo = UI.topologiaActual();
      }
    } catch (e) {
      respaldoTopo = null;
    }
    /* Las animaciones se pausan envolviendo los dibujos: se restauran al salir. */
    var originalPing = UI ? UI.animarPing : null;
    var originalDhcp = UI ? UI.animarDhcp : null;
    try {
      if (UI) {
        UI.animarPing = function () { /* autotest sin animaciones */ };
        UI.animarDhcp = function () { /* autotest sin animaciones */ };
      }
    } catch (e) {
      /* si no se puede envolver, se sigue igual */
    }

    var resultados = [];
    var pasadasCapas = 0;
    var totalCapas = 0;
    var detalleCapas = "";
    try {
      var r1 = Red.autopruebas();
      var r2 = Motor.autopruebas();
      var r3 = Escenarios.autopruebas();
      totalCapas = r1.total + r2.total + r3.total;
      pasadasCapas = r1.pasadas + r2.pasadas + r3.pasadas;
      var fallosCapas = r1.fallos.concat(r2.fallos).concat(r3.fallos).slice(0, 8);
      detalleCapas = "Capas 1–3: " + pasadasCapas + "/" + totalCapas + " pruebas internas." +
        (fallosCapas.length ? " Primeros fallos: " + fallosCapas.map(function (f) { return f.nombre; }).join(" | ") + "." : " Sin fallos internos.");
    } catch (e) {
      detalleCapas = "No se pudieron correr las autopruebas internas: " + e.message;
    }

    try {
      resultados.push(crit01());
      resultados.push(crit02());
      resultados.push(crit03());
      resultados.push(crit04());
      resultados.push(crit05());
      resultados.push(crit06());
      resultados.push(crit07());
      resultados.push(crit08());
      resultados.push(crit09());
      resultados.push(crit10());
      resultados.push(crit11());
      resultados.push(crit12());
      resultados.push(crit13());
      resultados.push(crit14());
      resultados.push(crit15());
      resultados.push(crit16());
    } finally {
      try {
        if (UI) {
          if (originalPing) {
            UI.animarPing = originalPing;
          }
          if (originalDhcp) {
            UI.animarDhcp = originalDhcp;
          }
        }
      } catch (e) {
        /* se sigue igual */
      }
      try {
        if (teniaUI && respaldoTopo) {
          UI.cargarTopologia(respaldoTopo);
          UI.setModo(respaldoModo);
        }
      } catch (e) {
        /* no se pierde el trabajo: ya se trabajó sobre copias */
      }
    }

    var pasadas = 0;
    resultados.forEach(function (r) {
      if (r.pasa) {
        pasadas += 1;
      }
    });
    /* Fallos primero para leer rápido qué arreglar. */
    var ordenados = resultados.slice().sort(function (a, b) {
      if (a.pasa === b.pasa) {
        return a.n - b.n;
      }
      return a.pasa ? 1 : -1;
    });
    var salida = {
      total: totalCapas + resultados.length,
      pasadas: pasadasCapas + pasadas,
      resultados: ordenados,
      detalleCapas: detalleCapas,
      fallos: totalCapas + resultados.length - (pasadasCapas + pasadas)
    };
    try {
      if (UI && UI.registrar) {
        UI.registrar("autotest", "Autotest " + salida.pasadas + "/" + salida.total + ". " + detalleCapas);
      }
    } catch (e) {
      /* se sigue igual */
    }
    mostrarInforme(salida);
    return salida;
  }

  function cablearBoton() {
    try {
      var barra = document.querySelector(".siminf .tabs");
      if (!barra || document.querySelector("[data-boton-autotest5]")) {
        return;
      }
      var b = document.createElement("button");
      b.setAttribute("data-boton-autotest5", "1");
      b.textContent = "Autotest completo";
      b.title = "Corre los 16 criterios de aceptación sin perder el trabajo cargado";
      b.addEventListener("click", function () {
        correr();
      });
      barra.appendChild(b);
    } catch (e) {
      /* el objeto Autotest queda igual disponible por consola */
    }
  }

  function arrancar() {
    if (typeof Red === "undefined" || typeof Motor === "undefined" ||
        typeof Escenarios === "undefined" || typeof UI === "undefined") {
      document.getElementById("app").innerHTML =
        "<p style='font-family:system-ui;padding:20px'>Falta una capa: el ensamblado quedó incompleto " +
        "(revisá que los cinco bloques script estén pegados en orden).</p>";
      return;
    }
    var ej = ejemploPorId("complejo");
    var inicial = ej ? ej.topologia : Escenarios.EJEMPLOS[0].topologia;
    UI.iniciar(document.getElementById("app"), clonar(inicial));
    cablearBoton();
    /* La capa 4 reconstruye la franja inferior en cada render: el observador
     * repone el botón si un repintado lo barre. No toca ninguna capa. */
    try {
      var raiz = document.getElementById("app");
      if (raiz && typeof MutationObserver !== "undefined") {
        var obs = new MutationObserver(function () {
          if (!document.querySelector("[data-boton-autotest5]")) {
            cablearBoton();
          }
        });
        obs.observe(raiz, { childList: true, subtree: true });
      }
    } catch (e) {
      /* sin observador el botón igual queda tras el arranque */
    }
  }

  return {
    correr: correr,
    arrancar: arrancar
  };
})();

if (typeof window !== "undefined") {
  window.Autotest = Autotest;
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      Autotest.arrancar();
    });
  } else {
    Autotest.arrancar();
  }
}

</script>
